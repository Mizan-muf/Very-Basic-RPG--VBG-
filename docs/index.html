when resisting horror jump-scares, gore shock, and panic.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Pain Tolerance:</strong> +1 to remaining functional while carrying traumatic conditions.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Adrenaline Spike:</strong> +1 to your next action roll immediately after soaking a hit.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Steady Hands:</strong> +1 to Focus rolls when performing delicate medical surgery or bomb defusal under fire.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Second Wind:</strong> +1 to Force checks when at 1 Strain remaining to avoid collapsing.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Biological Resistance:</strong> +1 to resisting viral advancement on initial exposure rolls.</p>\n<h3 class=\"term-h3\">Technical & Scavenging</h3>\n<p class=\"term-ol-item\">\u2022 <strong>Scrap Gunsmith:</strong> +1 to clearing firearm jams and inspecting weapon quality.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Hoarder's Eye:</strong> +1 to finding concealed ammo boxes or hidden key items in ransacked rooms.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Jury-Rigger:</strong> +1 to making temporary field repairs on broken tools or barricades.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Lockpick Finesse:</strong> +1 when picking mechanical tumbler locks with hairpin tools.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Hotwire Touch:</strong> +1 when starting vehicles or powering generators without the original keys.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Pack Optimizer:</strong> +1 when organizing gear (allows stacking 1 extra small item per slot).</p>\n<p class=\"term-ol-item\">\u2022 <strong>Blueprint Reader:</strong> +1 to navigating unfamiliar facilities using discovered building maps.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Electronic Bypass:</strong> +1 to rerouting circuit breaker panels and security consoles.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Keyring Intuition:</strong> +1 to identifying which door a discovered key or crest belongs to.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Resource Scrimper:</strong> +1 to Focus checks when rationing supplies during extended sieges.</p>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">3. TACTICAL SPECIALIZATIONS (DOMAINS)</h2>\n<p class=\"term-p\"><em>Choose 1 Specialization Domain. Abilities cost Strain to perform exceptional tactical feats (Capped at 0\u20132 Strain).</em></p>\n<h3 class=\"term-h3\">1. Close-Quarters Defense (CQC)</h3>\n<ul class=\"term-ul\">\n<li><strong>Minor (0 Strain):</strong> <em>Defensive Shove</em> \u2014 A swift physical push or kick that staggers 1 basic shambler back into Close range.</li>\n<li><strong>Standard (1 Strain):</strong> <em>Knife Counter</em> \u2014 Instantly parry an incoming grab with a combat blade, negating the hit without marking a knife durability box.</li>\n<li><strong>Major (2 Strain):</strong> <em>Crowd Cleave / Sweep</em> \u2014 A sweeping heavy strike or tackle that knocks down 2\u20133 clustered enemies, creating an immediate escape path.</li>\n</ul>\n<h3 class=\"term-h3\">2. Precision Marksmanship</h3>\n<ul class=\"term-ul\">\n<li><strong>Minor (0 Strain):</strong> <em>Aimed Double-Tap</em> \u2014 Spend a Minor action to brace; your next handgun shot deals maximum stopping power.</li>\n<li><strong>Standard (1 Strain):</strong> <em>Called Shot (Weak Point)</em> \u2014 Target a designated anatomical weak spot (exposed brain, knee joint), bypassing 1 enemy Armor box on success.</li>\n<li><strong>Major (2 Strain):</strong> <em>Deadeye Penetration</em> \u2014 Fire a piercing high-caliber shot that lines up and hits two enemies in a row or severs an environmental support cable.</li>\n</ul>\n<h3 class=\"term-h3\">3. Field Medicine & Triage</h3>\n<ul class=\"term-ul\">\n<li><strong>Minor (0 Strain):</strong> <em>Rapid Diagnostic</em> \u2014 Instantly identify an ally\u2019s exact Infection Stage, internal fractures, or wound severity with a glance.</li>\n<li><strong>Standard (1 Strain):</strong> <em>Combat Suture</em> \u2014 Clear the <strong>Bleeding</strong> condition from yourself or an adjacent ally in a single action without consuming an herb.</li>\n<li><strong>Major (2 Strain):</strong> <em>Emergency Adrenaline</em> \u2014 Administer an emergency adrenaline jolt to a Downed ally, stabilizing them to 1 Strain immediately.</li>\n</ul>\n<h3 class=\"term-h3\">4. Structural Fortification & Traps</h3>\n<ul class=\"term-ul\">\n<li><strong>Minor (0 Strain):</strong> <em>Door Wedge</em> \u2014 Jam a wooden door shut or identify the weakest reinforcement point in a room.</li>\n<li><strong>Standard (1 Strain):</strong> <em>Reinforced Barricade</em> \u2014 Fasten boards and heavy furniture across a threshold; the barricade soaks 2 enemy hits before breaking.</li>\n<li><strong>Major (2 Strain):</strong> <em>Environmental Deadfall</em> \u2014 Trigger a pre-rigged heavy deadfall, electrical wire puddle, or gas cylinder trap to engulf a doorway.</li>\n</ul>\n<h3 class=\"term-h3\">5. Infiltration & Evasion</h3>\n<ul class=\"term-ul\">\n<li><strong>Minor (0 Strain):</strong> <em>Ghost Step</em> \u2014 Cross an open corridor or doorway without alerting wandering shamblers.</li>\n<li><strong>Standard (1 Strain):</strong> <em>Combat Roll / Dive</em> \u2014 Execute an evasive dive to completely dodge an incoming lunging strike, Licker tongue, or pounce.</li>\n<li><strong>Major (2 Strain):</strong> <em>Smoke / Flash Escape</em> \u2014 Deploy an improvised flare, fire extinguisher fog, or flash to break line of sight, allowing the entire party to disengage.</li>\n</ul>\n<h3 class=\"term-h3\">6. Bio-Chemical Warfare</h3>\n<ul class=\"term-ul\">\n<li><strong>Minor (0 Strain):</strong> <em>Strain Identification</em> \u2014 Identify the specific viral strain, mutation trigger, and behavioral flaw of a novel B.O.W.</li>\n<li><strong>Standard (1 Strain):</strong> <em>Volatile Mixture</em> \u2014 Synthesize a caustic acid vial or incendiary chemical flask from lab supplies in 1 action.</li>\n<li><strong>Major (2 Strain):</strong> <em>Viral Suppressant</em> \u2014 Synthesize an emergency chemical suppressant that halts an infected survivor\u2019s virus progression for 24 hours.</li>\n</ul>\n<h3 class=\"term-h3\">7. Heavy Weapon Demolitions</h3>\n<ul class=\"term-ul\">\n<li><strong>Minor (0 Strain):</strong> <em>Blast Calculation</em> \u2014 Gauge the exact blast radius and structural impact of an explosive before detonation.</li>\n<li><strong>Standard (1 Strain):</strong> <em>Breaching Blast</em> \u2014 Direct a shotgun blast or explosive charge to instantly clear a barricaded doorway or staggered mob choke point.</li>\n<li><strong>Major (2 Strain):</strong> <em>Shockwave Stagger</em> \u2014 Detonate a heavy explosive or point-blank kinetic blast that forces a Boss-tier Stalker/Tyrant into a 1-Scene Stunned Stasis.</li>\n</ul>\n<h3 class=\"term-h3\">8. Tactical Leadership & Overwatch</h3>\n<ul class=\"term-ul\">\n<li><strong>Minor (0 Strain):</strong> <em>Coordinated Callout</em> \u2014 Call out an enemy\u2019s flanking vector, granting an ally +1 to their next reaction roll.</li>\n<li><strong>Standard (1 Strain):</strong> <em>Rallying Composure</em> \u2014 Shout tactical commands to instantly clear the <strong>Panicked</strong> condition from an ally within room reach.</li>\n<li><strong>Major (2 Strain):</strong> <em>Covering Fire Protocol</em> \u2014 Lay down continuous suppressive fire that lets all allies move between zones without taking opportunity attacks.</li>\n</ul>\n<h3 class=\"term-h3\">9. Pointman & Shield Bearer</h3>\n<ul class=\"term-ul\">\n<li><strong>Minor (0 Strain):</strong> <em>Shield Brace</em> \u2014 Raise a riot shield or heavy door; grants +1 Armor box against frontal attacks for the turn.</li>\n<li><strong>Standard (1 Strain):</strong> <em>Bodyguard Intercept</em> \u2014 Dive in front of an ally to take an incoming strike onto your own worn armor instead of them.</li>\n<li><strong>Major (2 Strain):</strong> <em>Bulldozer Charge</em> \u2014 Charge forward with a shield/heavy object, slamming through a zombie cluster and knocking enemies to the floor.</li>\n</ul>\n<h3 class=\"term-h3\">10. Underground Logistics & Scrounging</h3>\n<ul class=\"term-ul\">\n<li><strong>Minor (0 Strain):</strong> <em>Cache Scent</em> \u2014 Sense hidden compartments behind loose brickwork, floorboards, or vending machines.</li>\n<li><strong>Standard (1 Strain):</strong> <em>Ammo Optimization</em> \u2014 Combine loose ammunition boxes to recover +3 extra rounds from spent casings and scrap.</li>\n<li><strong>Major (2 Strain):</strong> <em>Secret Passage Routing</em> \u2014 Locate a maintenance shaft, dumbwaiter, or drainage conduit that completely bypasses a locked or guarded corridor.</li>\n</ul>"}, "VBG-Z Player Rulebook": {"title": "VBG-Z Player Rulebook", "folder": "01 - RULES & ENGINE", "path": "01 - RULES & ENGINE/VBG-Z Player Rulebook.md", "html": "<h1 class=\"term-h1\">VERY BASIC RPG: ZOMBIE SURVIVAL EDITION (VBG-Z) v2.0</h1>\n<p class=\"term-p\"><em>A lightweight d20 ruleset for asynchronous Play-by-Post survival horror.</em></p>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">1. THE CORE ENGINE</h2>\n<h3 class=\"term-h3\">The Resolution Roll</h3>\n<p class=\"term-p\">When your survivor takes a risky, uncertain, or contested action under pressure:</p>\n<p class=\"term-p\"><strong>Roll:</strong> <code>1d20 + relevant Stat bonus + applicable Trait bonus</code></p>\n<p class=\"term-ol-item\">\u2022 <strong>Stat Bonus:</strong> Add Force, Finesse, or Focus (-1 to +2).</p>\n<p class=\"term-ol-item\">\u2022 <strong>Trait Bonus:</strong> Add <strong>+2</strong> for a relevant <strong>Major Trait</strong>, and <strong>+1</strong> for a relevant <strong>Minor Trait</strong> (max one of each per roll).</p>\n<p class=\"term-ol-item\">\u2022 <strong>Compare to Target TN:</strong></p>\n<ul class=\"term-ul\">\n<li><strong>TN 10 (Routine):</strong> Low-stress action, basic survival task.</li>\n<li><strong>TN 15 (Risky):</strong> Standard combat shot, evasion, prying a door under threat.</li>\n<li><strong>TN 20 (Desperate):</strong> Life-or-death shot, jumping across a collapsed fire escape.</li>\n<li><strong>TN 25+ (Extreme):</strong> Staggering a massive B.O.W., escaping a closing hydraulic blast door.</li>\n</ul>\n<h3 class=\"term-h3\">Result Tiers & Outcomes</h3>\n<ul class=\"term-ul\">\n<li><strong>Failure (Miss by 5+):</strong> You fail and suffer serious consequences (take 1 Strain or lose 1 Armor box, gain a Condition, alert enemies, or advance the Noise Clock).</li>\n<li><strong>Success with Cost (Miss by 1\u20134):</strong> You achieve your objective, but pay a price: mark 1 Strain or Armor box, lose 1 weapon Durability box, consume ammunition, or gain a Condition.</li>\n<li><strong>Clean Success (Beat by 0\u20135):</strong> You achieve your goal cleanly without penalty.</li>\n<li><strong>Critical Success (Beat by 6+):</strong> Perfect execution. You achieve your goal and gain an extra advantage: bonus damage, stagger an enemy, or lower the local Noise Clock by -1.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">2. CHARACTER CREATION</h2>\n<h3 class=\"term-h3\">A. Stats (Distribute 3 Points)</h3>\n<p class=\"term-p\">Allocate 3 points across the three core stats (Max +2 at creation):</p>\n<ul class=\"term-ul\">\n<li><strong>FORCE:</strong> Physical power, melee strikes, shoving, lifting debris, enduring trauma.</li>\n<li><strong>FINESSE:</strong> Agility, precision marksmanship, sprinting, lockpicking, silent movement.</li>\n<li><strong>FOCUS:</strong> Awareness, diagnosing infection, searching rooms, mental composure under horror.</li>\n</ul>\n<h3 class=\"term-h3\">B. Survivor Traits</h3>\n<ul class=\"term-ul\">\n<li><strong>1 Major Trait (+2 Bonus):</strong> Your pre-collapse profession or primary archetype (e.g., S.T.A.R.S. Operative, Beat Cop, Trauma Surgeon, Combat Engineer, Wasteland Hunter).</li>\n<li><strong>1 Minor Trait (+1 Bonus):</strong> A specific habit, combat reflex, or survival perk (e.g., Steady Aim, Quick Draw, Silent Step, Tourniquet Specialist, Pack Optimizer).</li>\n</ul>\n<h3 class=\"term-h3\">C. Vitals & Starting Capacity</h3>\n<ul class=\"term-ul\">\n<li><strong>Strain (Max 10):</strong> Begins at <strong>4 Strain</strong>. Strain represents shock, stamina, blood loss, and will to survive.</li>\n<li><strong>Armor Boxes:</strong> Begins at <strong>0 Armor Boxes</strong>. Armor is gained only by finding and equipping protective gear.</li>\n<li><strong>Inventory Capacity:</strong> Strictly <strong>4 Inventory Slots</strong>.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">3. SURVIVAL ACTION ECONOMY & SCENES</h2>\n<h3 class=\"term-h3\">Action Economy (Per Post Turn)</h3>\n<p class=\"term-p\">Each survivor post during an active scene allows:</p>\n<ul class=\"term-ul\">\n<li><strong>1 Major Action:</strong> Attack/Shoot, Sprint/Zone Move, Apply Full Medical Treatment (G+R, Spray), Breach/Force a door, Reload an empty firearm, or Clear a jammed weapon.</li>\n<li><strong>1 Minor Action:</strong> Ingest a single herb (G or B), Draw/Holster a weapon, Trade an item with an adjacent ally, Latch/Unlock a door, or Brace/Take Cover (+1 to next shot/defense).</li>\n<li><strong>Free Actions:</strong> Dropping carried items, brief radio/tactical speech, or defensive knife grab counters.</li>\n</ul>\n<h3 class=\"term-h3\">Scene Framework</h3>\n<ul class=\"term-ul\">\n<li><strong>Exploration Scene:</strong> Searching rooms, investigating lore, and solving environmental puzzles. The Noise Clock only advances on loud actions.</li>\n<li><strong>Combat Scene (Side-Initiative):</strong> GM declares incoming enemy threats $\\rightarrow$ all players post Major + Minor actions within the 24h window $\\rightarrow$ GM resolves all outcomes simultaneously.</li>\n<li><strong>Safe Room (Rest Scene):</strong> Fortified sanctuary. Immune to the Noise Clock. Free 4-slot inventory & Item Box management, medical treatments, and Typewriter checkpoint logs.</li>\n<li><strong>Sector Transition:</strong> Moving to a new zone without active pursuit reduces the Noise Clock by -1.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">4. DAMAGE, INJURIES & INFECTION</h2>\n<h3 class=\"term-h3\">Taking Harm</h3>\n<p class=\"term-ol-item\">\u2022 <strong>Armor Soaks First:</strong> If you wear armor, mark 1 Armor Box (\u2b1c) to negate 1 instance of physical damage. When all boxes are marked, the armor is ruined.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Strain Loss:</strong> Unmitigated hits mark 1 Strain.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Downed / Bleeding Out:</strong> When you reach <strong>0 Strain & 0 Armor</strong>, you collapse. Allies have 1 full 24-hour round to apply a medical item. If hit again or left untreated, your survivor dies.</p>\n<h3 class=\"term-h3\">Standard Conditions</h3>\n<ul class=\"term-ul\">\n<li><strong>Bleeding:</strong> Lose 1 Strain at the end of each combat scene until treated. Cured by Green Herb mixtures or First Aid Spray.</li>\n<li><strong>Poisoned:</strong> Lose 1 Strain whenever you take a physical action. Cured by Blue Herb mixtures or First Aid Spray.</li>\n<li><strong>Limb Damaged:</strong> Leg (-2 Finesse, cannot sprint) or Arm (-2 Force, cannot wield 2-handed weapons). Cured by Full-Heal (G+R) or First Aid Spray.</li>\n<li><strong>Panicked:</strong> Cannot spend Strain on Specializations. Cured by reaching a Safe Room or an ally passing a Focus TN 10 check.</li>\n</ul>\n<h3 class=\"term-h3\">Virus Infection Track (0 to 5)</h3>\n<p class=\"term-p\">Zombie bites and biological critical failures advance the track by +1 Stage:</p>\n<ul class=\"term-ul\">\n<li><strong>Stage 0 (Clean):</strong> Healthy.</li>\n<li><strong>Stage 1 (Exposed):</strong> Low fever.</li>\n<li><strong>Stage 2 (Tremors):</strong> -1 to Focus rolls.</li>\n<li><strong>Stage 3 (Cellular Breakdown):</strong> Max Strain capped at 6; -1 to all rolls.</li>\n<li><strong>Stage 4 (Terminal Agony):</strong> Max Strain capped at 3; cannot sprint.</li>\n<li><strong>Stage 5 (Transformation):</strong> Death. The survivor turns into a hostile B.O.W.</li>\n</ul>\n<p class=\"term-p\"><em>(Infection can be reduced by -1 Stage using Blue Herb combinations, or stalled for 24h with Antiviral Serums).</em></p>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">5. GEAR & NOISE</h2>\n<h3 class=\"term-h3\">Weapons & Durability</h3>\n<ul class=\"term-ul\">\n<li><strong>Handgun (1 Slot):</strong> 15-round mag. +1 Noise per shot. Nat 1 jams the gun (1 Major Action to clear).</li>\n<li><strong>Shotgun (2 Slots):</strong> 6 shells. +2 Noise per shot. Close-range stagger / spread.</li>\n<li><strong>Tactical Rifle (2 Slots):</strong> 5 rounds. +2 Noise per shot. Extreme range armor penetration.</li>\n<li><strong>Combat Knife (1 Slot, \u2b1c\u2b1c\u2b1c 3 Durability):</strong> Close defense & grab counters. Breaks permanently when all 3 boxes are marked (no repairs).</li>\n<li><strong>Heavy Tools (2 Slots, \u2b1c\u2b1c\u2b1c 3 Durability):</strong> Fireaxe, Crowbar. +1 to Force breaching rolls.</li>\n</ul>\n<h3 class=\"term-h3\">Medical Items</h3>\n<ul class=\"term-ul\">\n<li><strong>Green Herb (G, 1/4 Slot):</strong> Restores 1 Strain, cures Bleeding.</li>\n<li><strong>Green + Green (G+G, 1/4 Slot):</strong> Restores 3 Strain, cures Bleeding.</li>\n<li><strong>Green + Blue (G+B, 1/4 Slot):</strong> Restores 1 Strain, cures Bleeding & Poisoned, reduces Infection by -1 Stage.</li>\n<li><strong>Green + Red (G+R, 1/4 Slot):</strong> Full Strain recovery, cures Bleeding & Limb Damaged.</li>\n<li><strong>Green + Red + Blue (G+R+B, 1/4 Slot):</strong> Full Strain recovery, cures all conditions, reduces Infection by -1 Stage.</li>\n<li><strong>First Aid Spray (1 Slot):</strong> Full Strain recovery, cures all physical conditions.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">6. SURVIVOR DOSSIER TEMPLATE</h2>\n<p class=\"term-p\">Identity</p>\n<p class=\"term-p\">Name: ____________    Callsign / Profession: ____________</p>\n<p class=\"term-p\">Stats (3 Points Allocated)</p>\n<p class=\"term-p\">Force: +__    Finesse: +__    Focus: +__</p>\n<p class=\"term-p\">Traits & Abilities</p>\n<p class=\"term-p\">Major Trait (+2): ________________________</p>\n<p class=\"term-p\">Minor Trait (+1): ________________________</p>\n<p class=\"term-p\">Tactical Specialization: __________________</p>\n<p class=\"term-p\">Vitals & Status</p>\n<p class=\"term-p\">Strain: [ ][ ][ ][ ] /4 (Max 10)</p>\n<p class=\"term-p\">Armor: \u2b1c / 0 Boxes</p>\n<p class=\"term-p\">Infection Track: [0] Clean (0/5)</p>\n<p class=\"term-p\">Active Conditions: None</p>\n<p class=\"term-p\">Inventory (Strict 4 Slots)</p>\n<p class=\"term-ol-item\">\u2022 [Handgun - 15/15 rds (1 Slot)]</p>\n<p class=\"term-ol-item\">\u2022 [Combat Knife - \u2b1c\u2b1c\u2b1c (1 Slot)]</p>\n<p class=\"term-ol-item\">\u2022 [9mm Ammo Box - 15 rds (1/4 Slot) / Empty]</p>\n<p class=\"term-ol-item\">\u2022 [Empty Slot]</p>"}, "Officer Kevin Vance": {"title": "Officer Kevin Vance", "folder": "05 - NPCS & FACTIONS", "path": "05 - NPCS & FACTIONS/Officer Kevin Vance.md", "html": "<h1 class=\"term-h1\">\ud83d\udc6e OFFICER KEVIN VANCE</h1>\n<ul class=\"term-ul\">\n<li><strong>Role:</strong> Rookie Mall Security Guard</li>\n<li><strong>Location:</strong> <a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Zone 1.4 - Basement & East Loading Bay')\">[[Zone 1.4 - Basement & East Loading Bay]]</a> (Parking Gate B)</li>\n<li><strong>Status:</strong> Wounded (Lacerated shoulder from jagged metal gate during crowd crush).</li>\n<li><strong>Equipment:</strong> Security Handgun (9mm, 10 rounds), Keycard Level B.</li>\n</ul>"}, "Pharmacist Arthur Pendelton": {"title": "Pharmacist Arthur Pendelton", "folder": "05 - NPCS & FACTIONS", "path": "05 - NPCS & FACTIONS/Pharmacist Arthur Pendelton.md", "html": "<h1 class=\"term-h1\">\ud83d\udc8a PHARMACIST ARTHUR PENDELTON</h1>\n<ul class=\"term-ul\">\n<li><strong>Role:</strong> Lead Pharmacist at Pharm-Plus Express</li>\n<li><strong>Location:</strong> <a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Zone 1.1 - 1st Floor Central Atrium & Retail')\">[[Zone 1.1 - 1st Floor Central Atrium & Retail]]</a></li>\n<li><strong>Skills:</strong> Expert Botanical Compound Synthesizer (Can combine Green, Red, and Blue herbs for survivors).</li>\n</ul>"}, "Node 2.1 - Branch A (The Bus Convoy Route)": {"title": "Node 2.1 - Branch A (The Bus Convoy Route)", "folder": "Stage 2 - Downtown Transit & Collision (I-12)", "path": "04 - SCENARIOS & LOCATIONS/Stage 2 - Downtown Transit & Collision (I-12)/Node 2.1 - Branch A (The Bus Convoy Route).md", "html": "<h1 class=\"term-h1\">\ud83d\ude8c NODE 2.1: BRANCH A (THE BUS CONVOY ROUTE)</h1>\n<ul class=\"term-ul\">\n<li><strong>Sector:</strong> <code>J-13</code> $\\rightarrow$ <code>I-12 / I-13</code> (Mission Street Corridor)</li>\n<li><strong>Preceding Node:</strong> <a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Zone 1.4 - Basement & East Loading Bay')\">[[Zone 1.4 - Basement & East Loading Bay]]</a></li>\n<li><strong>Next Node:</strong> <a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Node 2.3 - The Intersection Crash Site')\">[[Node 2.3 - The Intersection Crash Site]]</a></li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">The Run</h2>\n<p class=\"term-ol-item\">\u2022 <strong>Departure:</strong> Bus #14 navigates Mission Street in the rain.</p>\n<p class=\"term-ol-item\">\u2022 <strong>In-Cabin Outbreak:</strong> A bitten civilian turns into an <a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Urban Shambler')\">[[Urban Shambler]]</a> in the rear seats.</p>\n<p class=\"term-ol-item\">\u2022 <strong>The Crash:</strong> Panic forces a collision through an intersection barricade into <a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Node 2.3 - The Intersection Crash Site')\">[[Node 2.3 - The Intersection Crash Site]]</a>.</p>"}, "Node 2.2 - Branch B (The East River Run)": {"title": "Node 2.2 - Branch B (The East River Run)", "folder": "Stage 2 - Downtown Transit & Collision (I-12)", "path": "04 - SCENARIOS & LOCATIONS/Stage 2 - Downtown Transit & Collision (I-12)/Node 2.2 - Branch B (The East River Run).md", "html": "<h1 class=\"term-h1\">\ud83c\udf0a NODE 2.2: BRANCH B (THE EAST RIVER RUN)</h1>\n<ul class=\"term-ul\">\n<li><strong>Sector:</strong> <code>K-13</code> (East Power Substation & River Embankment)</li>\n<li><strong>Preceding Node:</strong> <a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Zone 1.4 - Basement & East Loading Bay')\">[[Zone 1.4 - Basement & East Loading Bay]]</a></li>\n<li><strong>Convergence:</strong> <a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Node 2.3 - The Intersection Crash Site')\">[[Node 2.3 - The Intersection Crash Site]]</a></li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">The Run</h2>\n<p class=\"term-ol-item\">\u2022 <strong>Substation Failure:</strong> The East Substation is overrun, cutting mall grid power.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Backdoor Exit:</strong> Party exits through the rear fire door into the rainy alley behind Raccoon Theater.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Flanking Move:</strong> Survivors choose between inspecting Circular River drainage barges or pushing West toward the burning bus crash at <a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Node 2.3 - The Intersection Crash Site')\">[[Node 2.3 - The Intersection Crash Site]]</a>.</p>"}, "Node 2.3 - The Intersection Crash Site": {"title": "Node 2.3 - The Intersection Crash Site", "folder": "Stage 2 - Downtown Transit & Collision (I-12)", "path": "04 - SCENARIOS & LOCATIONS/Stage 2 - Downtown Transit & Collision (I-12)/Node 2.3 - The Intersection Crash Site.md", "html": "<h1 class=\"term-h1\">\ud83d\udca5 NODE 2.3: THE INTERSECTION CRASH SITE & CITY HALL PLAZA</h1>\n<ul class=\"term-ul\">\n<li><strong>Sector:</strong> <code>I-12 / I-13</code> (Intersection of Mission & Lombard)</li>\n<li><strong>Noise Clock:</strong> Automatically elevated to <strong>5/6</strong> (Burning fuel tank, sirens).</li>\n<li><strong>Escape Vectors:</strong></li>\n<li>East Portico: <a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Raccoon City Hall Plaza (I-12)')\">[[Raccoon City Hall Plaza (I-12)]]</a>.</li>\n<li>West Service Gate: <a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Stage 3 - Central Station Concourse (H-12)')\">[[Stage 3 - Central Station Concourse (H-12)]]</a>.</li>\n</ul>"}, "Stage 1 - Raccoon Prime Galleria Overview": {"title": "Stage 1 - Raccoon Prime Galleria Overview", "folder": "Stage 1 - Raccoon Prime Galleria (J-13)", "path": "04 - SCENARIOS & LOCATIONS/Stage 1 - Raccoon Prime Galleria (J-13)/Stage 1 - Raccoon Prime Galleria Overview.md", "html": "<h1 class=\"term-h1\">\ud83c\udfec STAGE 1: RACCOON PRIME GALLERIA OVERVIEW</h1>\n<ul class=\"term-ul\">\n<li><strong>Sector:</strong> <code>J-13 / J-14</code> (East Downtown Commercial Hub)</li>\n<li><strong>Status:</strong> Level 4 City Quarantine Lockdown active at 20:25 EST.</li>\n<li><strong>Connected Zones:</strong></li>\n<li><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Zone 1.1 - 1st Floor Central Atrium & Retail')\">[[Zone 1.1 - 1st Floor Central Atrium & Retail]]</a></li>\n<li><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Zone 1.2 - 2nd Floor Mezzanine & Outfitters')\">[[Zone 1.2 - 2nd Floor Mezzanine & Outfitters]]</a></li>\n<li><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Zone 1.3 - 3rd Floor Security Operati li>\n<li><code>6:</code> Kevlar Hunting Vest (Body Armor \u2b1c\u2b1c [2 Boxes]).</li>\n</ul>\n<h3 class=\"term-h3\">2. Tech Nexus & PA Sound Console</h3>\n<ul class=\"term-ul\">\n<li><strong>Search Targets:</strong> 30+ CRT TV bank showing Arklay perimeter roadblocks cutting to static; mall intercom mic.</li>\n<li><strong>Loot Table:</strong></li>\n<li><code>1\u20133:</code> Heavy Tactical Flashlight + D-Batteries.</li>\n<li><code>4\u20135:</code> Handheld Shortwave Walkie-Talkie.</li>\n<li><code>6:</code> Wire-Stripper Toolkit & Backup Battery Pack.</li>\n</ul>\n<h3 class=\"term-h3\">3. Raccoon Cineplex (Screens 1\u20136)</h3>\n<ul class=\"term-ul\">\n<li><strong>Threat Encounter:</strong> First active <a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Urban Shambler')\">[[Urban Shambler]]</a> feeding in Theater 3.</li>\n<li><strong>Loot Table:</strong></li>\n<li><code>1\u20133:</code> Brass Velvet Rope Stanchion (Blunt, \u2b1c\u2b1c).</li>\n<li><code>4\u20135:</code> Box of Flares (x3).</li>\n<li><code>6 (Safe):</code> Box of 9mm Handgun Ammo (x15 rounds).</li>\n</ul>"}, "Zone 1.3 - 3rd Floor Security Operations & Safe Room": {"title": "Zone 1.3 - 3rd Floor Security Operations & Safe Room", "folder": "Stage 1 - Raccoon Prime Galleria (J-13)", "path": "04 - SCENARIOS & LOCATIONS/Stage 1 - Raccoon Prime Galleria (J-13)/Zone 1.3 - 3rd Floor Security Operations & Safe Room.md", "html": "<h1 class=\"term-h1\">\ud83d\udee1\ufe0f ZONE 1.3: 3RD FLOOR SECURITY OPERATIONS (SAFE ROOM)</h1>\n<ul class=\"term-ul\">\n<li><strong>Location:</strong> Restricted Administrative Suite (<code>Sector J-13</code>)</li>\n<li><strong>Parent Hub:</strong> <a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Stage 1 - Raccoon Prime Galleria Overview')\">[[Stage 1 - Raccoon Prime Galleria Overview]]</a></li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">Security Dispatch Suite (The Safe Room)</h2>\n<ul class=\"term-ul\">\n<li><strong>Sanctuary Properties:</strong> Deadbolted steel door; safe from all wandering hostiles.</li>\n<li><strong>Interactive Utilities:</strong></li>\n<li><strong>CCTV Monitor Wall:</strong> 8 operational video feeds covering the Atrium, Parking Gate B, and East Loading Dock.</li>\n<li><strong>Manual Typewriter & Ink Ribbon:</strong> File survivor records; grants <strong>Moment of Respite</strong> (+1 Strain recovery).</li>\n<li><strong>Security Gun Locker (Locked - Code 0928):</strong></li>\n<li>12-Gauge Pump Shotgun (\u2b1c\u2b1c\u2b1c, Capacity: 6 shells, Loud).</li>\n<li>Box of 12-Gauge Shells (x6).</li>\n<li>1x Green Herb (G).</li>\n<li><strong>Mall Manager's Office:</strong> Desk safe containing sub-basement conduit schematics and the fireworks memo (<code>09-28</code>).</li>\n</ul>"}, "Zone 1.4 - Basement & East Loading Bay": {"title": "Zone 1.4 - Basement & East Loading Bay", "folder": "Stage 1 - Raccoon Prime Galleria (J-13)", "path": "04 - SCENARIOS & LOCATIONS/Stage 1 - Raccoon Prime Galleria (J-13)/Zone 1.4 - Basement & East Loading Bay.md", "html": "<h1 class=\"term-h1\">\ud83d\udd27 ZONE 1.4: BASEMENT & EAST LOADING BAY</h1>\n<ul class=\"term-ul\">\n<li><strong>Location:</strong> Sub-levels and Freight Access (<code>Sector J-13 / K-13</code>)</li>\n<li><strong>Parent Hub:</strong> <a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Stage 1 - Raccoon Prime Galleria Overview')\">[[Stage 1 - Raccoon Prime Galleria Overview]]</a></li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">Notable Points & Escape Vectors</h2>\n<h3 class=\"term-h3\">1. Parking Structure B Gate</h3>\n<ul class=\"term-ul\">\n<li><strong>Scene 2 Event:</strong> <a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Officer Kevin Vance')\">[[Officer Kevin Vance]]</a> shoulder wound triage; crowd beating against roll-up shutter.</li>\n<li><strong>Loot:</strong> Wall-mounted Fire Axe (\u2b1c\u2b1c\u2b1c).</li>\n</ul>\n<h3 class=\"term-h3\">2. Boiler & HVAC Generator Vault</h3>\n<ul class=\"term-ul\">\n<li><strong>Hazards:</strong> High-pressure steam leaks (Finesse TN 12).</li>\n<li><strong>Loot:</strong> Industrial Fuses (15A), Pipe Wrench (\u2b1c\u2b1c), Lubricant Spray.</li>\n</ul>\n<h3 class=\"term-h3\">3. North Loading Bay</h3>\n<ul class=\"term-ul\">\n<li><strong>Option A Staging Area:</strong> 3 Municipal Transit Buses idling under <a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Security Chief Raymond Miller')\">[[Security Chief Raymond Miller]]</a>. Leads to <a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Node 2.1 - Branch A (The Bus Convoy Route)')\">[[Node 2.1 - Branch A (The Bus Convoy Route)]]</a>.</li>\n</ul>\n<h3 class=\"term-h3\">4. East Service Backdoor (<code>Sector K-13</code>)</h3>\n<ul class=\"term-ul\">\n<li><strong>Option B Vector:</strong> Fire door exiting behind Raccoon Theater and East Power Substation. Leads to <a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Node 2.2 - Branch B (The East River Run)')\">[[Node 2.2 - Branch B (The East River Run)]]</a>.</li>\n</ul>"}};

    let currentDoc = "00 - Biohazard Campaign Index";
    let isMapMode = false;
    let isGridVisible = true;

    // Build Vault Tree Sidebar
    function renderTree(filterText = "") {
      const container = document.getElementById("tree-container");
      container.innerHTML = "";

      const folders = {};
      Object.keys(VAULT).forEach(key => {
        const item = VAULT[key];
        const folder = item.folder;
        if (!folders[folder]) folders[folder] = [];
        if (!filterText || key.toLowerCase().includes(filterText.toLowerCase()) || item.html.toLowerCase().includes(filterText.toLowerCase())) {
          folders[folder].push(item);
        }
      });

      Object.keys(folders).sort().forEach(folder => {
        if (folders[folder].length === 0) return;
        const folderEl = document.createElement("div");
        folderEl.className = "tree-folder";

        const titleEl = document.createElement("div");
        titleEl.className = "tree-folder-title";
        titleEl.textContent = "📁 " + folder;
        folderEl.appendChild(titleEl);

        folders[folder].forEach(doc => {
          const nodeEl = document.createElement("div");
          nodeEl.className = "tree-node" + (doc.title === currentDoc && !isMapMode ? " active" : "");
          nodeEl.innerHTML = `<span>📄</span> <span>${doc.title}</span>`;
          nodeEl.onclick = () => {
            openVaultDoc(doc.title);
            closeMobileSidebar();
          };
          folderEl.appendChild(nodeEl);
        });

        container.appendChild(folderEl);
      });
    }

    function filterVault() {
      const query = document.getElementById("search-input").value;
      renderTree(query);
    }

    function openVaultDoc(title) {
      // Case-insensitive or partial match search for wikilinks
      let match = VAULT[title];
      if (!match) {
        const lower = title.toLowerCase().trim();
        const foundKey = Object.keys(VAULT).find(k => k.toLowerCase().includes(lower) || lower.includes(k.toLowerCase()));
        if (foundKey) match = VAULT[foundKey];
      }

      if (!match) {
        console.warn("Document not found in vault:", title);
        return;
      }

      currentDoc = match.title;
      isMapMode = false;
      document.getElementById("map-view").style.display = "none";
      document.getElementById("doc-view").style.display = "block";
      document.getElementById("doc-breadcrumb").textContent = match.folder + " / " + match.title;
      document.getElementById("doc-content").innerHTML = match.html;
      document.getElementById("doc-view").scrollTop = 0;

      // Update active nav styling
      renderTree(document.getElementById("search-input").value);
    }

    function toggleMapMode() {
      if (isMapMode) {
        openVaultDoc(currentDoc);
      } else {
        showMap();
      }
    }

    function showMap() {
      isMapMode = true;
      document.getElementById("doc-view").style.display = "none";
      document.getElementById("map-view").style.display = "flex";
      renderTree(document.getElementById("search-input").value);
    }

    function showMobileMap() {
      showMap();
      closeMobileSidebar();
      document.getElementById("mob-btn-map").classList.add("active");
      document.getElementById("mob-btn-notes").classList.remove("active");
    }

    function toggleMobileSidebar() {
      const sidebar = document.getElementById("vault-sidebar");
      sidebar.classList.toggle("mobile-open");
    }

    function closeMobileSidebar() {
      document.getElementById("vault-sidebar").classList.remove("mobile-open");
    }

    // Render Exact SVG Grid Lines
    function renderGridSVG() {
      const g = document.getElementById("svg-grid-lines");
      g.innerHTML = "";
      const left = 105;
      const top = 135;
      const W = 2879;
      const H = 3625;
      const cw = W / 15.0;
      const rh = H / 19.0;
      const cols = ["A","B","C","D","E","F","G","H","I","J","K","L","M","N","O"];

      // Vertical lines
      for (let c = 1; c < 15; c++) {
        const x = left + c * cw;
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", x);
        line.setAttribute("y1", top);
        line.setAttribute("x2", x);
        line.setAttribute("y2", top + H);
        line.setAttribute("stroke", "rgba(255, 85, 0, 0.45)");
        line.setAttribute("stroke-width", "1.5");
        line.setAttribute("stroke-dasharray", "8,6");
        g.appendChild(line);
      }

      // Horizontal lines
      for (let r = 1; r < 19; r++) {
        const y = top + r * rh;
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", left);
        line.setAttribute("y1", y);
        line.setAttribute("x2", left + W);
        line.setAttribute("y2", y);
        line.setAttribute("stroke", "rgba(255, 85, 0, 0.45)");
        line.setAttribute("stroke-width", "1.5");
        line.setAttribute("stroke-dasharray", "8,6");
        g.appendChild(line);
      }

      // Cell Coordinate Tags
      for (let c = 0; c < 15; c++) {
        for (let r = 0; r < 19; r++) {
          const tx = left + c * cw + 6;
          const ty = top + r * rh + 16;
          const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
          txt.setAttribute("x", tx);
          txt.setAttribute("y", ty);
          txt.setAttribute("fill", "#ff5500");
          txt.setAttribute("font-size", "12");
          txt.setAttribute("font-family", "Share Tech Mono, monospace");
          txt.setAttribute("opacity", "0.65");
          txt.textContent = cols[c] + "-" + (r + 1);
          g.appendChild(txt);
        }
      }
    }

    function toggleGrid() {
      const svg = document.getElementById("grid-svg");
      const btn = document.getElementById("grid-toggle-btn");
      isGridVisible = !isGridVisible;
      svg.style.display = isGridVisible ? "block" : "none";
      btn.innerHTML = isGridVisible ? "<span>GRID: ON</span>" : "<span>GRID: OFF</span>";
    }

    // Map Transform Engine
    let scale = 0.25;
    let pointX = 0;
    let pointY = 0;
    let isPanning = false;
    let startX = 0;
    let startY = 0;

    const mapContainer = document.getElementById("map-view");
    const mapWrapper = document.getElementById("map-wrapper");

    function updateTransform() {
      mapWrapper.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
    }

    function resetMap() {
      const rect = mapContainer.getBoundingClientRect();
      const scaleX = rect.width / 3085;
      const scaleY = rect.height / 3858;
      scale = Math.min(scaleX, scaleY) * 0.95;
      pointX = (rect.width - 3085 * scale) / 2;
      pointY = (rect.height - 3858 * scale) / 2;
      updateTransform();
    }

    function zoomIn() {
      const rect = mapContainer.getBoundingClientRect();
      zoomAt(rect.width / 2, rect.height / 2, 1.3);
    }

    function zoomOut() {
      const rect = mapContainer.getBoundingClientRect();
      zoomAt(rect.width / 2, rect.height / 2, 1 / 1.3);
    }

    function zoomAt(clientX, clientY, factor) {
      const rect = mapContainer.getBoundingClientRect();
      const mouseX = clientX - rect.left;
      const mouseY = clientY - rect.top;

      const newScale = Math.min(Math.max(0.1, scale * factor), 5.0);
      pointX = mouseX - (mouseX - pointX) * (newScale / scale);
      pointY = mouseY - (mouseY - pointY) * (newScale / scale);
      scale = newScale;
      updateTransform();
    }

    // Mouse Listeners
    mapContainer.addEventListener("mousedown", (e) => {
      isPanning = true;
      startX = e.clientX - pointX;
      startY = e.clientY - pointY;
    });

    window.addEventListener("mousemove", (e) => {
      if (!isPanning) return;
      pointX = e.clientX - startX;
      pointY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener("mouseup", () => { isPanning = false; });

    mapContainer.addEventListener("wheel", (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
      zoomAt(e.clientX, e.clientY, factor);
    }, { passive: false });

    // Touch Pinch & Pan
    let lastTouchDist = 0;
    mapContainer.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        isPanning = true;
        startX = e.touches[0].clientX - pointX;
        startY = e.touches[0].clientY - pointY;
      } else if (e.touches.length === 2) {
        isPanning = false;
        lastTouchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    });

    mapContainer.addEventListener("touchmove", (e) => {
      e.preventDefault();
      if (e.touches.length === 1 && isPanning) {
        pointX = e.touches[0].clientX - startX;
        pointY = e.touches[0].clientY - startY;
        updateTransform();
      } else if (e.touches.length === 2) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        if (lastTouchDist > 0) {
          zoomAt(midX, midY, dist / lastTouchDist);
        }
        lastTouchDist = dist;
      }
    }, { passive: false });

    mapContainer.addEventListener("touchend", () => {
      isPanning = false;
      lastTouchDist = 0;
    });

    // Initialize
    window.addEventListener("load", () => {
      renderTree();
      renderGridSVG();
      openVaultDoc("00 - Biohazard Campaign Index");
      resetMap();
    });

    window.addEventListener("resize", () => {
      if (isMapMode) resetMap();
    });
  </script>
</body>
</html>
