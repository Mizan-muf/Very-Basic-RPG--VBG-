<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>BIOHAZARD — Raccoon City Campaign Database</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg-dark: #07090c;
      --bg-surface: #0e1217;
      --bg-sidebar: #0a0d12;
      --border-color: #1f2937;
      --orange-bio: #ff5500;
      --orange-glow: rgba(255, 85, 0, 0.35);
      --cyan-tactical: #00e5ff;
      --text-main: #e2e8f0;
      --text-dim: #94a3b8;
      --font-mono: 'Share Tech Mono', monospace;
      --font-header: 'Rajdhani', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
    }

    /* Top HUD */
    header {
      height: 52px;
      background: #090c10;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 100;
    }

    .hud-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .biohazard-badge {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      background: var(--orange-bio);
      color: #000;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 2px;
      letter-spacing: 1px;
    }

    .hud-title {
      font-family: var(--font-header);
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .hud-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hud-btn {
      background: rgba(255,85,0,0.1);
      border: 1px solid var(--orange-bio);
      color: var(--orange-bio);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hud-btn:hover {
      background: var(--orange-bio);
      color: #000;
    }

    /* Main Layout */
    .app-body {
      display: flex;
      flex: 1;
      height: calc(100vh - 52px);
      position: relative;
      overflow: hidden;
    }

    /* Sidebar Vault Tree */
    aside {
      width: 320px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 50;
    }

    .search-box {
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .search-input {
      width: 100%;
      background: #141a23;
      border: 1px solid #2d3748;
      color: #fff;
      padding: 8px 12px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      border-radius: 4px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--orange-bio);
    }

    .tree-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 10px 8px;
    }

    .tree-folder {
      margin-bottom: 12px;
    }

    .tree-folder-title {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--orange-bio);
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 4px 8px;
      font-weight: 700;
    }

    .tree-node {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 4px;
      color: var(--text-dim);
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
      margin: 2px 0;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    .tree-node:hover {
      background: #141b24;
      color: #fff;
    }

    .tree-node.active {
      background: rgba(255, 85, 0, 0.15);
      border-left: 3px solid var(--orange-bio);
      color: #fff;
      font-weight: 600;
    }

    /* Main Viewport Container */
    main {
      flex: 1;
      height: 100%;
      position: relative;
      background: var(--bg-dark);
      overflow: hidden;
    }

    /* Map View Container */
    #map-view {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      user-select: none;
      display: flex;
    }

    #map-view:active {
      cursor: grabbing;
    }

    #map-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    #map-wrapper img {
      display: block;
      width: 3085px;
      height: 3858px;
      max-width: none;
      pointer-events: none;
    }

    #grid-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 3085px;
      height: 3858px;
      pointer-events: none;
    }

    /* Floating Map Controls */
    .map-controls {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 80;
    }

    .ctrl-btn {
      background: rgba(14, 18, 23, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--orange-bio);
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 4px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ctrl-btn:hover {
      background: var(--orange-bio);
      color: #000;
    }

    /* Obsidian Document Reading View */
    #doc-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-surface);
      z-index: 40;
      overflow-y: auto;
      padding: 32px 48px;
      display: none;
    }

    .doc-container {
      max-width: 900px;
      margin: 0 auto;
      padding-bottom: 80px;
    }

    .doc-breadcrumb {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--orange-bio);
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    /* Obsidian Markdown Styling */
    .term-h1 {
      font-family: var(--font-header);
      font-size: 2.2rem;
      color: #fff;
      margin: 0 0 16px 0;
      border-bottom: 2px solid var(--orange-bio);
      padding-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .term-h2 {
      font-family: var(--font-header);
      font-size: 1.5rem;
      color: var(--orange-bio);
      margin: 28px 0 12px 0;
      border-bottom: 1px solid #1f2937;
      padding-bottom: 6px;
    }

    .term-h3 {
      font-family: var(--font-header);
      font-size: 1.2rem;
      color: #38bdf8;
      margin: 20px 0 8px 0;
    }

    .term-h4 {
      font-family: var(--font-header);
      font-size: 1.05rem;
      color: #cbd5e1;
      margin: 16px 0 6px 0;
    }

    .term-p {
      color: #cbd5e1;
      font-size: 0.98rem;
      line-height: 1.7;
      margin-bottom: 12px;
    }

    .term-ul {
      padding-left: 24px;
      margin-bottom: 14px;
      color: #cbd5e1;
    }

    .term-ul li {
      margin-bottom: 6px;
      line-height: 1.6;
    }

    .term-ol-item {
      color: #cbd5e1;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 6px;
      padding-left: 12px;
    }

    .term-quote {
      border-left: 3px solid var(--orange-bio);
      background: rgba(255, 85, 0, 0.05);
      padding: 10px 16px;
      color: #e2e8f0;
      margin: 14px 0;
      font-style: italic;
    }

    .term-hr {
      border: 0;
      border-top: 1px solid var(--border-color);
      margin: 24px 0;
    }

    /* Obsidian Wikilink Styling */
    .obsidian-link {
      color: #38bdf8;
      text-decoration: none;
      background: rgba(56, 189, 248, 0.1);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: var(--font-mono);
      font-size: 0.9em;
      border-bottom: 1px dotted #38bdf8;
      transition: all 0.15s;
    }

    .obsidian-link:hover {
      background: #38bdf8;
      color: #000;
    }

    /* Tables */
    .table-wrap {
      overflow-x: auto;
      margin: 16px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      border: 1px solid var(--border-color);
    }

    th {
      background: #141b24;
      color: var(--orange-bio);
      font-family: var(--font-mono);
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 9px 14px;
      border-bottom: 1px solid #1a222d;
      color: #cbd5e1;
    }

    tr:nth-child(even) td {
      background: rgba(255,255,255,0.02);
    }

    /* Mobile Bottom Navigation */
    .mobile-nav {
      display: none;
      height: 58px;
      background: #090c10;
      border-top: 1px solid var(--border-color);
      flex-shrink: 0;
      z-index: 100;
      justify-content: space-around;
      align-items: center;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .mob-nav-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.75rem;
      gap: 3px;
      cursor: pointer;
      font-family: var(--font-mono);
    }

    .mob-nav-btn.active {
      color: var(--orange-bio);
    }

    /* Responsive */
    @media (max-width: 768px) {
      aside {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 90;
      }

      aside.mobile-open {
        display: flex;
      }

      #doc-view {
        padding: 20px 16px;
      }

      .mobile-nav {
        display: flex;
      }
    }
  </style>
</head>

  <script>
    const VAULT = {"Master Rules Glossary & Keywords": {"title": "Master Rules Glossary & Keywords", "folder": "03 - GLOSSARY & REFERENCE", "path": "03 - GLOSSARY & REFERENCE/Master Rules Glossary & Keywords.md", "html": "<h1 class=\"term-h1\">VBG-Z: MASTER RULES GLOSSARY & KEYWORD SPECIFICATION</h1>\n<p class=\"term-p\"><em>Comprehensive mechanical reference defining all core terms, conditions, equipment rules, and environment systems for VBG-Z (Very Basic RPG: Zombie Survival Edition).</em></p>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">1. CORE ENGINE & RESOLUTION</h2>\n<ul class=\"term-ul\">\n<li><strong>Resolution Roll:</strong> <code>1d20 + Stat + Trait Bonus</code>.</li>\n<li>Players roll a single 20-sided die, add their relevant Stat (-1 to +2), and add an applicable Trait (+2 for Major, +1 for Minor).</li>\n<li><strong>Stats:</strong></li>\n<li><strong>Force:</strong> Physical power, melee strikes, breaking barriers, lifting/carrying, brute endurance.</li>\n<li><strong>Finesse:</strong> Agility, precision marksmanship, stealth, lockpicking, speed, evasive dodging.</li>\n<li><strong>Focus:</strong> Perception, medical triage, mental composure under horror, searching rooms, technical repair.</li>\n<li><strong>Traits:</strong></li>\n<li><strong>Major Trait (+2):</strong> Core pre-collapse profession/archetype (e.g., <em>Beat Cop</em>, <em>Trauma Surgeon</em>, <em>Combat Engineer</em>).</li>\n<li><strong>Minor Trait (+1):</strong> Specific survival perk or technique (e.g., <em>Steady Aim</em>, <em>Silent Step</em>, <em>Field Chemist</em>).</li>\n<li><strong>Target Difficulty (TN):</strong></li>\n<li><strong>TN 10 (Routine):</strong> Low-stress actions with adequate time.</li>\n<li><strong>TN 15 (Risky):</strong> Standard combat or actions under active hostile pressure.</li>\n<li><strong>TN 20 (Desperate):</strong> Life-or-death survival maneuvers or escaping dangerous ambushes.</li>\n<li><strong>TN 25+ (Extreme):</strong> Extraordinary feats against boss-tier B.O.W.s.</li>\n<li><strong>Outcome Margins:</strong></li>\n<li><strong>Failure (Miss by 5+):</strong> Action fails; suffer direct damage, advance Noise Clock, or trigger hazards.</li>\n<li><strong>Success with Cost (Miss by 1\u20134):</strong> Goal achieved, but pay a price (take 1 Strain, lose weapon durability, or drop an item).</li>\n<li><strong>Clean Success (Beat by 0\u20135):</strong> Goal achieved smoothly with no negative side effects.</li>\n<li><strong>Critical (Beat by 6+):</strong> Perfect success; deal bonus stopping power, bypass armor, or regain 1 Strain.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">2. ACTION ECONOMY & TURN STRUCTURE</h2>\n<p class=\"term-p\">In asynchronous Play-by-Post, each player turn consists of <strong>1 Major Action</strong> and <strong>1 Minor Action</strong> per post:</p>\n<h3 class=\"term-h3\">Major Actions (1 per turn)</h3>\n<ul class=\"term-ul\">\n<li><strong>Attack / Shoot:</strong> Fire a weapon or make a melee strike.</li>\n<li><strong>Sprint / Reposition:</strong> Move between zones (e.g., Near to Far, or dashing through a doorway).</li>\n<li><strong>Full Medical Treatment:</strong> Apply a First Aid Spray or Green+Red full-heal mix to yourself or an ally.</li>\n<li><strong>Interact / Breach:</strong> Force open a jammed door, hotwire a panel, or push a heavy obstacle.</li>\n<li><strong>Reload Weapon:</strong> Load an ammo box/magazine into an empty firearm.</li>\n<li><strong>Clear Malfunction:</strong> Rack the slide and clear a jammed firearm.</li>\n</ul>\n<h3 class=\"term-h3\">Minor Actions (1 per turn)</h3>\n<ul class=\"term-ul\">\n<li><strong>Quick Ingest:</strong> Consume a single Green or Blue herb mix.</li>\n<li><strong>Draw / Holster Weapon:</strong> Switch carried weapons.</li>\n<li><strong>Trade Item:</strong> Hand a carried item to an adjacent ally (within Close range).</li>\n<li><strong>Interact / Latch:</strong> Turn a doorknob, flip a light switch, or grab a loose keycard from a table.</li>\n<li><strong>Take Cover / Brace:</strong> Gain +1 to next ranged shot or defensive roll.</li>\n</ul>\n<h3 class=\"term-h3\">Free Actions (Anytime / 0 cost)</h3>\n<ul class=\"term-ul\">\n<li><strong>Drop Carried Item:</strong> Immediately drop gear to the floor to free up hands/slots.</li>\n<li><strong>Speak / Signal:</strong> Short tactical shout or radio call to allies.</li>\n<li><strong>Defensive Grab Counter:</strong> Expending 1 knife durability box or 1 handgun shot when grabbed to instantly break free.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">3. SCENE FRAMEWORK & PACING</h2>\n<p class=\"term-p\">Play is structured into distinct <strong>Scenes</strong> rather than rigid rounds:</p>\n<h3 class=\"term-h3\">Exploration Scene</h3>\n<ul class=\"term-ul\">\n<li>Low-intensity investigation, searching rooms, solving environmental puzzles, and navigating hallways.</li>\n<li>Actions are relaxed; players can search, converse, and take time. The Noise Clock only advances on loud triggers.</li>\n</ul>\n<h3 class=\"term-h3\">Combat & Threat Scene</h3>\n<ul class=\"term-ul\">\n<li>High-intensity encounters where the GM presents active hostile threats.</li>\n<li>Runs on asynchronous <strong>Side-Initiative</strong>: The GM posts the environmental threat, all players post their Major + Minor actions within the 24-hour window, and the GM resolves all outcomes simultaneously.</li>\n</ul>\n<h3 class=\"term-h3\">Safe Room (Rest Scene)</h3>\n<ul class=\"term-ul\">\n<li>A fortified sanctuary with zero hostile presence and absolute Noise Clock immunity.</li>\n<li>Players can freely organize their 4-slot inventory and Item Box, apply medical treatments, calm the <strong>Panicked</strong> condition, and write Typewriter logbook entries for progression milestones.</li>\n</ul>\n<h3 class=\"term-h3\">Transition Scene</h3>\n<ul class=\"term-ul\">\n<li>Moving between sectors, city districts, or facility floors. Successfully clearing a transition without pursuit reduces the Area Noise Clock by <strong>-1 Tick</strong>.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">4. HEALTH & CONDITIONS</h2>\n<ul class=\"term-ul\">\n<li><strong>Strain (0 to 10):</strong> Base health and shock threshold (Survivors start at <strong>4 Strain</strong>).</li>\n<li><strong>Downed / Bleeding Out:</strong></li>\n<li>Reaching <strong>0 Strain & 0 Armor</strong> causes immediate collapse/incapacitation.</li>\n<li><strong>24-Hour Post Window:</strong> Allies have 1 post round to reach and stabilize the survivor with an herb or spray.</li>\n<li><strong>Lethality:</strong> Taking any further hit or ending the scene unstabilized results in permanent death.</li>\n</ul>\n<h3 class=\"term-h3\">Standardized Active Conditions</h3>\n<ul class=\"term-ul\">\n<li><strong>Bleeding:</strong> Suffer 1 Strain at the end of each combat scene until treated. <em>Cured by:</em> Any Green Herb mix or First Aid Spray.</li>\n<li><strong>Poisoned (Toxin):</strong> Lose 1 Strain whenever you make a Force or Finesse roll. <em>Cured by:</em> Blue Herb mix or First Aid Spray.</li>\n<li><strong>Limb Damaged (Leg or Arm):</strong></li>\n<li><em>Leg:</em> -2 to Finesse movement; cannot sprint or flee.</li>\n<li><em>Arm:</em> -2 to Force/attack rolls; cannot wield 2-handed weapons.</li>\n<li><em>Cured by:</em> Full-Heal Mix (G+R) or First Aid Spray.</li>\n<li><strong>Panicked:</strong> Cannot spend Strain on Tactical Specializations. <em>Cured by:</em> Entering a Safe Room or ally Focus TN 10 check.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">5. COMBAT ADJUDICATION & DISTANCE BANDS</h2>\n<p class=\"term-p\">Combat is player-facing and structured around four intuitive <strong>Distance & Reach Bands</strong> to keep asynchronous posting fluid without requiring grid maps:</p>\n<h3 class=\"term-h3\">Distance & Reach Bands</h3>\n<ul class=\"term-ul\">\n<li><strong>Melee / Reach (0\u20135 ft):</strong> Within arm's reach or blade contact. Hand-to-hand combat, knife strikes, grab threats, and shotgun point-blank blasts occur here.</li>\n<li><em>Disengaging:</em> Moving away from an actively engaged enemy in Melee reach requires a Major Action (Sprint) or an evasive stunt to avoid an immediate swipe or grab.</li>\n<li><strong>Close / Room (5\u201320 ft):</strong> Across an average room, small office, or narrow corridor. Moving into Melee reach or taking cover takes a Minor Action.</li>\n<li><em>Firearms:</em> Optimal operating range for Handguns and Shotguns.</li>\n<li><strong>Far / Hallway (20\u201360 ft):</strong> Down a long hospital corridor, across a street block, or through a warehouse. Closing the distance requires a Major Action (Sprint).</li>\n<li><em>Firearms:</em> Handguns suffer a <strong>-2 penalty</strong> unless the shooter spends a Minor Action to Brace/Aim. Tactical Rifles operate at peak accuracy.</li>\n<li><strong>Distant / Line-of-Sight (60+ ft):</strong> Across a city plaza, down a highway, or from a rooftop. Only Tactical Rifles and Scoped weapons can effectively engage targets at Distant range.</li>\n</ul>\n<h3 class=\"term-h3\">Combat Mechanics & Tactics</h3>\n<ul class=\"term-ul\">\n<li><strong>Player-Facing Side-Initiative:</strong> The GM describes incoming hostile actions. Players post their reactions (Major + Minor action) within the 24-hour window. Monsters never make attack rolls; players roll to avoid harm or disrupt enemy actions.</li>\n<li><strong>Grab & Counter-Attack:</strong> When grabbed by a zombie, a survivor can spend a Free Action to sacrifice <strong>1 Knife Durability Box</strong> or fire <strong>1 Handgun shot</strong> to instantly break the grab without taking damage.</li>\n<li><strong>Called Shots & Weak Points:</strong> Targeting a creature's specific anatomical weak point (exposed brain, knee joint) requires a <strong>Called Shot (TN 20)</strong>. Clean success bypasses 1 Armor Box or dismembers the limb.</li>\n<li><strong>V-ACT Mutation (Crimson Heads):</strong> Any intact zombie corpse left unburned or undecapitated will revive after 2 scenes as a fast, high-damage Crimson Head mutant.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">6. VIRUS INFECTION ENGINE</h2>\n<h3 class=\"term-h3\">Infection Track (Stage 0 to Stage 5)</h3>\n<ul class=\"term-ul\">\n<li><strong>Stage 0 (Clean):</strong> Healthy. No symptoms.</li>\n<li><strong>Stage 1 (Exposed):</strong> Minor fever, pale skin. Narrative tension only.</li>\n<li><strong>Stage 2 (Incubation):</strong> Sweats and tremors. <strong>-1 to all Focus rolls</strong>.</li>\n<li><strong>Stage 3 (Cellular Breakdown):</strong> Tissue necrosis, extreme thirst. Maximum Strain capped at <strong>6</strong>; <strong>-1 to all rolls</strong>.</li>\n<li><strong>Stage 4 (Terminal Agony):</strong> Heavy delirium, skin sloughing. Maximum Strain capped at <strong>3</strong>; cannot sprint.</li>\n<li><strong>Stage 5 (Transformation):</strong> Character dies and rises as an aggressive hostile B.O.W.</li>\n</ul>\n<h3 class=\"term-h3\">Infection Advancement Triggers</h3>\n<ul class=\"term-ul\">\n<li>Suffering a bite attack from an infected enemy: <strong>+1 Stage</strong>.</li>\n<li>Critical failure against biological bile/fluid hazards: <strong>+1 Stage</strong>.</li>\n</ul>\n<h3 class=\"term-h3\">Treatment & Stalling</h3>\n<ul class=\"term-ul\">\n<li><strong>Blue Herb Mixtures (G+B, G+R+B):</strong> Lower current infection by <strong>-1 Stage</strong> (can reduce all the way back to Stage 0 if caught early).</li>\n<li><strong>Antiviral Serum:</strong> Halts infection progression completely for 24 hours.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">6. COMPLETE ITEMS & EQUIPMENT CATALOG</h2>\n<p class=\"term-p\">Every character begins with a strict base capacity of <strong>4 Inventory Slots</strong>.</p>\n<h3 class=\"term-h3\">A. WEAPONS CATALOG</h3>\n<h4 class=\"term-h4\">Firearms & Ranged Weapons</h4>\n<ul class=\"term-ul\">\n<li><strong>Handgun / Pistol (1 Slot):</strong></li>\n<li><em>Ammo Type & Storage:</em> 9mm Ammo Box (15 rounds = 1/4 Slot).</li>\n<li><em>Noise Generated:</em> <strong>+1 Tick</strong> per shot.</li>\n<li><em>Reliability:</em> Standard sidearm; effective at Close and Near ranges.</li>\n<li><strong>Shotgun (2 Slots):</strong></li>\n<li><em>Ammo Type & Storage:</em> 12-Gauge Shells Box (6 shells = 1/4 Slot).</li>\n<li><em>Noise Generated:</em> <strong>+2 Ticks</strong> per shot.</li>\n<li><em>Special Rule (Stopping Power):</em> Staggers charging enemies on Clean Success; hits up to 2 adjacent targets at Close range.</li>\n<li><strong>Hunting / Tactical Rifle (2 Slots):</strong></li>\n<li><em>Ammo Type & Storage:</em> Rifle Ammo Box (5 rounds = 1/4 Slot).</li>\n<li><em>Noise Generated:</em> <strong>+2 Ticks</strong> per shot.</li>\n<li><em>Special Rule (Penetration):</em> Extreme range marksmanship; bypasses 1 Armor box on Clean Success.</li>\n<li><strong>Magnum Revolver (1 Slot):</strong></li>\n<li><em>Ammo Type & Storage:</em> Magnum Ammo Box (6 rounds = 1/4 Slot). Rare.</li>\n<li><em>Noise Generated:</em> <strong>+3 Ticks</strong> per shot.</li>\n<li><em>Special Rule (Lethal Kinetic):</em> Bypasses mundane armor; inflicts critical damage on B.O.W. weak points.</li>\n</ul>\n<h4 class=\"term-h4\">Firearm Malfunction & Reload Mechanics</h4>\n<ul class=\"term-ul\">\n<li><strong>Firearm Jamming:</strong> Rolling a <strong>Natural 1</strong> on a firearm attack causes a mechanical jam. The shot does not fire. Clearing the jam requires <strong>1 Major Action</strong> (or passing a Focus TN 10 check as a Minor Action).</li>\n<li><strong>Reload Action Economy:</strong> Firearms hold 1 internal magazine/cylinder. Loading fresh ammunition from a carried ammo box requires <strong>1 Major Action</strong>.</li>\n</ul>\n<h4 class=\"term-h4\">Melee Weapons & Durability (\u2b1c\u2b1c\u2b1c)</h4>\n<ul class=\"term-ul\">\n<li><strong>Combat Knife / Tactical Blade (1 Slot):</strong> 3 Durability Boxes. Used for close-quarters fighting and instant grab counter-attacks.</li>\n<li><strong>Fireaxe / Crowbar / Sledgehammer (2 Slots):</strong> 3 Durability Boxes. Adds <strong>+1 to Force rolls</strong> when breaching reinforced doors or crushing armored skulls.</li>\n<li><strong>Durability Loss:</strong> 1 Durability Box is checked on an attack <strong>Failure</strong> or when chosen as the cost on a <strong>Success with Cost</strong>. When all 3 boxes are checked, the weapon breaks permanently and is discarded. Durability cannot be repaired; survivors must scavenge new weapons.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h3 class=\"term-h3\">B. ARMOR & PROTECTIVE GEAR</h3>\n<p class=\"term-p\">Armor provides external protection boxes (\u2b1c). When taking damage, players check off 1 Armor box instead of losing Strain.</p>\n<ul class=\"term-ul\">\n<li><strong>Leather / Reinforced Jacket (1 Slot):</strong> Grants <strong>\u2b1c (1 Armor Box)</strong>. Light protection against scratches and minor shrapnel.</li>\n<li><strong>Ballistic / Kevlar Vest (1 Slot):</strong> Grants <strong>\u2b1c\u2b1c (2 Armor Boxes)</strong>. Standard police/security vest designed to stop handgun fire and blunt impacts.</li>\n<li><strong>Tactical Riot Armor (2 Slots):</strong> Grants <strong>\u2b1c\u2b1c\u2b1c (3 Armor Boxes)</strong>. Heavy military/SWAT protective suit. <em>Drawback:</em> Applies <strong>-1 to Finesse sprint/flee rolls</strong>.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h3 class=\"term-h3\">C. HEALING & MEDICAL ITEMS</h3>\n<p class=\"term-p\">All medicinal herbs are compact items taking <strong>1/4 Inventory Slot</strong> (up to 4 herbs or mixes can stack in 1 slot). First Aid Sprays occupy <strong>1 Full Slot</strong>.</p>\n<ul class=\"term-ul\">\n<li><strong>Green Herb (G) [1/4 Slot]:</strong> Restores <strong>1 Strain</strong>; cures <strong>Bleeding</strong>.</li>\n<li><strong>Green + Green (G+G) [1/4 Slot]:</strong> Restores <strong>3 Strain</strong>; cures <strong>Bleeding</strong>.</li>\n<li><strong>Green + Blue (G+B) [1/4 Slot]:</strong> Restores <strong>1 Strain</strong>, cures <strong>Bleeding & Poisoned</strong>, and lowers Virus Infection by <strong>-1 Stage</strong>.</li>\n<li><strong>Green + Red (G+R) [Full-Heal, 1/4 Slot]:</strong> Fully restores Strain to maximum (10); cures <strong>Bleeding & Limb Damaged</strong>.</li>\n<li><strong>Green + Red + Blue (G+R+B) [Miracle Mix, 1/4 Slot]:</strong> Fully restores Strain to maximum, cures <strong>all conditions</strong>, and lowers Virus Infection by <strong>-1 Stage</strong>.</li>\n<li><strong>First Aid Spray [1 Full Slot]:</strong> Fully restores Strain to maximum and cures <strong>all physical conditions</strong> (Bleeding, Poisoned, Limb Damaged).</li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">7. THE AREA NOISE CLOCK ENGINE</h2>\n<p class=\"term-p\">The <strong>Area Noise Clock (1 to 6 Ticks)</strong> tracks ambient disturbance, gunfire echoes, and the heightened awareness of roaming infected and stalkers within the current sector.</p>\n<h3 class=\"term-h3\">Noise Increase Rules (How the Clock Ticks Up)</h3>\n<ul class=\"term-ul\">\n<li><strong>+1 Tick:</strong></li>\n<li>Firing a <strong>Handgun / Pistol</strong> (9mm unsuppressed).</li>\n<li>Loud environmental actions (smashing open a wooden door, kicking over heavy metal shelving, setting off a car alarm).</li>\n<li>Suffering a <strong>Failure</strong> on a physical or stealth roll in an echoey area.</li>\n<li><strong>+2 Ticks:</strong></li>\n<li>Firing a <strong>Shotgun</strong> (12-Gauge blast) or <strong>Tactical Rifle</strong>.</li>\n<li>Structural breaching (battering down a security gate or heavy metal door).</li>\n<li><strong>+3 Ticks:</strong></li>\n<li>Firing a <strong>Magnum Revolver</strong>.</li>\n<li>Detonating a <strong>Grenade</strong>, fuel barrel, or explosive device.</li>\n</ul>\n<h3 class=\"term-h3\">Clock Escalation Milestones</h3>\n<ul class=\"term-ul\">\n<li><strong>1\u20132 Ticks (Quiet / Dormant):</strong> Ambient groans in the distance. Roaming hostiles remain dormant in their starting positions.</li>\n<li><strong>3\u20134 Ticks (Suspicious / Stirring):</strong> Infected begin shuffling toward the source of the sound; stealth checks suffer <strong>-1</strong>.</li>\n<li><strong>5 Ticks (Alert / Encircling):</strong> Hostiles actively bang on exterior windows, doors rattle, and retreat routes become contested.</li>\n<li><strong>6 Ticks (BREACH EVENT):</strong> The clock resets to 0, and an immediate high-threat encounter is triggered: a roaming horde floods the room, or the sector's <strong>Stalker / Boss B.O.W.</strong> breaches the entry point.</li>\n</ul>\n<h3 class=\"term-h3\">Noise Decay Rules (How the Clock Ticks Down)</h3>\n<ul class=\"term-ul\">\n<li><strong>-1 Tick (Quiet Scene):</strong> Completing <strong>1 full Exploration Scene</strong> without any unsuppressed gunfire, combat rolls, or loud physical actions reduces the clock by <strong>-1 Tick</strong>.</li>\n<li><strong>-1 Tick (Sector Transition):</strong> Successfully traversing from one major sector/building to another without active pursuit reduces the local clock by <strong>-1 Tick</strong>.</li>\n<li><strong>Total Clock Reset (Safe Room Entry):</strong> Entering and securing a certified <strong>Safe Room</strong> completely isolates the party; while inside, the Noise Clock does not advance.</li>\n<li><strong>Post-Breach Reset:</strong> Following the conclusion or escape from a <strong>6/6 Breach Event</strong>, the clock resets to <strong>1 Tick (Quiet)</strong> as the immediate local horde disperses.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">8. ENVIRONMENT & PROGRESSION</h2>\n<ul class=\"term-ul\">\n<li><strong>Item Box (Communal Cache):</strong> Located inside Safe Rooms. Provides shared storage space. Depositing, withdrawing, or organizing items in an Item Box is a free action during a Rest Scene.</li>\n<li><strong>Typewriter (Checkpoint Log):</strong> Survivors record in-character log entries; marks the official save checkpoint and awards milestone PP.</li>\n<li><strong>Progression Points (PP) Awards:</strong></li>\n<li><strong>+1 PP:</strong> Surviving an intense combat or hazard scene.</li>\n<li><strong>+2 PP:</strong> Recovering a vital story file, key sample, or solving an environmental puzzle.</li>\n<li><strong>+3 PP:</strong> Securing a new Safe Room or concluding a major narrative chapter.</li>\n<li><strong>PP Shop Upgrades:</strong></li>\n<li><strong>10 PP:</strong> Increase one Stat by +1 (Cap: +2 max).</li>\n<li><strong>15 PP:</strong> Acquire a new Minor Trait (+1).</li>\n<li><strong>20 PP:</strong> Unlock a new Tactical Specialization domain.</li>\n<li><strong>25 PP:</strong> Expand Inventory by +1 Slot (Pouches/Rig, Cap: 6 slots max).</li>\n</ul>"}, "Sector J-13 - Raccoon Prime Galleria": {"title": "Sector J-13 - Raccoon Prime Galleria", "folder": "06 - CARTOGRAPHY & SECTORS", "path": "06 - CARTOGRAPHY & SECTORS/Sector J-13 - Raccoon Prime Galleria.md", "html": "<h1 class=\"term-h1\">\ud83d\uddfa\ufe0f SECTOR J-13: RACCOON PRIME GALLERIA</h1>\n<ul class=\"term-ul\">\n<li><strong>District:</strong> East Downtown Commercial Sector</li>\n<li><strong>Coordinates on Map:</strong> Grid <code>J-13 / J-14</code></li>\n<li><strong>Live Map Link:</strong> [Open Tactical Map](https://docs-pearl-mu.vercel.app)</li>\n<li><strong>Connected Nodes:</strong></li>\n<li><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Stage 1 - Raccoon Prime Galleria Overview')\">[[Stage 1 - Raccoon Prime Galleria Overview]]</a></li>\n<li>North: <a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Sector J-12 - District Post Office')\">[[Sector J-12 - District Post Office]]</a></li>\n<li>East: <a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Sector K-13 - Theater & Substation')\">[[Sector K-13 - Theater & Substation]]</a></li>\n<li>West: <a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Sector I-12 - City Hall & Central Station')\">[[Sector I-12 - City Hall & Central Station]]</a></li>\n</ul>"}, "B.O.W. & Creature Bestiary": {"title": "B.O.W. & Creature Bestiary", "folder": "02 - BESTIARY & B.O.W.s", "path": "02 - BESTIARY & B.O.W.s/B.O.W. & Creature Bestiary.md", "html": "<h1 class=\"term-h1\">VBG-Z: B.O.W. & CREATURE BESTIARY v2.0</h1>\n<p class=\"term-p\"><em>Standardized monster creation blueprints and ready-to-run bio-organic weapons for GM encounters.</em></p>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">1. B.O.W. DESIGN BLUEPRINT (TEMPLATE)</h2>\n<p class=\"term-p\">Use this template to design balanced, asynchronous threats for VBG-Z. Remember: <strong>Monsters never roll dice</strong>. They declare incoming threats that force players to react using their Major + Minor action economy.</p>\n<p class=\"term-p\"><code></code>`text</p>\n<p class=\"term-p\">==================================================</p>\n<p class=\"term-p\">B.O.W. NAME / DESIGNATION</p>\n<p class=\"term-p\">==================================================</p>\n<p class=\"term-p\">Threat Tier: [Minor | Standard | Major | Boss]</p>\n<p class=\"term-p\">Armor: [\u2b1c (1 Box) to \u2b1c\u2b1c\u2b1c\u2b1c\u2b1c (5 Boxes)]</p>\n<p class=\"term-p\">Noise Sensitivity: [Acoustic Blind | Aggressive +1 | Stalker 6/6 Spawn]</p>\n<p class=\"term-p\">DESCRIPTION & PRESENCE:</p>\n<p class=\"term-p\">[Brief sensory description: sight, sound, smell, movement posture.]</p>\n<p class=\"term-p\">INCOMING THREATS (Actions declared by GM):</p>\n<p class=\"term-p\">\u2022 [Threat 1 - Standard Attack]: Forces [Stat] TN [10/15/20]. Failure: [Damage/Condition].</p>\n<p class=\"term-p\">\u2022 [Threat 2 - Grab / Secondary]: Forces [Stat] TN [10/15/20]. Failure: [Bite / Infection +1 / Prone].</p>\n<p class=\"term-p\">\u2022 [Threat 3 - Enrage / Environmental]: Special movement, wall climb, or AoE shockwave.</p>\n<p class=\"term-p\">STRENGTHS & BEHAVIOR:</p>\n<p class=\"term-p\">\u2022 [Strengths / Resistances]: (e.g., Immune to pain, rapid regeneration, ceiling climber).</p>\n<p class=\"term-p\">\u2022 [Tactics]: (e.g., Lurks in vents, rushes sound of unsuppressed gunfire).</p>\n<p class=\"term-p\">WEAKNESSES & EXPLOITS:</p>\n<p class=\"term-p\">\u2022 [Weaknesses]: (e.g., Called shot headshots TN 20, fire vulnerability, blind to walking pace).</p>\n<p class=\"term-p\">\u2022 [V-ACT / Death State]: Does it mutate into a Crimson Head if not incinerated?</p>\n<p class=\"term-p\">==================================================</p>\n<p class=\"term-p\"><code></code>`</p>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">2. STARTER ENEMY STAT BLOCKS (READY TO RUN)</h2>\n<h3 class=\"term-h3\">A. MINOR THREATS (Swarms & Roamers)</h3>\n<h4 class=\"term-h4\">1. Urban Shambler (Solitary Wanderer)</h4>\n<ul class=\"term-ul\">\n<li><strong>Threat Tier:</strong> Minor</li>\n<li><strong>Armor:</strong> \u2b1c (1 Box)</li>\n<li><strong>Noise Sensitivity:</strong> Drifts toward any sound (+1 Noise brings 1 shambler into adjacent corridors).</li>\n<li><strong>Description:</strong> A freshly turned civilian or police officer. Sluggish gait, vacant milky eyes, persistent guttural groan.</li>\n<li><strong>Incoming Threats:</strong></li>\n<li><em>Lunging Grab:</em> Forces Finesse or Force TN 12. Failure: Inflicts 1 Strain and sets up an immediate bite next turn unless broken.</li>\n<li><em>Bite:</em> If a survivor starts their turn already grabbed, forces Force TN 15 to break free. Failure: Inflicts 1 Strain, causes the <strong>Bleeding</strong> condition, and advances the <strong>Virus Infection Track by +1 Stage</strong>. <em>(Can be countered instantly by expending 1 Knife Durability box or firing 1 Handgun shot).</em></li>\n<li><strong>Strengths:</strong> Ignores non-lethal body trauma; unphased by darkness.</li>\n<li><strong>Weaknesses:</strong> Headshots (Called Shot TN 18 destroys instantly).</li>\n<li><strong>V-ACT Risk:</strong> High. If corpse is left intact without burning or decapitation, revives as a Crimson Head after 2 scenes.</li>\n</ul>\n<h4 class=\"term-h4\">2. Infected K-9 / Cerberus (Zombie Dog)</h4>\n<ul class=\"term-ul\">\n<li><strong>Threat Tier:</strong> Minor (Deadly in packs of 2\u20133)</li>\n<li><strong>Armor:</strong> \u2b1c (1 Box)</li>\n<li><strong>Noise Sensitivity:</strong> Rushes the exact location of gunfire within 1 turn.</li>\n<li><strong>Description:</strong> Emaciated, skin-sloughed Doberman or police dog. Incredibly fast, predatory snarls, bounding gait.</li>\n<li><strong>Incoming Threats:</strong></li>\n<li><em>Sprinting Pounce:</em> Forces Finesse TN 15. Failure: Knocks survivor prone and inflicts 1 Armor/Strain damage.</li>\n<li><em>Throat Tear:</em> Forces Force TN 15 to kick off. Failure: Inflicts 1 Strain and causes the <strong>Bleeding</strong> condition.</li>\n<li><strong>Strengths:</strong> High movement speed (can close distant zones in a single action); cannot be outrun on foot without barricading doors.</li>\n<li><strong>Weaknesses:</strong> Frail skeletal structure. 1 clean Shotgun blast or solid blunt force hit kills instantly.</li>\n<li><strong>V-ACT Risk:</strong> None.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h3 class=\"term-h3\">B. STANDARD THREATS (Party-Level Hazards)</h3>\n<h4 class=\"term-h4\">3. Shambler Horde (Swarm Cluster)</h4>\n<ul class=\"term-ul\">\n<li><strong>Threat Tier:</strong> Standard</li>\n<li><strong>Armor:</strong> \u2b1c\u2b1c\u2b1c (3 Boxes total for the cluster)</li>\n<li><strong>Noise Sensitivity:</strong> Triggered at Noise Clock 4/6 or higher.</li>\n<li><strong>Description:</strong> A tight mass of 4\u20136 rotting infected pressing through narrow hallways, doorways, or broken shopfronts.</li>\n<li><strong>Incoming Threats:</strong></li>\n<li><em>Overwhelming Crush:</em> Forces Force TN 15. Failure: Pinned against wall/floor, marks 1 Armor/Strain box.</li>\n<li><em>Feeding Frenzy:</em> If pinned, forces Force TN 18. Failure: 2 Strain, <strong>Bleeding</strong>, and <strong>+1 Infection Stage</strong>.</li>\n<li><strong>Strengths:</strong> Immune to single-target small arms knockdown.</li>\n<li><strong>Weaknesses:</strong> Fire & Area Explosives (Grenades/Molotovs wipe the entire horde in 1 blast). Shotguns hit all 3 boxes if fired at point-blank range.</li>\n</ul>\n<h4 class=\"term-h4\">4. Crimson Head (V-ACT Mutant)</h4>\n<ul class=\"term-ul\">\n<li><strong>Threat Tier:</strong> Standard</li>\n<li><strong>Armor:</strong> \u2b1c\u2b1c (2 Boxes)</li>\n<li><strong>Noise Sensitivity:</strong> Hyper-aggressive; pursues fleeing survivors across sector transitions.</li>\n<li><strong>Description:</strong> A revived shambler with crimson skin, elongated razor claws, heightened muscle mass, and rapid, twitching sprint mechanics.</li>\n<li><strong>Incoming Threats:</strong></li>\n<li><em>Frenzied Claw Slash:</em> Forces Finesse TN 16. Failure: Inflicts 1 Armor/Strain damage and causes <strong>Bleeding</strong>.</li>\n<li><em>Leaping Decapitation Strike:</em> Forces Finesse TN 18. Failure: Inflicts 2 Strain and the <strong>Limb Damaged</strong> condition.</li>\n<li><strong>Strengths:</strong> Sprints at full human speed; attacks twice during combat resolution if unengaged.</li>\n<li><strong>Weaknesses:</strong> Shotgun blasts to the chest or head deal double damage. Incendiary damage destroys instantly.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h3 class=\"term-h3\">C. MAJOR THREATS (Elite B.O.W.s & Set Pieces)</h3>\n<h4 class=\"term-h4\">5. Licker (Acoustic Apex Predator)</h4>\n<ul class=\"term-ul\">\n<li><strong>Threat Tier:</strong> Major</li>\n<li><strong>Armor:</strong> \u2b1c\u2b1c\u2b1c (3 Boxes)</li>\n<li><strong>Noise Sensitivity:</strong> <strong>Acoustic Hunter.</strong> Detects running, gunfire (+1/+2 Noise), or loud interactions instantly.</li>\n<li><strong>Description:</strong> Quadrupedal mutant with exposed brain matter, skinless muscle tissue, razor-sharp scythe talons, and a 10-foot prehensile barbed tongue. Climbs walls and hangs from ceiling rafters.</li>\n<li><strong>Incoming Threats:</strong></li>\n<li><em>Ceiling Drop / Talon Flurry:</em> Forces Finesse TN 18. Failure: 1 Armor/Strain damage and inflicts <strong>Limb Damaged (Leg)</strong>.</li>\n<li><em>Barbed Tongue Harpoon:</em> Ranged strike. Forces Finesse TN 16. Failure: 1 Strain, <strong>Bleeding</strong>, and pulls the survivor across the room into melee range.</li>\n<li><strong>Strengths:</strong> Extreme vertical mobility (ignores ground barricades); immune to visual flashbangs.</li>\n<li><strong>Weaknesses:</strong> <strong>Completely Blind.</strong> Moving at a slow walking pace requires only Finesse TN 10 to walk right underneath it without alerting it. Highly vulnerable to 12-Gauge Shotgun blasts and Acid rounds.</li>\n</ul>\n<h4 class=\"term-h4\">6. Drain Deimos (Infestation Crawler)</h4>\n<ul class=\"term-ul\">\n<li><strong>Threat Tier:</strong> Major</li>\n<li><strong>Armor:</strong> \u2b1c\u2b1c (2 Boxes)</li>\n<li><strong>Noise Sensitivity:</strong> Nests in sewer grates, ventilation shafts, and electrical substations.</li>\n<li><strong>Description:</strong> Giant mutated flea/arthropod that scuttles across walls and ceilings. Emits a high-pitched chittering hiss.</li>\n<li><strong>Incoming Threats:</strong></li>\n<li><em>Ceiling Pounce / Parasite Implantation:</em> Forces Finesse TN 16. Failure: Inflicts 1 Strain and inflicts the <strong>Poisoned</strong> condition (+1 Infection Stage).</li>\n<li><em>Acid Bile Spit:</em> Ranged cone. Forces Finesse TN 15. Failure: Instantly dissolves 1 Armor Box on worn vests.</li>\n<li><strong>Strengths:</strong> Wall crawler; swarms from dark ventilation ducts.</li>\n<li><strong>Weaknesses:</strong> Vulnerable to fire and electric hazards (car batteries, exposed wiring).</li>\n</ul>\n<hr class=\"term-hr\" />\n<h3 class=\"term-h3\">D. BOSS-TIER THREAT (The Roaming Stalker)</h3>\n<h4 class=\"term-h4\">7. T-103 Tyrant (\"Mr. X\")</h4>\n<ul class=\"term-ul\">\n<li><strong>Threat Tier:</strong> Boss</li>\n<li><strong>Armor:</strong> \u2b1c\u2b1c\u2b1c\u2b1c\u2b1c (5 Boxes; regenerates 1 Armor Box at the start of each scene if not burning).</li>\n<li><strong>Noise Sensitivity:</strong> <strong>Spawns on 6/6 Breach Events.</strong> Smashes through walls or reinforced doors directly toward the party's location.</li>\n<li><strong>Description:</strong> A 7-foot-tall, pale-skinned bio-engineered humanoid encased in a heavy bulletproof trench coat and fedora. Slow, deliberate, heavy combat boot footsteps echo before he enters a room. Unflinching, silent, and single-mindedly focused on terminating witnesses.</li>\n<li><strong>Incoming Threats:</strong></li>\n<li><em>Haymaker / Kinetic Punch:</em> Forces Force or Finesse TN 20. Failure: 2 Strain, <strong>Panicked</strong> condition, and smashes the survivor across the room through wooden furniture/doors.</li>\n<li><em>One-Handed Choke Lift & Crush:</em> Forces Force TN 18 to break grip. Failure: 1 Strain, <strong>Limb Damaged</strong> condition, and sets up a lethal head crush next turn unless staggered by allies.</li>\n<li><em>Unstoppable Advance:</em> Smashes environmental doors and barricades as a free action; cannot be locked inside standard rooms.</li>\n<li><strong>Strengths:</strong> Immune to small-arms stun; bulletproof coat negates handgun damage unless shot in the exposed head/face (Called Shot TN 18). Regenerates armor.</li>\n<li><strong>Weaknesses:</strong></li>\n<li>Concentrated heavy fire (Magnum / Shotgun / High Explosives) can break his 5 Armor boxes, forcing him to drop to one knee and enter <strong>Stunned Stasis for 1 Scene</strong>, allowing the party a window to flee.</li>\n<li>Environmental Traps (dropping heavy storage containers, electrocution, collapsing stairwells) bypass his armor and force immediate stasis.</li>\n</ul>"}, "00 - Biohazard Campaign Index": {"title": "00 - Biohazard Campaign Index", "folder": "00 - CAMPAIGN HUB", "path": "00 - CAMPAIGN HUB/00 - Biohazard Campaign Index.md", "html": "<h1 class=\"term-h1\">\u2623\ufe0f BIOHAZARD: RACCOON CITY CAMPAIGN HUB</h1>\n<p class=\"term-p\"><em>Interactive VBG-Z Campaign Vault & Tactical Operating Database.</em></p>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">\ud83e\udded PRIMARY CAMPAIGN CHRONOLOGY</h2>\n<ul class=\"term-ul\">\n<li>\ud83d\udcd6 <strong><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('01 - Master Campaign Narrative')\">[[01 - Master Campaign Narrative]]</a></strong> <em>(Read Here: The full story from Hour Zero onward with embedded zone/NPC links)</em></li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">\ud83d\uddfa\ufe0f SCENARIOS & LOCATIONS</h2>\n<ul class=\"term-ul\">\n<li>\ud83c\udfec <strong><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Stage 1 - Raccoon Prime Galleria Overview')\">[[Stage 1 - Raccoon Prime Galleria Overview]]</a></strong> (<code>Sector J-13 / J-14</code>)</li>\n<li><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Zone 1.1 - 1st Floor Central Atrium & Retail')\">[[Zone 1.1 - 1st Floor Central Atrium & Retail]]</a></li>\n<li><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Zone 1.2 - 2nd Floor Mezzanine & Outfitters')\">[[Zone 1.2 - 2nd Floor Mezzanine & Outfitters]]</a></li>\n<li><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Zone 1.3 - 3rd Floor Security Operations & Safe Room')\">[[Zone 1.3 - 3rd Floor Security Operations & Safe Room]]</a></li>\n<li><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Zone 1.4 - Basement & East Loading Bay')\">[[Zone 1.4 - Basement & East Loading Bay]]</a></li>\n<li>\ud83d\ude8c <strong>Stage 2 - Downtown Transit & Collision</strong> (<code>Sector I-12 / I-13</code>)</li>\n<li><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Node 2.1 - Branch A (The Bus Convoy Route)')\">[[Node 2.1 - Branch A (The Bus Convoy Route)]]</a></li>\n<li><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Node 2.2 - Branch B (The East River Run)')\">[[Node 2.2 - Branch B (The East River Run)]]</a></li>\n<li><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Node 2.3 - The Intersection Crash Site')\">[[Node 2.3 - The Intersection Crash Site]]</a></li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">\ud83d\udcdc CORE RULES & SYSTEMS</h2>\n<ul class=\"term-ul\">\n<li>\ud83d\udcd6 <strong><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('VBG-Z Player Rulebook')\">[[VBG-Z Player Rulebook]]</a></strong> \u2014 Core d20 resolution, Strain, Armor, and 4-Slot Dossier.</li>\n<li>\ud83e\uddec <strong><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Survivor Traits & Specializations')\">[[Survivor Traits & Specializations]]</a></strong> \u2014 35 Major Traits, 42 Minor Traits, 10 Specialization Domains.</li>\n<li>\u2623\ufe0f <strong><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('GM Survival Horror Compendium')\">[[GM Survival Horror Compendium]]</a></strong> \u2014 Area Noise Clock, Ammo economy, 24h asynchronous side-initiative.</li>\n<li>\ud83d\udc7e <strong><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('B.O.W. & Creature Bestiary')\">[[B.O.W. & Creature Bestiary]]</a></strong> \u2014 T-103 Mr. X Tyrant, Lickers, Shamblers, Pack Hunters.</li>\n<li>\ud83d\udcd1 <strong><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Master Rules Glossary & Keywords')\">[[Master Rules Glossary & Keywords]]</a></strong> \u2014 Conditions, Herb synthesis combinations, Distance/Reach bands.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">\ud83d\udc65 NOTABLE NPCS & FACTIONS</h2>\n<ul class=\"term-ul\">\n<li>\ud83d\udee1\ufe0f <strong><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Officer Kevin Vance')\">[[Officer Kevin Vance]]</a></strong> \u2014 Rookie mall security guard (lacerated shoulder).</li>\n<li>\ud83d\udc8a <strong><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Pharmacist Arthur Pendelton')\">[[Pharmacist Arthur Pendelton]]</a></strong> \u2014 Pharm-Plus chief chemist & herbalist.</li>\n</ul>"}, "01 - Master Campaign Narrative": {"title": "01 - Master Campaign Narrative", "folder": "00 - CAMPAIGN HUB", "path": "00 - CAMPAIGN HUB/01 - Master Campaign Narrative.md", "html": "<h1 class=\"term-h1\">\u2623\ufe0f CAMPAIGN MASTER CHRONOLOGY: ZERO HOUR TO COLLAPSE</h1>\n<blockquote class=\"term-quote\"><em>A chronological, scene-by-scene campaign narrative for the Biohazard storyline. Detailed zone maps, search points, loot tables, and NPC dossier cards are linked directly within each story beat via <code><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Wikilinks')\">[[Wikilinks]]</a></code> so you can jump to mechanical references while keeping the story primary.</em></blockquote>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">\ud83c\udfac ACT I: HOUR ZERO \u2014 THE GALLERIA LOCKDOWN</h2>\n<h3 class=\"term-h3\">Scene 1: The Ambient Cracks (19:45 EST)</h3>\n<p class=\"term-p\">The campaign opens inside the <strong>Raccoon Prime Galleria</strong> (<a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Sector J-13 - Raccoon Prime Galleria')\">[[Sector J-13 - Raccoon Prime Galleria]]</a>), on the east bank of the Circular River. It is a rainy Friday evening in late September. Emergency sirens wail continuously along the distant Arklay mountain perimeter, and local news broadcasts on display televisions intermittently flicker with static reports of quarantined roadblocks.</p>\n<p class=\"term-p\">The mall is still open, but the atmosphere is tense. Shoppers are scattered across the ground floor promenade, unaware that patient zero has already entered the city transit grid.</p>\n<ul class=\"term-ul\">\n<li><strong>Primary Narrative Focus:</strong> The party members meet or establish their starting positions within the mall during normal business hours.</li>\n<li><strong>Explorable Zone References:</strong></li>\n<li>Survivors on the ground floor start in <a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Zone 1.1 - 1st Floor Central Atrium & Retail')\">[[Zone 1.1 - 1st Floor Central Atrium & Retail]]</a>.</li>\n<li>Survivors browsing upper specialty shops start in <a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Zone 1.2 - 2nd Floor Mezzanine & Outfitters')\">[[Zone 1.2 - 2nd Floor Mezzanine & Outfitters]]</a>.</li>\n<li><strong>Intercom Broadcast #1:</strong></li>\n<blockquote class=\"term-quote\"><em>\"Attention valued shoppers. Security requests that all patrons remain vigilant. Please report any disoriented, highly agitated, or flu-symptomatic individuals to mall security dispatch immediately.\"</em></blockquote>\n</ul>\n<hr class=\"term-hr\" />\n<h3 class=\"term-h3\">Scene 2: The Parking Gate Standoff & The Rookie\u2019s Wound (20:00 EST)</h3>\n<p class=\"term-p\">A loud disturbance breaks out at the basement parking concourse. Security personnel begin manually closing the heavy steel roll-up gates leading to Parking Structure B against a mob of agitated citizens banging on the exterior glass.</p>\n<ul class=\"term-ul\">\n<li><strong>Primary Narrative Focus:</strong></li>\n<li>Rookie security officer <a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Officer Kevin Vance')\">[[Officer Kevin Vance]]</a> sustains a severe, bleeding laceration across his shoulder.</li>\n<li><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Pharmacist Arthur Pendelton')\">[[Pharmacist Arthur Pendelton]]</a> rushes over with medical supplies from Pharm-Plus.</li>\n<li>The players have an opportunity to assist with first aid (<code>Focus TN 10</code>), establishing early cooperation and confirming the wound is jagged torn metal from a broken turnstile\u2014not a human bite.</li>\n<li><strong>Zone Location:</strong> <a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Zone 1.4 - Basement & East Loading Bay')\">[[Zone 1.4 - Basement & East Loading Bay]]</a>.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h3 class=\"term-h3\">Scene 3: The 20-Minute Scavenge Window (20:05 \u2013 20:25 EST)</h3>\n<p class=\"term-p\">Following the gate incident, security chief Raymond Miller urges all remaining patrons to prepare to leave or shelter while transit authorities assess street safety. Survivors have a narrow 20-minute window of liberty before full containment measures initiate.</p>\n<ul class=\"term-ul\">\n<li><strong>Primary Narrative Focus:</strong> Survivors scrounge for basic survival gear, tools, and medical herbs before the shops are shuttered.</li>\n<li><strong>Accessible Exploration Zones (Choose 1-2 to investigate):</strong></li>\n<li><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Zone 1.1 - 1st Floor Central Atrium & Retail')\">[[Zone 1.1 - 1st Floor Central Atrium & Retail]]</a> \u2014 First aid herbs at <em>Pharm-Plus</em>, bladed tools at <em>King\u2019s Cutlery</em>, commercial gas cutoffs at the <em>Food Court</em>.</li>\n<li><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Zone 1.2 - 2nd Floor Mezzanine & Outfitters')\">[[Zone 1.2 - 2nd Floor Mezzanine & Outfitters]]</a> \u2014 Hunting bows, crowbars, and tactical gear at <em>Grizzly Outdoors</em>; emergency communications at <em>Tech Nexus</em>; dark screening rooms at <em>Raccoon Cineplex</em>.</li>\n<li><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Zone 1.3 - 3rd Floor Security Operations & Safe Room')\">[[Zone 1.3 - 3rd Floor Security Operations & Safe Room]]</a> \u2014 CCTV camera feeds, manual typewriter, and the locked security arms locker.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h3 class=\"term-h3\">Scene 4: Level 4 Quarantine & The Steel Lockdown (20:25 EST)</h3>\n<p class=\"term-p\">At 20:25 EST, all retail music abruptly cuts out. The citywide emergency broadcast alarm blares across the mall public address system:</p>\n<blockquote class=\"term-quote\"><em>\"Civil Emergency Alert. By order of the State Governor and Raccoon City Municipal Council, a Level 4 Sanitary Quarantine is now in effect. All citizens are instructed to immediately seek shelter in their homes or designated municipal staging facilities. Avoid all aggressive individuals. All perimeter gates will be sealed until dawn.\"</em></blockquote>\n<p class=\"term-p\">Hydraulic sirens sound as heavy steel riot shutters drop over every exterior glass entrance, skylight, and parking gate. The mall is sealed from the outside world. Survivors are herded by security back to the central atrium.</p>\n<ul class=\"term-ul\">\n<li><strong>Zone Transition:</strong> Convergence back to <a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Zone 1.1 - 1st Floor Central Atrium & Retail')\">[[Zone 1.1 - 1st Floor Central Atrium & Retail]]</a>.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h3 class=\"term-h3\">Scene 5: The Major Fork in the Road (20:30 EST)</h3>\n<p class=\"term-p\">Security Chief Miller gathers the survivors at the atrium and announces that municipal transit authorities have staged three emergency evacuation buses at the North Loading Bay under police escort to transport civilians west across the bridge toward the safety of the downtown precinct perimeter.</p>\n<p class=\"term-p\">Survivors must make their first critical campaign decision:</p>\n<p class=\"term-p\"><code></code>`</p>\n<p class=\"term-p\">[ THE FORK IN THE ROAD ]</p>\n<div class=\"table-wrap\"><table><thead><tr></tr></thead><tbody>\n</tbody></table></div>\n<p class=\"term-p\">+---------------------+---------------------+</p>\n<div class=\"table-wrap\"><table><thead><tr><th></th></tr></thead><tbody>\n</tbody></table></div>\n<p class=\"term-p\">[ OPTION A ]                                [ OPTION B ]</p>\n<p class=\"term-p\">Board the Evacuation Bus                     Hold & Fortify the Mall</p>\n<p class=\"term-p\">(Heads West via North Loading Bay)             (Retreat to 3rd Floor Ops)</p>\n<div class=\"table-wrap\"><table><thead><tr><th></th></tr></thead><tbody>\n</tbody></table></div>\n<p class=\"term-p\">v                                           v</p>\n<p class=\"term-p\"><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Node 2.1 - Branch A')\">[[Node 2.1 - Branch A]]</a>                     <a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Node 2.2 - Branch B')\">[[Node 2.2 - Branch B]]</a></p>\n<p class=\"term-p\"><code></code>`</p>\n<ul class=\"term-ul\">\n<li><strong>Branch A (The Evacuation Bus):</strong></li>\n<li>Survivors board Transit Bus #14 idling in <a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Zone 1.4 - Basement & East Loading Bay')\">[[Zone 1.4 - Basement & East Loading Bay]]</a>.</li>\n<li>Narrative continues in <strong><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Node 2.1 - Branch A (The Bus Convoy Route)')\">[[Node 2.1 - Branch A (The Bus Convoy Route)]]</a></strong>.</li>\n<li><strong>Branch B (Holding the Galleria):</strong></li>\n<li>Survivors refuse the bus, choosing to fortify the 3rd-floor security suite (<a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Zone 1.3 - 3rd Floor Security Operations & Safe Room')\">[[Zone 1.3 - 3rd Floor Security Operations & Safe Room]]</a>).</li>\n<li>Narrative continues in <strong><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Node 2.2 - Branch B (The East River Run)')\">[[Node 2.2 - Branch B (The East River Run)]]</a></strong>.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">\ud83c\udfac ACT II: DOWNTOWN TRANSIT & THE COLLISION</h2>\n<p class=\"term-p\"><em>(The narrative branches converge at the burning wreckage of the downtown transit corridor)</em></p>\n<ul class=\"term-ul\">\n<li><strong><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Node 2.1 - Branch A (The Bus Convoy Route)')\">[[Node 2.1 - Branch A (The Bus Convoy Route)]]</a></strong> \u2014 Outbreak inside the moving bus cabin, high-speed collision at the Mission St bridgehead.</li>\n<li><strong><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Node 2.2 - Branch B (The East River Run)')\">[[Node 2.2 - Branch B (The East River Run)]]</a></strong> \u2014 Grid blackout from the overrun East Substation, sub-basement sewer crawl to the Circular River embankment.</li>\n<li><strong><a href=\"javascript:void(0)\" class=\"obsidian-link\" onclick=\"openVaultDoc('Node 2.3 - The Intersection Crash Site')\">[[Node 2.3 - The Intersection Crash Site]]</a></strong> \u2014 The burning crossroads at <code>Sector I-12 / I-13</code> between Raccoon City Hall and Central Station.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">\ud83c\udfac ACT III: THE EXPANDING CAMPAIGN (UPCOMING)</h2>\n<ul class=\"term-ul\">\n<li><strong>Stage 3:</strong> The Siege of Raccoon City Hall (<code>Sector I-12</code>) & Central Station Concourse (<code>Sector H-12</code>).</li>\n<li><strong>Stage 4:</strong> The Ennerdale Alleys & Kendo Gun Shop (<code>Sector D-13 / E-14</code>).</li>\n<li><strong>Stage 5:</strong> The R.P.D. Rear Perimeter (<code>Sector E-13</code>).</li>\n</ul>"}, "GM Survival Horror Compendium": {"title": "GM Survival Horror Compendium", "folder": "01 - RULES & ENGINE", "path": "01 - RULES & ENGINE/GM Survival Horror Compendium.md", "html": "<h1 class=\"term-h1\">VBG-Z: GAME MASTER SURVIVAL HORROR RESOURCE v2.0</h1>\n<p class=\"term-p\"><em>Master GM adjudication guidelines, environmental systems, B.O.W. stat cards, and campaign pacing.</em></p>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">1. SETTING TARGET DIFFICULTIES (TN) & ADJUDICATION</h2>\n<p class=\"term-p\">Tell players the TN or narrative difficulty tier before they roll:</p>\n<ul class=\"term-ul\">\n<li><strong>TN 10 (Routine):</strong> Low-stress action, basic observation, foraging a ransacked room.</li>\n<li><strong>TN 15 (Risky):</strong> Standard combat action, prying a door before zombies arrive, stealthing across broken glass.</li>\n<li><strong>TN 20 (Desperate):</strong> Precision called shot, evading a Licker's tongue strike, leaping across a burning chasm.</li>\n<li><strong>TN 25+ (Extreme):</strong> Staggering a charging Tyrant/Stalker, disarming a biological fail-safe under a 60-second timer.</li>\n</ul>\n<h3 class=\"term-h3\">Adjudicating Outcomes</h3>\n<ul class=\"term-ul\">\n<li><strong>Failure (Miss by 5+):</strong> Deal 1 Strain/Armor damage, trigger an environmental hazard, or tick the Noise Clock by +1.</li>\n<li><strong>Success with Cost (Miss by 1\u20134):</strong> Award the success, but exact a price: player marks 1 Strain, checks 1 weapon durability box, expends extra ammo, or gains a minor condition.</li>\n<li><strong>Clean Success (Beat by 0\u20135):</strong> Complete objective without secondary penalties.</li>\n<li><strong>Critical Success (Beat by 6+):</strong> Perfect feat. Award bonus damage, environmental knockdown, or decay the local Noise Clock by -1.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">2. THE AREA NOISE & THREAT CLOCK ENGINE</h2>\n<p class=\"term-p\">Every active sector or building floor operates on a <strong>0 to 6 Tick Noise Clock</strong>:</p>\n<p class=\"term-p\"><code></code>`text</p>\n<p class=\"term-p\">[NOISE CLOCK] [ ][ ][ ][ ][ ][ ] (0/6 Ticks)</p>\n<p class=\"term-p\"><code></code>`</p>\n<h3 class=\"term-h3\">Noise Triggers (Increases)</h3>\n<ul class=\"term-ul\">\n<li><code>+1 Tick:</code> 9mm Handgun fire, loud physical impacts (kicking wooden doors, shattering windows), failed stealth rolls.</li>\n<li><code>+2 Ticks:</code> 12-Gauge Shotgun blast, Tactical Rifle shot, battering steel security gates.</li>\n<li><code>+3 Ticks:</code> Magnum fire, Hand Grenades, exploding fuel barrels.</li>\n</ul>\n<h3 class=\"term-h3\">Clock Decay & Resets</h3>\n<ul class=\"term-ul\">\n<li><code>-1 Tick:</code> Completing 1 full Exploration Scene without unsuppressed gunfire.</li>\n<li><code>-1 Tick:</code> Transitioning to a new sector/floor without active pursuit.</li>\n<li><code>Isolation:</code> Entering a verified Safe Room (Noise Clock does not advance inside).</li>\n</ul>\n<h3 class=\"term-h3\">Escalation Milestones</h3>\n<ul class=\"term-ul\">\n<li><strong>Ticks 1\u20133 (Quiet to Noticeable):</strong> Ambient distant groans; wanderers shuffle in adjacent corridors.</li>\n<li><strong>Ticks 4\u20135 (Elevated Risk):</strong> 1\u20132 shamblers or a mutant investigate the current room. Stealth TNs increase by +2.</li>\n<li><strong>Tick 6/6 (BREACH EVENT):</strong> Immediate ambush! A horde breaches windows/doors, or a roaming Boss-tier Stalker spawns into the room. The clock resets to 1 Tick after resolving or escaping the breach.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">3. ASYNCHRONOUS MONSTER BLUEPRINTS (B.O.W. CARDS)</h2>\n<p class=\"term-p\"><em>Monsters do not roll dice. They declare incoming threats, forcing players to react using their Major + Minor actions.</em></p>\n<h3 class=\"term-h3\">SHAMBLER HORDE (Threat Tier: Standard)</h3>\n<ul class=\"term-ul\">\n<li><strong>Description:</strong> Decaying, relentless infected driven by pure viral hunger.</li>\n<li><strong>Armor:</strong> \u2b1c\u2b1c (2 Boxes total per cluster).</li>\n<li><strong>Actions:</strong></li>\n<li><em>Lunge & Grab:</em> Forces Finesse or Force TN 15. Failure results in a bite (+1 Strain, +1 Virus Infection Stage). Can be countered instantly with a knife durability check or point-blank handgun shot.</li>\n<li><em>Swarm Compression:</em> Traps a survivor against a wall; requires Force TN 15 to shove free.</li>\n<li><strong>Strengths:</strong> Immune to pain and shock; unphased by limb strikes.</li>\n<li><strong>Weaknesses:</strong> Fire & Headshots (Called shot TN 20 destroys instantly and prevents V-ACT mutation).</li>\n<li><strong>V-ACT Mutation (Crimson Heads):</strong> Any corpse left unburned or undecapitated will revive after 2 scenes as a Crimson Head (Armor \u2b1c\u2b1c\u2b1c, sprints, attacks twice per turn).</li>\n</ul>\n<h3 class=\"term-h3\">LICKER (Threat Tier: Major)</h3>\n<ul class=\"term-ul\">\n<li><strong>Description:</strong> Blind quadrupedal predator with exposed cerebral tissue, razor talons, and a prehensile barbed tongue.</li>\n<li><strong>Armor:</strong> \u2b1c\u2b1c\u2b1c (3 Boxes).</li>\n<li><strong>Actions:</strong></li>\n<li><em>Ceiling Ambush / Pounce:</em> Forces Finesse TN 18 or take 1 Armor/Strain damage and suffer the <em>Limb Damaged</em> condition.</li>\n<li><em>Barbed Tongue Lash:</em> Forces Finesse TN 16 at range. Failure inflicts 1 Strain and the <em>Bleeding</em> condition.</li>\n<li><strong>Strengths:</strong> Climbs walls/ceilings; incredible acoustic tracking (+2 TN to stealth).</li>\n<li><strong>Weaknesses:</strong> Completely blind. Moving at walking pace requires only Finesse TN 10 to slip past completely unnoticed. Highly vulnerable to Shotguns & Acid.</li>\n</ul>\n<h3 class=\"term-h3\">THE PURSUER / STALKER (Threat Tier: Boss)</h3>\n<ul class=\"term-ul\">\n<li><strong>Description:</strong> Hulking, trench-coated bio-engineered tyrant programmed for relentless tracking and eradication.</li>\n<li><strong>Armor:</strong> \u2b1c\u2b1c\u2b1c\u2b1c\u2b1c (5 Boxes; regenerates 1 box at the end of each combat round).</li>\n<li><strong>Actions:</strong></li>\n<li><em>Choke Slam / Wall Slam:</em> Forces Force TN 20 to resist. Failure inflicts 2 Strain and the <em>Panicked</em> condition.</li>\n<li><em>Relentless Advance:</em> Smashes through reinforced walls and locked wooden doors as a free environmental action.</li>\n<li><em>Tentacle Sweep:</em> Forces all players in the room to roll Finesse TN 15 or be knocked prone.</li>\n<li><strong>Strengths:</strong> Cannot be permanently killed with standard small arms. Heavy firearms (Shotguns, Magnums) only stagger or delay it.</li>\n<li><strong>Weaknesses:</strong> Concentrated heavy explosives or environmental hazards (dropping shipping containers, electrical grids) will force it to kneel for 1 scene, allowing escape.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">4. ASYNCHRONOUS SCENE PACING & RESOLUTION</h2>\n<h3 class=\"term-h3\">24-Hour Side-Initiative Cycle</h3>\n<p class=\"term-ol-item\">\u2022 <strong>GM Scene Post:</strong> Describe the environment, state the active Noise Clock (e.g., <code>3/6</code>), and declare all incoming hostile threats.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Player Reaction Phase:</strong> Players have 24 hours to post their narrative action, declare 1 Major Action + 1 Minor Action, and roll <code>1d20 + Stat + Trait</code>. Conditional posting is encouraged (<em>\"If the zombie grabs me, I counter with my knife; otherwise I shoot\"</em>).</p>\n<p class=\"term-ol-item\">\u2022 <strong>GM Resolution Post:</strong> The GM resolves all rolls simultaneously, updates room vitals, applies damage/conditions, ticks the Noise Clock, and sets the next scene.</p>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">5. CAMPAIGN PROGRESSION (PP REWARDS & SHOP)</h2>\n<h3 class=\"term-h3\">PP Award Guidelines</h3>\n<ul class=\"term-ul\">\n<li><strong>+1 PP:</strong> Surviving a hazardous combat encounter or navigating a dangerous trap.</li>\n<li><strong>+2 PP:</strong> Discovering a key research file, solving an environmental puzzle, or securing a safehouse.</li>\n<li><strong>+3 PP:</strong> Completing a major story chapter or defeating a Boss-tier B.O.W.</li>\n</ul>\n<h3 class=\"term-h3\">PP Shop</h3>\n<ul class=\"term-ul\">\n<li><strong>10 PP:</strong> Increase a Stat by +1 (Force, Finesse, or Focus; maximum +3).</li>\n<li><strong>15 PP:</strong> Learn a new Minor Trait (+1 Bonus).</li>\n<li><strong>20 PP:</strong> Unlock a new Tactical Specialization Domain.</li>\n<li><strong>25 PP:</strong> Gain +1 Permanent Inventory Slot (Maximum 6 slots).</li>\n</ul>"}, "Survivor Traits & Specializations": {"title": "Survivor Traits & Specializations", "folder": "01 - RULES & ENGINE", "path": "01 - RULES & ENGINE/Survivor Traits & Specializations.md", "html": "<h1 class=\"term-h1\">VBG-Z: SURVIVOR TRAITS & SPECIALIZATIONS COMPENDIUM</h1>\n<blockquote class=\"term-quote\"><strong>Note on Customization:</strong> These lists are samples and baselines to inspire character creation. They are <strong>not</strong> strictly limited to what is written here. You are encouraged to collaborate with the GM to create your own personalized Major Traits, Minor Traits, or Tactical Specializations that fit your survivor concept.</blockquote>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">1. MAJOR TRAITS (+2 BONUS)</h2>\n<p class=\"term-p\"><em>Choose 1 at character creation. Represents your pre-collapse profession, military role, or primary archetype.</em></p>\n<h3 class=\"term-h3\">Tactical & Law Enforcement</h3>\n<p class=\"term-ol-item\">\u2022 <strong>S.T.A.R.S. / Special Forces Operative:</strong> Room clearing, target acquisition, tactical firearm discipline, and weapon handling under pressure.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Beat Cop / Law Enforcement:</strong> Street smarts, standard police issue firearms, crowd control, and assessing suspicious behavior.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Umbrella Security Service (U.S.S.) Cleaner:</strong> Cold efficiency in bio-containment zones, hazard handling, hazmat protocols, and tactical maneuvering.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Private Military Contractor (PMC):</strong> Heavy weaponry, suppressive fire, defensive positioning, and combat communications.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Close Protection Bodyguard:</strong> Defensive reactions, intercepting incoming strikes meant for allies, and escort movement.</p>\n<p class=\"term-ol-item\">\u2022 <strong>SWAT Breacher:</strong> Shotgun breaching, clearing tight doorways, riot shield tactics, and heavy threshold control.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Sniper / Recon Scout:</strong> Long-range rifle marksmanship, overwatch spotting, range estimation, and silent camouflage.</p>\n<h3 class=\"term-h3\">Medical & Science</h3>\n<p class=\"term-ol-item\">\u2022 <strong>Trauma Surgeon / ER Doctor:</strong> Precision surgical procedures, stabilizing arterial bleeds, setting compound fractures, and managing medical tools.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Paramedic / First Responder:</strong> Rapid triage under chaos, CPR, field dressing, and carrying incapacitated casualties.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Virologist / Bio-Researcher:</strong> Identifying B.O.W. behavioral traits, understanding viral transmission vectors, and lab chemical synthesis.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Pharmaceutical Chemist:</strong> Formulating chemical reagents, synthesizing herbal compounds, and identifying toxins/antidotes.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Forensic Pathologist:</strong> Autopsy assessment, diagnosing infection cause/stage, and identifying anatomical weak points on mutated corpses.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Combat Medic / Corpsman:</strong> Patching bullet and bite wounds under live hostile fire, dragging wounded allies, and conserving medical supplies.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Toxicologist:</strong> Analyzing venom/spit compounds (Licker/Drain Deimos), synthesizing custom antidotes, and hazardous fluid handling.</p>\n<h3 class=\"term-h3\">Engineering & Technical</h3>\n<p class=\"term-ol-item\">\u2022 <strong>Combat Engineer / Sapper:</strong> Fortifying structures, setting defensive barricades, door breaching, and structural integrity assessment.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Master Mechanic:</strong> Hotwiring vehicles, repairing combustion engines, generator maintenance, and jury-rigging mechanical parts.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Industrial Electrician:</strong> Rewiring substation panels, bypassing electronic keycard locks, and handling high-voltage hazards.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Demolitions Specialist:</strong> Safe handling of explosive ordnance, creating pipe bombs, and controlled structural demolition.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Locksmith / Security Technician:</strong> Bypassing mechanical locks, vault doors, security tumblers, and alarm systems quietly.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Civil / Structural Engineer:</strong> Reading facility architectural blueprints, identifying load-bearing weak points, and flood/ventilation routing.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Radio Operator / Comms Technician:</strong> Repairing military radio transmitters, intercepting broadcast frequencies, and signal triangulation.</p>\n<h3 class=\"term-h3\">Survivalist & Wilderness</h3>\n<p class=\"term-ol-item\">\u2022 <strong>Wasteland Hunter / Tracker:</strong> Stalking prey silently, tracking infected spoor, setting snare traps, and long-range marksmanship.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Wilderness Survival Guide:</strong> Foraging medicinal herbs, navigating unmapped terrain, fire starting, and shelter construction.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Park Ranger / Forester:</strong> Broad wilderness survival, heavy terrain traversal, axe/machete handling, and weather assessment.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Deep Woods Outfitter:</strong> Resource budgeting, pack optimization, and heavy load carrying over long distances.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Extreme Outdoorsman / Mountaineer:</strong> Rappelling, climbing broken facades, cold-weather endurance, and navigating jagged debris.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Archery Instructor / Bowhunter:</strong> Silent projectile retrieval, bow handling, silent target elimination, and crafting improvised arrows.</p>\n<h3 class=\"term-h3\">Urban & Underworld</h3>\n<p class=\"term-ol-item\">\u2022 <strong>Urban Scavenger:</strong> Spotting hidden supply caches, navigating ruined building crawlspaces, and assessing structural collapse risks.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Burglar / Second-Story Thief:</strong> Silent rooftop traversal, climbing drainage pipes, breaking and entering, and moving undetected.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Black Market Fixer:</strong> Bartering, assessing item value, finding contraband caches, and reading human intentions.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Street Brawler / Enforcer:</strong> Brutal blunt force melee, using heavy improvised weapons, shoving through crowds, and street toughness.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Stunt Driver / Courier:</strong> High-speed vehicle handling, navigating road blockades, and defensive vehicular maneuvering.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Underground Boxer / Martial Artist:</strong> Unarmed defensive parries, kinetic infighting, footwork, and close-quarters striking.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Investigative Journalist:</strong> Uncovering corporate paper trails, finding hidden audio logs/diaries, and piecing together facility lore.</p>\n<p class=\"term-ol-item\">\u2022 <strong>City Transit Conductor / Rail Worker:</strong> Navigating subterranean subway tunnels, switching rail tracks, and operating heavy train engines.</p>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">2. MINOR TRAITS (+1 BONUS)</h2>\n<p class=\"term-p\"><em>Choose 1 at character creation. Represents specific habits, tactical techniques, or secondary background perks.</em></p>\n<h3 class=\"term-h3\">Combat & Physical</h3>\n<p class=\"term-ol-item\">\u2022 <strong>Steady Aim:</strong> +1 to firearm accuracy when bracing against cover or spending a Minor Action to aim.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Quick Draw:</strong> +1 when reacting to sudden ambushes or drawing weapons in close quarters.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Double Tap:</strong> +1 to follow-up handgun shots on a target that was just hit.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Heavy Swinger:</strong> +1 to Force rolls when using two-handed blunt weapons (fireaxe, sledgehammer).</p>\n<p class=\"term-ol-item\">\u2022 <strong>Knife Fighter:</strong> +1 when using combat knives or blades in close-quarters defense.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Point Blank Reflex:</strong> +1 to shotgun blasts against targets within Melee reach.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Iron Grip:</strong> +1 when resisting being disarmed or holding a barricade shut against a mob.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Fleet Footed:</strong> +1 to sprint speed and leaping across rooftops or broken stairwells.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Hard Hitter:</strong> +1 to unarmed shoves and kicks against charging shamblers.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Suppressive Instinct:</strong> +1 to suppressive rifle fire keeping hostiles pinned.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Gunslinger Rhythm:</strong> +1 to reloading firearms under direct combat pressure.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Center-Mass Focus:</strong> +1 to handgun stopping power against exposed zombie chests.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Pivot Footwork:</strong> +1 to Finesse evasion rolls when cornered against a dead end.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Crowbar Leverage:</strong> +1 to Force rolls when using crowbars as bludgeons or prying tools.</p>\n<h3 class=\"term-h3\">Stealth & Awareness</h3>\n<p class=\"term-ol-item\">\u2022 <strong>Silent Step:</strong> +1 to stealth rolls moving through glass, debris, or cluttered hallways.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Light Sleeper:</strong> +1 to passive awareness while resting; impossible to catch completely unprepared.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Sixth Sense:</strong> +1 to spotting hidden ambushers (Lickers on ceilings, corpses playing dead).</p>\n<p class=\"term-ol-item\">\u2022 <strong>Shadow Walker:</strong> +1 when using darkness and visual cover to bypass infected lines of sight.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Threat Recognition:</strong> +1 to assessing how dangerous an unfamiliar mutation is before engaging.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Echo Locator:</strong> +1 to tracking sounds through walls, ventilation ducts, and floorboards.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Vigilant Sentry:</strong> +1 to Focus checks when holding an overwatch angle during team rests.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Bloodhound Instinct:</strong> +1 to tracking blood trails or detecting chemical leakage scents.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Peripheral Vision:</strong> +1 to avoiding surprise flanks by crawling infected or K-9s.</p>\n<h3 class=\"term-h3\">Medical & Resilience</h3>\n<p class=\"term-ol-item\">\u2022 <strong>Field Chemist:</strong> +1 when synthesizing herbal sprays or chemical mixtures.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Tourniquet Specialist:</strong> +1 when rapidly treating the Bleeding condition.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Iron Stomach:</strong> +1 to resisting illness from stale rations and unpurified water.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Cold-Blooded:</strong> +1 to Focus checks
