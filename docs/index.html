Agility, precision marksmanship, sprinting, lockpicking, silent movement.</li>\n<li><strong>FOCUS:</strong> Awareness, diagnosing infection, searching rooms, mental composure under horror.</li>\n</ul>\n<h3 class=\"term-h3\">B. Survivor Traits</h3>\n<ul class=\"term-ul\">\n<li><strong>1 Major Trait (+2 Bonus):</strong> Your pre-collapse profession or primary archetype (e.g., S.T.A.R.S. Operative, Beat Cop, Trauma Surgeon, Combat Engineer, Wasteland Hunter).</li>\n<li><strong>1 Minor Trait (+1 Bonus):</strong> A specific habit, combat reflex, or survival perk (e.g., Steady Aim, Quick Draw, Silent Step, Tourniquet Specialist, Pack Optimizer).</li>\n</ul>\n<h3 class=\"term-h3\">C. Vitals & Starting Capacity</h3>\n<ul class=\"term-ul\">\n<li><strong>Strain (Max 10):</strong> Begins at <strong>4 Strain</strong>. Strain represents shock, stamina, blood loss, and will to survive.</li>\n<li><strong>Armor Boxes:</strong> Begins at <strong>0 Armor Boxes</strong>. Armor is gained only by finding and equipping protective gear.</li>\n<li><strong>Inventory Capacity:</strong> Strictly <strong>4 Inventory Slots</strong>.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">3. SURVIVAL ACTION ECONOMY & SCENES</h2>\n<h3 class=\"term-h3\">Action Economy (Per Post Turn)</h3>\n<p class=\"term-p\">Each survivor post during an active scene allows:</p>\n<ul class=\"term-ul\">\n<li><strong>1 Major Action:</strong> Attack/Shoot, Sprint/Zone Move, Apply Full Medical Treatment (G+R, Spray), Breach/Force a door, Reload an empty firearm, or Clear a jammed weapon.</li>\n<li><strong>1 Minor Action:</strong> Ingest a single herb (G or B), Draw/Holster a weapon, Trade an item with an adjacent ally, Latch/Unlock a door, or Brace/Take Cover (+1 to next shot/defense).</li>\n<li><strong>Free Actions:</strong> Dropping carried items, brief radio/tactical speech, or defensive knife grab counters.</li>\n</ul>\n<h3 class=\"term-h3\">Scene Framework</h3>\n<ul class=\"term-ul\">\n<li><strong>Exploration Scene:</strong> Searching rooms, investigating lore, and solving environmental puzzles. The Noise Clock only advances on loud actions.</li>\n<li><strong>Combat Scene (Side-Initiative):</strong> GM declares incoming enemy threats $\\rightarrow$ all players post Major + Minor actions within the 24h window $\\rightarrow$ GM resolves all outcomes simultaneously.</li>\n<li><strong>Safe Room (Rest Scene):</strong> Fortified sanctuary. Immune to the Noise Clock. Free 4-slot inventory & Item Box management, medical treatments, and Typewriter checkpoint logs.</li>\n<li><strong>Sector Transition:</strong> Moving to a new zone without active pursuit reduces the Noise Clock by -1.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">4. DAMAGE, INJURIES & INFECTION</h2>\n<h3 class=\"term-h3\">Taking Harm</h3>\n<p class=\"term-ol-item\">\u2022 <strong>Armor Soaks First:</strong> If you wear armor, mark 1 Armor Box (\u2b1c) to negate 1 instance of physical damage. When all boxes are marked, the armor is ruined.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Strain Loss:</strong> Unmitigated hits mark 1 Strain.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Downed / Bleeding Out:</strong> When you reach <strong>0 Strain & 0 Armor</strong>, you collapse. Allies have 1 full 24-hour round to apply a medical item. If hit again or left untreated, your survivor dies.</p>\n<h3 class=\"term-h3\">Standard Conditions</h3>\n<ul class=\"term-ul\">\n<li><strong>Bleeding:</strong> Lose 1 Strain at the end of each combat scene until treated. Cured by Green Herb mixtures or First Aid Spray.</li>\n<li><strong>Poisoned:</strong> Lose 1 Strain whenever you take a physical action. Cured by Blue Herb mixtures or First Aid Spray.</li>\n<li><strong>Limb Damaged:</strong> Leg (-2 Finesse, cannot sprint) or Arm (-2 Force, cannot wield 2-handed weapons). Cured by Full-Heal (G+R) or First Aid Spray.</li>\n<li><strong>Panicked:</strong> Cannot spend Strain on Specializations. Cured by reaching a Safe Room or an ally passing a Focus TN 10 check.</li>\n</ul>\n<h3 class=\"term-h3\">Virus Infection Track (0 to 5)</h3>\n<p class=\"term-p\">Zombie bites and biological critical failures advance the track by +1 Stage:</p>\n<ul class=\"term-ul\">\n<li><strong>Stage 0 (Clean):</strong> Healthy.</li>\n<li><strong>Stage 1 (Exposed):</strong> Low fever.</li>\n<li><strong>Stage 2 (Tremors):</strong> -1 to Focus rolls.</li>\n<li><strong>Stage 3 (Cellular Breakdown):</strong> Max Strain capped at 6; -1 to all rolls.</li>\n<li><strong>Stage 4 (Terminal Agony):</strong> Max Strain capped at 3; cannot sprint.</li>\n<li><strong>Stage 5 (Transformation):</strong> Death. The survivor turns into a hostile B.O.W.</li>\n</ul>\n<p class=\"term-p\"><em>(Infection can be reduced by -1 Stage using Blue Herb combinations, or stalled for 24h with Antiviral Serums).</em></p>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">5. GEAR & NOISE</h2>\n<h3 class=\"term-h3\">Weapons & Durability</h3>\n<ul class=\"term-ul\">\n<li><strong>Handgun (1 Slot):</strong> 15-round mag. +1 Noise per shot. Nat 1 jams the gun (1 Major Action to clear).</li>\n<li><strong>Shotgun (2 Slots):</strong> 6 shells. +2 Noise per shot. Close-range stagger / spread.</li>\n<li><strong>Tactical Rifle (2 Slots):</strong> 5 rounds. +2 Noise per shot. Extreme range armor penetration.</li>\n<li><strong>Combat Knife (1 Slot, \u2b1c\u2b1c\u2b1c 3 Durability):</strong> Close defense & grab counters. Breaks permanently when all 3 boxes are marked (no repairs).</li>\n<li><strong>Heavy Tools (2 Slots, \u2b1c\u2b1c\u2b1c 3 Durability):</strong> Fireaxe, Crowbar. +1 to Force breaching rolls.</li>\n</ul>\n<h3 class=\"term-h3\">Medical Items</h3>\n<ul class=\"term-ul\">\n<li><strong>Green Herb (G, 1/4 Slot):</strong> Restores 1 Strain, cures Bleeding.</li>\n<li><strong>Green + Green (G+G, 1/4 Slot):</strong> Restores 3 Strain, cures Bleeding.</li>\n<li><strong>Green + Blue (G+B, 1/4 Slot):</strong> Restores 1 Strain, cures Bleeding & Poisoned, reduces Infection by -1 Stage.</li>\n<li><strong>Green + Red (G+R, 1/4 Slot):</strong> Full Strain recovery, cures Bleeding & Limb Damaged.</li>\n<li><strong>Green + Red + Blue (G+R+B, 1/4 Slot):</strong> Full Strain recovery, cures all conditions, reduces Infection by -1 Stage.</li>\n<li><strong>First Aid Spray (1 Slot):</strong> Full Strain recovery, cures all physical conditions.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">6. SURVIVOR DOSSIER TEMPLATE</h2>\n<p class=\"term-p\">Identity</p>\n<p class=\"term-p\">Name: ____________    Callsign / Profession: ____________</p>\n<p class=\"term-p\">Stats (3 Points Allocated)</p>\n<p class=\"term-p\">Force: +__    Finesse: +__    Focus: +__</p>\n<p class=\"term-p\">Traits & Abilities</p>\n<p class=\"term-p\">Major Trait (+2): ________________________</p>\n<p class=\"term-p\">Minor Trait (+1): ________________________</p>\n<p class=\"term-p\">Tactical Specialization: __________________</p>\n<p class=\"term-p\">Vitals & Status</p>\n<p class=\"term-p\">Strain: [ ][ ][ ][ ] /4 (Max 10)</p>\n<p class=\"term-p\">Armor: \u2b1c / 0 Boxes</p>\n<p class=\"term-p\">Infection Track: [0] Clean (0/5)</p>\n<p class=\"term-p\">Active Conditions: None</p>\n<p class=\"term-p\">Inventory (Strict 4 Slots)</p>\n<p class=\"term-ol-item\">\u2022 [Handgun - 15/15 rds (1 Slot)]</p>\n<p class=\"term-ol-item\">\u2022 [Combat Knife - \u2b1c\u2b1c\u2b1c (1 Slot)]</p>\n<p class=\"term-ol-item\">\u2022 [9mm Ammo Box - 15 rds (1/4 Slot) / Empty]</p>\n<p class=\"term-ol-item\">\u2022 [Empty Slot]</p>"}, "traits": {"title": "Traits & Specializations", "icon": "\ud83e\uddec", "content": "# VBG-Z: SURVIVOR TRAITS & SPECIALIZATIONS COMPENDIUM\n\n> **Note on Customization:** These lists are samples and baselines to inspire character creation. They are **not** strictly limited to what is written here. You are encouraged to collaborate with the GM to create your own personalized Major Traits, Minor Traits, or Tactical Specializations that fit your survivor concept.\n\n---\n\n## 1. MAJOR TRAITS (+2 BONUS)\n*Choose 1 at character creation. Represents your pre-collapse profession, military role, or primary archetype.*\n\n### Tactical & Law Enforcement\n1. **S.T.A.R.S. / Special Forces Operative:** Room clearing, target acquisition, tactical firearm discipline, and weapon handling under pressure.\n2. **Beat Cop / Law Enforcement:** Street smarts, standard police issue firearms, crowd control, and assessing suspicious behavior.\n3. **Umbrella Security Service (U.S.S.) Cleaner:** Cold efficiency in bio-containment zones, hazard handling, hazmat protocols, and tactical maneuvering.\n4. **Private Military Contractor (PMC):** Heavy weaponry, suppressive fire, defensive positioning, and combat communications.\n5. **Close Protection Bodyguard:** Defensive reactions, intercepting incoming strikes meant for allies, and escort movement.\n6. **SWAT Breacher:** Shotgun breaching, clearing tight doorways, riot shield tactics, and heavy threshold control.\n7. **Sniper / Recon Scout:** Long-range rifle marksmanship, overwatch spotting, range estimation, and silent camouflage.\n\n### Medical & Science\n8. **Trauma Surgeon / ER Doctor:** Precision surgical procedures, stabilizing arterial bleeds, setting compound fractures, and managing medical tools.\n9. **Paramedic / First Responder:** Rapid triage under chaos, CPR, field dressing, and carrying incapacitated casualties.\n10. **Virologist / Bio-Researcher:** Identifying B.O.W. behavioral traits, understanding viral transmission vectors, and lab chemical synthesis.\n11. **Pharmaceutical Chemist:** Formulating chemical reagents, synthesizing herbal compounds, and identifying toxins/antidotes.\n12. **Forensic Pathologist:** Autopsy assessment, diagnosing infection cause/stage, and identifying anatomical weak points on mutated corpses.\n13. **Combat Medic / Corpsman:** Patching bullet and bite wounds under live hostile fire, dragging wounded allies, and conserving medical supplies.\n14. **Toxicologist:** Analyzing venom/spit compounds (Licker/Drain Deimos), synthesizing custom antidotes, and hazardous fluid handling.\n\n### Engineering & Technical\n15. **Combat Engineer / Sapper:** Fortifying structures, setting defensive barricades, door breaching, and structural integrity assessment.\n16. **Master Mechanic:** Hotwiring vehicles, repairing combustion engines, generator maintenance, and jury-rigging mechanical parts.\n17. **Industrial Electrician:** Rewiring substation panels, bypassing electronic keycard locks, and handling high-voltage hazards.\n18. **Demolitions Specialist:** Safe handling of explosive ordnance, creating pipe bombs, and controlled structural demolition.\n19. **Locksmith / Security Technician:** Bypassing mechanical locks, vault doors, security tumblers, and alarm systems quietly.\n20. **Civil / Structural Engineer:** Reading facility architectural blueprints, identifying load-bearing weak points, and flood/ventilation routing.\n21. **Radio Operator / Comms Technician:** Repairing military radio transmitters, intercepting broadcast frequencies, and signal triangulation.\n\n### Survivalist & Wilderness\n22. **Wasteland Hunter / Tracker:** Stalking prey silently, tracking infected spoor, setting snare traps, and long-range marksmanship.\n23. **Wilderness Survival Guide:** Foraging medicinal herbs, navigating unmapped terrain, fire starting, and shelter construction.\n24. **Park Ranger / Forester:** Broad wilderness survival, heavy terrain traversal, axe/machete handling, and weather assessment.\n25. **Deep Woods Outfitter:** Resource budgeting, pack optimization, and heavy load carrying over long distances.\n26. **Extreme Outdoorsman / Mountaineer:** Rappelling, climbing broken facades, cold-weather endurance, and navigating jagged debris.\n27. **Archery Instructor / Bowhunter:** Silent projectile retrieval, bow handling, silent target elimination, and crafting improvised arrows.\n\n### Urban & Underworld\n28. **Urban Scavenger:** Spotting hidden supply caches, navigating ruined building crawlspaces, and assessing structural collapse risks.\n29. **Burglar / Second-Story Thief:** Silent rooftop traversal, climbing drainage pipes, breaking and entering, and moving undetected.\n30. **Black Market Fixer:** Bartering, assessing item value, finding contraband caches, and reading human intentions.\n31. **Street Brawler / Enforcer:** Brutal blunt force melee, using heavy improvised weapons, shoving through crowds, and street toughness.\n32. **Stunt Driver / Courier:** High-speed vehicle handling, navigating road blockades, and defensive vehicular maneuvering.\n33. **Underground Boxer / Martial Artist:** Unarmed defensive parries, kinetic infighting, footwork, and close-quarters striking.\n34. **Investigative Journalist:** Uncovering corporate paper trails, finding hidden audio logs/diaries, and piecing together facility lore.\n35. **City Transit Conductor / Rail Worker:** Navigating subterranean subway tunnels, switching rail tracks, and operating heavy train engines.\n\n---\n\n## 2. MINOR TRAITS (+1 BONUS)\n*Choose 1 at character creation. Represents specific habits, tactical techniques, or secondary background perks.*\n\n### Combat & Physical\n1. **Steady Aim:** +1 to firearm accuracy when bracing against cover or spending a Minor Action to aim.\n2. **Quick Draw:** +1 when reacting to sudden ambushes or drawing weapons in close quarters.\n3. **Double Tap:** +1 to follow-up handgun shots on a target that was just hit.\n4. **Heavy Swinger:** +1 to Force rolls when using two-handed blunt weapons (fireaxe, sledgehammer).\n5. **Knife Fighter:** +1 when using combat knives or blades in close-quarters defense.\n6. **Point Blank Reflex:** +1 to shotgun blasts against targets within Melee reach.\n7. **Iron Grip:** +1 when resisting being disarmed or holding a barricade shut against a mob.\n8. **Fleet Footed:** +1 to sprint speed and leaping across rooftops or broken stairwells.\n9. **Hard Hitter:** +1 to unarmed shoves and kicks against charging shamblers.\n10. **Suppressive Instinct:** +1 to suppressive rifle fire keeping hostiles pinned.\n11. **Gunslinger Rhythm:** +1 to reloading firearms under direct combat pressure.\n12. **Center-Mass Focus:** +1 to handgun stopping power against exposed zombie chests.\n13. **Pivot Footwork:** +1 to Finesse evasion rolls when cornered against a dead end.\n14. **Crowbar Leverage:** +1 to Force rolls when using crowbars as bludgeons or prying tools.\n\n### Stealth & Awareness\n15. **Silent Step:** +1 to stealth rolls moving through glass, debris, or cluttered hallways.\n16. **Light Sleeper:** +1 to passive awareness while resting; impossible to catch completely unprepared.\n17. **Sixth Sense:** +1 to spotting hidden ambushers (Lickers on ceilings, corpses playing dead).\n18. **Shadow Walker:** +1 when using darkness and visual cover to bypass infected lines of sight.\n19. **Threat Recognition:** +1 to assessing how dangerous an unfamiliar mutation is before engaging.\n20. **Echo Locator:** +1 to tracking sounds through walls, ventilation ducts, and floorboards.\n21. **Vigilant Sentry:** +1 to Focus checks when holding an overwatch angle during team rests.\n22. **Bloodhound Instinct:** +1 to tracking blood trails or detecting chemical leakage scents.\n23. **Peripheral Vision:** +1 to avoiding surprise flanks by crawling infected or K-9s.\n\n### Medical & Resilience\n24. **Field Chemist:** +1 when synthesizing herbal sprays or chemical mixtures.\n25. **Tourniquet Specialist:** +1 when rapidly treating the Bleeding condition.\n26. **Iron Stomach:** +1 to resisting illness from stale rations and unpurified water.\n27. **Cold-Blooded:** +1 to Focus checks when resisting horror jump-scares, gore shock, and panic.\n28. **Pain Tolerance:** +1 to remaining functional while carrying traumatic conditions.\n29. **Adrenaline Spike:** +1 to your next action roll immediately after soaking a hit.\n30. **Steady Hands:** +1 to Focus rolls when performing delicate medical surgery or bomb defusal under fire.\n31. **Second Wind:** +1 to Force checks when at 1 Strain remaining to avoid collapsing.\n32. **Biological Resistance:** +1 to resisting viral advancement on initial exposure rolls.\n\n### Technical & Scavenging\n33. **Scrap Gunsmith:** +1 to clearing firearm jams and inspecting weapon quality.\n34. **Hoarder's Eye:** +1 to finding concealed ammo boxes or hidden key items in ransacked rooms.\n35. **Jury-Rigger:** +1 to making temporary field repairs on broken tools or barricades.\n36. **Lockpick Finesse:** +1 when picking mechanical tumbler locks with hairpin tools.\n37. **Hotwire Touch:** +1 when starting vehicles or powering generators without the original keys.\n38. **Pack Optimizer:** +1 when organizing gear (allows stacking 1 extra small item per slot).\n39. **Blueprint Reader:** +1 to navigating unfamiliar facilities using discovered building maps.\n40. **Electronic Bypass:** +1 to rerouting circuit breaker panels and security consoles.\n41. **Keyring Intuition:** +1 to identifying which door a discovered key or crest belongs to.\n42. **Resource Scrimper:** +1 to Focus checks when rationing supplies during extended sieges.\n\n---\n\n## 3. TACTICAL SPECIALIZATIONS (DOMAINS)\n*Choose 1 Specialization Domain. Abilities cost Strain to perform exceptional tactical feats (Capped at 0\u20132 Strain).*\n\n### 1. Close-Quarters Defense (CQC)\n* **Minor (0 Strain):** *Defensive Shove* \u2014 A swift physical push or kick that staggers 1 basic shambler back into Close range.\n* **Standard (1 Strain):** *Knife Counter* \u2014 Instantly parry an incoming grab with a combat blade, negating the hit without marking a knife durability box.\n* **Major (2 Strain):** *Crowd Cleave / Sweep* \u2014 A sweeping heavy strike or tackle that knocks down 2\u20133 clustered enemies, creating an immediate escape path.\n\n### 2. Precision Marksmanship\n* **Minor (0 Strain):** *Aimed Double-Tap* \u2014 Spend a Minor action to brace; your next handgun shot deals maximum stopping power.\n* **Standard (1 Strain):** *Called Shot (Weak Point)* \u2014 Target a designated anatomical weak spot (exposed brain, knee joint), bypassing 1 enemy Armor box on success.\n* **Major (2 Strain):** *Deadeye Penetration* \u2014 Fire a piercing high-caliber shot that lines up and hits two enemies in a row or severs an environmental support cable.\n\n### 3. Field Medicine & Triage\n* **Minor (0 Strain):** *Rapid Diagnostic* \u2014 Instantly identify an ally\u2019s exact Infection Stage, internal fractures, or wound severity with a glance.\n* **Standard (1 Strain):** *Combat Suture* \u2014 Clear the **Bleeding** condition from yourself or an adjacent ally in a single action without consuming an herb.\n* **Major (2 Strain):** *Emergency Adrenaline* \u2014 Administer an emergency adrenaline jolt to a Downed ally, stabilizing them to 1 Strain immediately.\n\n### 4. Structural Fortification & Traps\n* **Minor (0 Strain):** *Door Wedge* \u2014 Jam a wooden door shut or identify the weakest reinforcement point in a room.\n* **Standard (1 Strain):** *Reinforced Barricade* \u2014 Fasten boards and heavy furniture across a threshold; the barricade soaks 2 enemy hits before breaking.\n* **Major (2 Strain):** *Environmental Deadfall* \u2014 Trigger a pre-rigged heavy deadfall, electrical wire puddle, or gas cylinder trap to engulf a doorway.\n\n### 5. Infiltration & Evasion\n* **Minor (0 Strain):** *Ghost Step* \u2014 Cross an open corridor or doorway without alerting wandering shamblers.\n* **Standard (1 Strain):** *Combat Roll / Dive* \u2014 Execute an evasive dive to completely dodge an incoming lunging strike, Licker tongue, or pounce.\n* **Major (2 Strain):** *Smoke / Flash Escape* \u2014 Deploy an improvised flare, fire extinguisher fog, or flash to break line of sight, allowing the entire party to disengage.\n\n### 6. Bio-Chemical Warfare\n* **Minor (0 Strain):** *Strain Identification* \u2014 Identify the specific viral strain, mutation trigger, and behavioral flaw of a novel B.O.W.\n* **Standard (1 Strain):** *Volatile Mixture* \u2014 Synthesize a caustic acid vial or incendiary chemical flask from lab supplies in 1 action.\n* **Major (2 Strain):** *Viral Suppressant* \u2014 Synthesize an emergency chemical suppressant that halts an infected survivor\u2019s virus progression for 24 hours.\n\n### 7. Heavy Weapon Demolitions\n* **Minor (0 Strain):** *Blast Calculation* \u2014 Gauge the exact blast radius and structural impact of an explosive before detonation.\n* **Standard (1 Strain):** *Breaching Blast* \u2014 Direct a shotgun blast or explosive charge to instantly clear a barricaded doorway or staggered mob choke point.\n* **Major (2 Strain):** *Shockwave Stagger* \u2014 Detonate a heavy explosive or point-blank kinetic blast that forces a Boss-tier Stalker/Tyrant into a 1-Scene Stunned Stasis.\n\n### 8. Tactical Leadership & Overwatch\n* **Minor (0 Strain):** *Coordinated Callout* \u2014 Call out an enemy\u2019s flanking vector, granting an ally +1 to their next reaction roll.\n* **Standard (1 Strain):** *Rallying Composure* \u2014 Shout tactical commands to instantly clear the **Panicked** condition from an ally within room reach.\n* **Major (2 Strain):** *Covering Fire Protocol* \u2014 Lay down continuous suppressive fire that lets all allies move between zones without taking opportunity attacks.\n\n### 9. Pointman & Shield Bearer\n* **Minor (0 Strain):** *Shield Brace* \u2014 Raise a riot shield or heavy door; grants +1 Armor box against frontal attacks for the turn.\n* **Standard (1 Strain):** *Bodyguard Intercept* \u2014 Dive in front of an ally to take an incoming strike onto your own worn armor instead of them.\n* **Major (2 Strain):** *Bulldozer Charge* \u2014 Charge forward with a shield/heavy object, slamming through a zombie cluster and knocking enemies to the floor.\n\n### 10. Underground Logistics & Scrounging\n* **Minor (0 Strain):** *Cache Scent* \u2014 Sense hidden compartments behind loose brickwork, floorboards, or vending machines.\n* **Standard (1 Strain):** *Ammo Optimization* \u2014 Combine loose ammunition boxes to recover +3 extra rounds from spent casings and scrap.\n* **Major (2 Strain):** *Secret Passage Routing* \u2014 Locate a maintenance shaft, dumbwaiter, or drainage conduit that completely bypasses a locked or guarded corridor.\n", "html": "<h1 class=\"term-h1\">VBG-Z: SURVIVOR TRAITS & SPECIALIZATIONS COMPENDIUM</h1>\n<blockquote class=\"term-quote\"><strong>Note on Customization:</strong> These lists are samples and baselines to inspire character creation. They are <strong>not</strong> strictly limited to what is written here. You are encouraged to collaborate with the GM to create your own personalized Major Traits, Minor Traits, or Tactical Specializations that fit your survivor concept.</blockquote>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">1. MAJOR TRAITS (+2 BONUS)</h2>\n<p class=\"term-p\"><em>Choose 1 at character creation. Represents your pre-collapse profession, military role, or primary archetype.</em></p>\n<h3 class=\"term-h3\">Tactical & Law Enforcement</h3>\n<p class=\"term-ol-item\">\u2022 <strong>S.T.A.R.S. / Special Forces Operative:</strong> Room clearing, target acquisition, tactical firearm discipline, and weapon handling under pressure.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Beat Cop / Law Enforcement:</strong> Street smarts, standard police issue firearms, crowd control, and assessing suspicious behavior.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Umbrella Security Service (U.S.S.) Cleaner:</strong> Cold efficiency in bio-containment zones, hazard handling, hazmat protocols, and tactical maneuvering.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Private Military Contractor (PMC):</strong> Heavy weaponry, suppressive fire, defensive positioning, and combat communications.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Close Protection Bodyguard:</strong> Defensive reactions, intercepting incoming strikes meant for allies, and escort movement.</p>\n<p class=\"term-ol-item\">\u2022 <strong>SWAT Breacher:</strong> Shotgun breaching, clearing tight doorways, riot shield tactics, and heavy threshold control.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Sniper / Recon Scout:</strong> Long-range rifle marksmanship, overwatch spotting, range estimation, and silent camouflage.</p>\n<h3 class=\"term-h3\">Medical & Science</h3>\n<p class=\"term-ol-item\">\u2022 <strong>Trauma Surgeon / ER Doctor:</strong> Precision surgical procedures, stabilizing arterial bleeds, setting compound fractures, and managing medical tools.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Paramedic / First Responder:</strong> Rapid triage under chaos, CPR, field dressing, and carrying incapacitated casualties.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Virologist / Bio-Researcher:</strong> Identifying B.O.W. behavioral traits, understanding viral transmission vectors, and lab chemical synthesis.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Pharmaceutical Chemist:</strong> Formulating chemical reagents, synthesizing herbal compounds, and identifying toxins/antidotes.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Forensic Pathologist:</strong> Autopsy assessment, diagnosing infection cause/stage, and identifying anatomical weak points on mutated corpses.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Combat Medic / Corpsman:</strong> Patching bullet and bite wounds under live hostile fire, dragging wounded allies, and conserving medical supplies.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Toxicologist:</strong> Analyzing venom/spit compounds (Licker/Drain Deimos), synthesizing custom antidotes, and hazardous fluid handling.</p>\n<h3 class=\"term-h3\">Engineering & Technical</h3>\n<p class=\"term-ol-item\">\u2022 <strong>Combat Engineer / Sapper:</strong> Fortifying structures, setting defensive barricades, door breaching, and structural integrity assessment.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Master Mechanic:</strong> Hotwiring vehicles, repairing combustion engines, generator maintenance, and jury-rigging mechanical parts.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Industrial Electrician:</strong> Rewiring substation panels, bypassing electronic keycard locks, and handling high-voltage hazards.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Demolitions Specialist:</strong> Safe handling of explosive ordnance, creating pipe bombs, and controlled structural demolition.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Locksmith / Security Technician:</strong> Bypassing mechanical locks, vault doors, security tumblers, and alarm systems quietly.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Civil / Structural Engineer:</strong> Reading facility architectural blueprints, identifying load-bearing weak points, and flood/ventilation routing.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Radio Operator / Comms Technician:</strong> Repairing military radio transmitters, intercepting broadcast frequencies, and signal triangulation.</p>\n<h3 class=\"term-h3\">Survivalist & Wilderness</h3>\n<p class=\"term-ol-item\">\u2022 <strong>Wasteland Hunter / Tracker:</strong> Stalking prey silently, tracking infected spoor, setting snare traps, and long-range marksmanship.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Wilderness Survival Guide:</strong> Foraging medicinal herbs, navigating unmapped terrain, fire starting, and shelter construction.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Park Ranger / Forester:</strong> Broad wilderness survival, heavy terrain traversal, axe/machete handling, and weather assessment.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Deep Woods Outfitter:</strong> Resource budgeting, pack optimization, and heavy load carrying over long distances.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Extreme Outdoorsman / Mountaineer:</strong> Rappelling, climbing broken facades, cold-weather endurance, and navigating jagged debris.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Archery Instructor / Bowhunter:</strong> Silent projectile retrieval, bow handling, silent target elimination, and crafting improvised arrows.</p>\n<h3 class=\"term-h3\">Urban & Underworld</h3>\n<p class=\"term-ol-item\">\u2022 <strong>Urban Scavenger:</strong> Spotting hidden supply caches, navigating ruined building crawlspaces, and assessing structural collapse risks.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Burglar / Second-Story Thief:</strong> Silent rooftop traversal, climbing drainage pipes, breaking and entering, and moving undetected.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Black Market Fixer:</strong> Bartering, assessing item value, finding contraband caches, and reading human intentions.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Street Brawler / Enforcer:</strong> Brutal blunt force melee, using heavy improvised weapons, shoving through crowds, and street toughness.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Stunt Driver / Courier:</strong> High-speed vehicle handling, navigating road blockades, and defensive vehicular maneuvering.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Underground Boxer / Martial Artist:</strong> Unarmed defensive parries, kinetic infighting, footwork, and close-quarters striking.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Investigative Journalist:</strong> Uncovering corporate paper trails, finding hidden audio logs/diaries, and piecing together facility lore.</p>\n<p class=\"term-ol-item\">\u2022 <strong>City Transit Conductor / Rail Worker:</strong> Navigating subterranean subway tunnels, switching rail tracks, and operating heavy train engines.</p>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">2. MINOR TRAITS (+1 BONUS)</h2>\n<p class=\"term-p\"><em>Choose 1 at character creation. Represents specific habits, tactical techniques, or secondary background perks.</em></p>\n<h3 class=\"term-h3\">Combat & Physical</h3>\n<p class=\"term-ol-item\">\u2022 <strong>Steady Aim:</strong> +1 to firearm accuracy when bracing against cover or spending a Minor Action to aim.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Quick Draw:</strong> +1 when reacting to sudden ambushes or drawing weapons in close quarters.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Double Tap:</strong> +1 to follow-up handgun shots on a target that was just hit.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Heavy Swinger:</strong> +1 to Force rolls when using two-handed blunt weapons (fireaxe, sledgehammer).</p>\n<p class=\"term-ol-item\">\u2022 <strong>Knife Fighter:</strong> +1 when using combat knives or blades in close-quarters defense.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Point Blank Reflex:</strong> +1 to shotgun blasts against targets within Melee reach.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Iron Grip:</strong> +1 when resisting being disarmed or holding a barricade shut against a mob.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Fleet Footed:</strong> +1 to sprint speed and leaping across rooftops or broken stairwells.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Hard Hitter:</strong> +1 to unarmed shoves and kicks against charging shamblers.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Suppressive Instinct:</strong> +1 to suppressive rifle fire keeping hostiles pinned.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Gunslinger Rhythm:</strong> +1 to reloading firearms under direct combat pressure.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Center-Mass Focus:</strong> +1 to handgun stopping power against exposed zombie chests.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Pivot Footwork:</strong> +1 to Finesse evasion rolls when cornered against a dead end.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Crowbar Leverage:</strong> +1 to Force rolls when using crowbars as bludgeons or prying tools.</p>\n<h3 class=\"term-h3\">Stealth & Awareness</h3>\n<p class=\"term-ol-item\">\u2022 <strong>Silent Step:</strong> +1 to stealth rolls moving through glass, debris, or cluttered hallways.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Light Sleeper:</strong> +1 to passive awareness while resting; impossible to catch completely unprepared.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Sixth Sense:</strong> +1 to spotting hidden ambushers (Lickers on ceilings, corpses playing dead).</p>\n<p class=\"term-ol-item\">\u2022 <strong>Shadow Walker:</strong> +1 when using darkness and visual cover to bypass infected lines of sight.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Threat Recognition:</strong> +1 to assessing how dangerous an unfamiliar mutation is before engaging.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Echo Locator:</strong> +1 to tracking sounds through walls, ventilation ducts, and floorboards.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Vigilant Sentry:</strong> +1 to Focus checks when holding an overwatch angle during team rests.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Bloodhound Instinct:</strong> +1 to tracking blood trails or detecting chemical leakage scents.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Peripheral Vision:</strong> +1 to avoiding surprise flanks by crawling infected or K-9s.</p>\n<h3 class=\"term-h3\">Medical & Resilience</h3>\n<p class=\"term-ol-item\">\u2022 <strong>Field Chemist:</strong> +1 when synthesizing herbal sprays or chemical mixtures.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Tourniquet Specialist:</strong> +1 when rapidly treating the Bleeding condition.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Iron Stomach:</strong> +1 to resisting illness from stale rations and unpurified water.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Cold-Blooded:</strong> +1 to Focus checks when resisting horror jump-scares, gore shock, and panic.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Pain Tolerance:</strong> +1 to remaining functional while carrying traumatic conditions.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Adrenaline Spike:</strong> +1 to your next action roll immediately after soaking a hit.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Steady Hands:</strong> +1 to Focus rolls when performing delicate medical surgery or bomb defusal under fire.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Second Wind:</strong> +1 to Force checks when at 1 Strain remaining to avoid collapsing.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Biological Resistance:</strong> +1 to resisting viral advancement on initial exposure rolls.</p>\n<h3 class=\"term-h3\">Technical & Scavenging</h3>\n<p class=\"term-ol-item\">\u2022 <strong>Scrap Gunsmith:</strong> +1 to clearing firearm jams and inspecting weapon quality.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Hoarder's Eye:</strong> +1 to finding concealed ammo boxes or hidden key items in ransacked rooms.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Jury-Rigger:</strong> +1 to making temporary field repairs on broken tools or barricades.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Lockpick Finesse:</strong> +1 when picking mechanical tumbler locks with hairpin tools.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Hotwire Touch:</strong> +1 when starting vehicles or powering generators without the original keys.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Pack Optimizer:</strong> +1 when organizing gear (allows stacking 1 extra small item per slot).</p>\n<p class=\"term-ol-item\">\u2022 <strong>Blueprint Reader:</strong> +1 to navigating unfamiliar facilities using discovered building maps.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Electronic Bypass:</strong> +1 to rerouting circuit breaker panels and security consoles.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Keyring Intuition:</strong> +1 to identifying which door a discovered key or crest belongs to.</p>\n<p class=\"term-ol-item\">\u2022 <strong>Resource Scrimper:</strong> +1 to Focus checks when rationing supplies during extended sieges.</p>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">3. TACTICAL SPECIALIZATIONS (DOMAINS)</h2>\n<p class=\"term-p\"><em>Choose 1 Specialization Domain. Abilities cost Strain to perform exceptional tactical feats (Capped at 0\u20132 Strain).</em></p>\n<h3 class=\"term-h3\">1. Close-Quarters Defense (CQC)</h3>\n<ul class=\"term-ul\">\n<li><strong>Minor (0 Strain):</strong> <em>Defensive Shove</em> \u2014 A swift physical push or kick that staggers 1 basic shambler back into Close range.</li>\n<li><strong>Standard (1 Strain):</strong> <em>Knife Counter</em> \u2014 Instantly parry an incoming grab with a combat blade, negating the hit without marking a knife durability box.</li>\n<li><strong>Major (2 Strain):</strong> <em>Crowd Cleave / Sweep</em> \u2014 A sweeping heavy strike or tackle that knocks down 2\u20133 clustered enemies, creating an immediate escape path.</li>\n</ul>\n<h3 class=\"term-h3\">2. Precision Marksmanship</h3>\n<ul class=\"term-ul\">\n<li><strong>Minor (0 Strain):</strong> <em>Aimed Double-Tap</em> \u2014 Spend a Minor action to brace; your next handgun shot deals maximum stopping power.</li>\n<li><strong>Standard (1 Strain):</strong> <em>Called Shot (Weak Point)</em> \u2014 Target a designated anatomical weak spot (exposed brain, knee joint), bypassing 1 enemy Armor box on success.</li>\n<li><strong>Major (2 Strain):</strong> <em>Deadeye Penetration</em> \u2014 Fire a piercing high-caliber shot that lines up and hits two enemies in a row or severs an environmental support cable.</li>\n</ul>\n<h3 class=\"term-h3\">3. Field Medicine & Triage</h3>\n<ul class=\"term-ul\">\n<li><strong>Minor (0 Strain):</strong> <em>Rapid Diagnostic</em> \u2014 Instantly identify an ally\u2019s exact Infection Stage, internal fractures, or wound severity with a glance.</li>\n<li><strong>Standard (1 Strain):</strong> <em>Combat Suture</em> \u2014 Clear the <strong>Bleeding</strong> condition from yourself or an adjacent ally in a single action without consuming an herb.</li>\n<li><strong>Major (2 Strain):</strong> <em>Emergency Adrenaline</em> \u2014 Administer an emergency adrenaline jolt to a Downed ally, stabilizing them to 1 Strain immediately.</li>\n</ul>\n<h3 class=\"term-h3\">4. Structural Fortification & Traps</h3>\n<ul class=\"term-ul\">\n<li><strong>Minor (0 Strain):</strong> <em>Door Wedge</em> \u2014 Jam a wooden door shut or identify the weakest reinforcement point in a room.</li>\n<li><strong>Standard (1 Strain):</strong> <em>Reinforced Barricade</em> \u2014 Fasten boards and heavy furniture across a threshold; the barricade soaks 2 enemy hits before breaking.</li>\n<li><strong>Major (2 Strain):</strong> <em>Environmental Deadfall</em> \u2014 Trigger a pre-rigged heavy deadfall, electrical wire puddle, or gas cylinder trap to engulf a doorway.</li>\n</ul>\n<h3 class=\"term-h3\">5. Infiltration & Evasion</h3>\n<ul class=\"term-ul\">\n<li><strong>Minor (0 Strain):</strong> <em>Ghost Step</em> \u2014 Cross an open corridor or doorway without alerting wandering shamblers.</li>\n<li><strong>Standard (1 Strain):</strong> <em>Combat Roll / Dive</em> \u2014 Execute an evasive dive to completely dodge an incoming lunging strike, Licker tongue, or pounce.</li>\n<li><strong>Major (2 Strain):</strong> <em>Smoke / Flash Escape</em> \u2014 Deploy an improvised flare, fire extinguisher fog, or flash to break line of sight, allowing the entire party to disengage.</li>\n</ul>\n<h3 class=\"term-h3\">6. Bio-Chemical Warfare</h3>\n<ul class=\"term-ul\">\n<li><strong>Minor (0 Strain):</strong> <em>Strain Identification</em> \u2014 Identify the specific viral strain, mutation trigger, and behavioral flaw of a novel B.O.W.</li>\n<li><strong>Standard (1 Strain):</strong> <em>Volatile Mixture</em> \u2014 Synthesize a caustic acid vial or incendiary chemical flask from lab supplies in 1 action.</li>\n<li><strong>Major (2 Strain):</strong> <em>Viral Suppressant</em> \u2014 Synthesize an emergency chemical suppressant that halts an infected survivor\u2019s virus progression for 24 hours.</li>\n</ul>\n<h3 class=\"term-h3\">7. Heavy Weapon Demolitions</h3>\n<ul class=\"term-ul\">\n<li><strong>Minor (0 Strain):</strong> <em>Blast Calculation</em> \u2014 Gauge the exact blast radius and structural impact of an explosive before detonation.</li>\n<li><strong>Standard (1 Strain):</strong> <em>Breaching Blast</em> \u2014 Direct a shotgun blast or explosive charge to instantly clear a barricaded doorway or staggered mob choke point.</li>\n<li><strong>Major (2 Strain):</strong> <em>Shockwave Stagger</em> \u2014 Detonate a heavy explosive or point-blank kinetic blast that forces a Boss-tier Stalker/Tyrant into a 1-Scene Stunned Stasis.</li>\n</ul>\n<h3 class=\"term-h3\">8. Tactical Leadership & Overwatch</h3>\n<ul class=\"term-ul\">\n<li><strong>Minor (0 Strain):</strong> <em>Coordinated Callout</em> \u2014 Call out an enemy\u2019s flanking vector, granting an ally +1 to their next reaction roll.</li>\n<li><strong>Standard (1 Strain):</strong> <em>Rallying Composure</em> \u2014 Shout tactical commands to instantly clear the <strong>Panicked</strong> condition from an ally within room reach.</li>\n<li><strong>Major (2 Strain):</strong> <em>Covering Fire Protocol</em> \u2014 Lay down continuous suppressive fire that lets all allies move between zones without taking opportunity attacks.</li>\n</ul>\n<h3 class=\"term-h3\">9. Pointman & Shield Bearer</h3>\n<ul class=\"term-ul\">\n<li><strong>Minor (0 Strain):</strong> <em>Shield Brace</em> \u2014 Raise a riot shield or heavy door; grants +1 Armor box against frontal attacks for the turn.</li>\n<li><strong>Standard (1 Strain):</strong> <em>Bodyguard Intercept</em> \u2014 Dive in front of an ally to take an incoming strike onto your own worn armor instead of them.</li>\n<li><strong>Major (2 Strain):</strong> <em>Bulldozer Charge</em> \u2014 Charge forward with a shield/heavy object, slamming through a zombie cluster and knocking enemies to the floor.</li>\n</ul>\n<h3 class=\"term-h3\">10. Underground Logistics & Scrounging</h3>\n<ul class=\"term-ul\">\n<li><strong>Minor (0 Strain):</strong> <em>Cache Scent</em> \u2014 Sense hidden compartments behind loose brickwork, floorboards, or vending machines.</li>\n<li><strong>Standard (1 Strain):</strong> <em>Ammo Optimization</em> \u2014 Combine loose ammunition boxes to recover +3 extra rounds from spent casings and scrap.</li>\n<li><strong>Major (2 Strain):</strong> <em>Secret Passage Routing</em> \u2014 Locate a maintenance shaft, dumbwaiter, or drainage conduit that completely bypasses a locked or guarded corridor.</li>\n</ul>"}, "glossary": {"title": "Rules Glossary & Keywords", "icon": "\ud83d\udcd1", "content": "# VBG-Z: MASTER RULES GLOSSARY & KEYWORD SPECIFICATION\n*Comprehensive mechanical reference defining all core terms, conditions, equipment rules, and environment systems for VBG-Z (Very Basic RPG: Zombie Survival Edition).*\n\n---\n\n## 1. CORE ENGINE & RESOLUTION\n\n* **Resolution Roll:** `1d20 + Stat + Trait Bonus`.\n  * Players roll a single 20-sided die, add their relevant Stat (-1 to +2), and add an applicable Trait (+2 for Major, +1 for Minor).\n* **Stats:**\n  * **Force:** Physical power, melee strikes, breaking barriers, lifting/carrying, brute endurance.\n  * **Finesse:** Agility, precision marksmanship, stealth, lockpicking, speed, evasive dodging.\n  * **Focus:** Perception, medical triage, mental composure under horror, searching rooms, technical repair.\n* **Traits:**\n  * **Major Trait (+2):** Core pre-collapse profession/archetype (e.g., *Beat Cop*, *Trauma Surgeon*, *Combat Engineer*).\n  * **Minor Trait (+1):** Specific survival perk or technique (e.g., *Steady Aim*, *Silent Step*, *Field Chemist*).\n* **Target Difficulty (TN):**\n  * **TN 10 (Routine):** Low-stress actions with adequate time.\n  * **TN 15 (Risky):** Standard combat or actions under active hostile pressure.\n  * **TN 20 (Desperate):** Life-or-death survival maneuvers or escaping dangerous ambushes.\n  * **TN 25+ (Extreme):** Extraordinary feats against boss-tier B.O.W.s.\n* **Outcome Margins:**\n  * **Failure (Miss by 5+):** Action fails; suffer direct damage, advance Noise Clock, or trigger hazards.\n  * **Success with Cost (Miss by 1\u20134):** Goal achieved, but pay a price (take 1 Strain, lose weapon durability, or drop an item).\n  * **Clean Success (Beat by 0\u20135):** Goal achieved smoothly with no negative side effects.\n  * **Critical (Beat by 6+):** Perfect success; deal bonus stopping power, bypass armor, or regain 1 Strain.\n\n---\n\n## 2. ACTION ECONOMY & TURN STRUCTURE\n\nIn asynchronous Play-by-Post, each player turn consists of **1 Major Action** and **1 Minor Action** per post:\n\n### Major Actions (1 per turn)\n* **Attack / Shoot:** Fire a weapon or make a melee strike.\n* **Sprint / Reposition:** Move between zones (e.g., Near to Far, or dashing through a doorway).\n* **Full Medical Treatment:** Apply a First Aid Spray or Green+Red full-heal mix to yourself or an ally.\n* **Interact / Breach:** Force open a jammed door, hotwire a panel, or push a heavy obstacle.\n* **Reload Weapon:** Load an ammo box/magazine into an empty firearm.\n* **Clear Malfunction:** Rack the slide and clear a jammed firearm.\n\n### Minor Actions (1 per turn)\n* **Quick Ingest:** Consume a single Green or Blue herb mix.\n* **Draw / Holster Weapon:** Switch carried weapons.\n* **Trade Item:** Hand a carried item to an adjacent ally (within Close range).\n* **Interact / Latch:** Turn a doorknob, flip a light switch, or grab a loose keycard from a table.\n* **Take Cover / Brace:** Gain +1 to next ranged shot or defensive roll.\n\n### Free Actions (Anytime / 0 cost)\n* **Drop Carried Item:** Immediately drop gear to the floor to free up hands/slots.\n* **Speak / Signal:** Short tactical shout or radio call to allies.\n* **Defensive Grab Counter:** Expending 1 knife durability box or 1 handgun shot when grabbed to instantly break free.\n\n---\n\n## 3. SCENE FRAMEWORK & PACING\n\nPlay is structured into distinct **Scenes** rather than rigid rounds:\n\n### Exploration Scene\n* Low-intensity investigation, searching rooms, solving environmental puzzles, and navigating hallways.\n* Actions are relaxed; players can search, converse, and take time. The Noise Clock only advances on loud triggers.\n\n### Combat & Threat Scene\n* High-intensity encounters where the GM presents active hostile threats.\n* Runs on asynchronous **Side-Initiative**: The GM posts the environmental threat, all players post their Major + Minor actions within the 24-hour window, and the GM resolves all outcomes simultaneously.\n\n### Safe Room (Rest Scene)\n* A fortified sanctuary with zero hostile presence and absolute Noise Clock immunity.\n* Players can freely organize their 4-slot inventory and Item Box, apply medical treatments, calm the **Panicked** condition, and write Typewriter logbook entries for progression milestones.\n\n### Transition Scene\n* Moving between sectors, city districts, or facility floors. Successfully clearing a transition without pursuit reduces the Area Noise Clock by **-1 Tick**.\n\n---\n\n## 4. HEALTH & CONDITIONS\n\n* **Strain (0 to 10):** Base health and shock threshold (Survivors start at **4 Strain**).\n* **Downed / Bleeding Out:**\n  * Reaching **0 Strain & 0 Armor** causes immediate collapse/incapacitation.\n  * **24-Hour Post Window:** Allies have 1 post round to reach and stabilize the survivor with an herb or spray.\n  * **Lethality:** Taking any further hit or ending the scene unstabilized results in permanent death.\n\n### Standardized Active Conditions\n* **Bleeding:** Suffer 1 Strain at the end of each combat scene until treated. *Cured by:* Any Green Herb mix or First Aid Spray.\n* **Poisoned (Toxin):** Lose 1 Strain whenever you make a Force or Finesse roll. *Cured by:* Blue Herb mix or First Aid Spray.\n* **Limb Damaged (Leg or Arm):** \n  * *Leg:* -2 to Finesse movement; cannot sprint or flee.\n  * *Arm:* -2 to Force/attack rolls; cannot wield 2-handed weapons.\n  * *Cured by:* Full-Heal Mix (G+R) or First Aid Spray.\n* **Panicked:** Cannot spend Strain on Tactical Specializations. *Cured by:* Entering a Safe Room or ally Focus TN 10 check.\n\n---\n\n## 5. COMBAT ADJUDICATION & DISTANCE BANDS\n\nCombat is player-facing and structured around four intuitive **Distance & Reach Bands** to keep asynchronous posting fluid without requiring grid maps:\n\n### Distance & Reach Bands\n* **Melee / Reach (0\u20135 ft):** Within arm's reach or blade contact. Hand-to-hand combat, knife strikes, grab threats, and shotgun point-blank blasts occur here.\n  * *Disengaging:* Moving away from an actively engaged enemy in Melee reach requires a Major Action (Sprint) or an evasive stunt to avoid an immediate swipe or grab.\n* **Close / Room (5\u201320 ft):** Across an average room, small office, or narrow corridor. Moving into Melee reach or taking cover takes a Minor Action.\n  * *Firearms:* Optimal operating range for Handguns and Shotguns.\n* **Far / Hallway (20\u201360 ft):** Down a long hospital corridor, across a street block, or through a warehouse. Closing the distance requires a Major Action (Sprint).\n  * *Firearms:* Handguns suffer a **-2 penalty** unless the shooter spends a Minor Action to Brace/Aim. Tactical Rifles operate at peak accuracy.\n* **Distant / Line-of-Sight (60+ ft):** Across a city plaza, down a highway, or from a rooftop. Only Tactical Rifles and Scoped weapons can effectively engage targets at Distant range.\n\n### Combat Mechanics & Tactics\n* **Player-Facing Side-Initiative:** The GM describes incoming hostile actions. Players post their reactions (Major + Minor action) within the 24-hour window. Monsters never make attack rolls; players roll to avoid harm or disrupt enemy actions.\n* **Grab & Counter-Attack:** When grabbed by a zombie, a survivor can spend a Free Action to sacrifice **1 Knife Durability Box** or fire **1 Handgun shot** to instantly break the grab without taking damage.\n* **Called Shots & Weak Points:** Targeting a creature's specific anatomical weak point (exposed brain, knee joint) requires a **Called Shot (TN 20)**. Clean success bypasses 1 Armor Box or dismembers the limb.\n* **V-ACT Mutation (Crimson Heads):** Any intact zombie corpse left unburned or undecapitated will revive after 2 scenes as a fast, high-damage Crimson Head mutant.\n\n---\n\n## 6. VIRUS INFECTION ENGINE\n\n### Infection Track (Stage 0 to Stage 5)\n* **Stage 0 (Clean):** Healthy. No symptoms.\n* **Stage 1 (Exposed):** Minor fever, pale skin. Narrative tension only.\n* **Stage 2 (Incubation):** Sweats and tremors. **-1 to all Focus rolls**.\n* **Stage 3 (Cellular Breakdown):** Tissue necrosis, extreme thirst. Maximum Strain capped at **6**; **-1 to all rolls**.\n* **Stage 4 (Terminal Agony):** Heavy delirium, skin sloughing. Maximum Strain capped at **3**; cannot sprint.\n* **Stage 5 (Transformation):** Character dies and rises as an aggressive hostile B.O.W.\n\n### Infection Advancement Triggers\n* Suffering a bite attack from an infected enemy: **+1 Stage**.\n* Critical failure against biological bile/fluid hazards: **+1 Stage**.\n\n### Treatment & Stalling\n* **Blue Herb Mixtures (G+B, G+R+B):** Lower current infection by **-1 Stage** (can reduce all the way back to Stage 0 if caught early).\n* **Antiviral Serum:** Halts infection progression completely for 24 hours.\n\n---\n\n## 6. COMPLETE ITEMS & EQUIPMENT CATALOG\n\nEvery character begins with a strict base capacity of **4 Inventory Slots**.\n\n### A. WEAPONS CATALOG\n\n#### Firearms & Ranged Weapons\n* **Handgun / Pistol (1 Slot):**\n  * *Ammo Type & Storage:* 9mm Ammo Box (15 rounds = 1/4 Slot).\n  * *Noise Generated:* **+1 Tick** per shot.\n  * *Reliability:* Standard sidearm; effective at Close and Near ranges.\n* **Shotgun (2 Slots):**\n  * *Ammo Type & Storage:* 12-Gauge Shells Box (6 shells = 1/4 Slot).\n  * *Noise Generated:* **+2 Ticks** per shot.\n  * *Special Rule (Stopping Power):* Staggers charging enemies on Clean Success; hits up to 2 adjacent targets at Close range.\n* **Hunting / Tactical Rifle (2 Slots):**\n  * *Ammo Type & Storage:* Rifle Ammo Box (5 rounds = 1/4 Slot).\n  * *Noise Generated:* **+2 Ticks** per shot.\n  * *Special Rule (Penetration):* Extreme range marksmanship; bypasses 1 Armor box on Clean Success.\n* **Magnum Revolver (1 Slot):**\n  * *Ammo Type & Storage:* Magnum Ammo Box (6 rounds = 1/4 Slot). Rare.\n  * *Noise Generated:* **+3 Ticks** per shot.\n  * *Special Rule (Lethal Kinetic):* Bypasses mundane armor; inflicts critical damage on B.O.W. weak points.\n\n#### Firearm Malfunction & Reload Mechanics\n* **Firearm Jamming:** Rolling a **Natural 1** on a firearm attack causes a mechanical jam. The shot does not fire. Clearing the jam requires **1 Major Action** (or passing a Focus TN 10 check as a Minor Action).\n* **Reload Action Economy:** Firearms hold 1 internal magazine/cylinder. Loading fresh ammunition from a carried ammo box requires **1 Major Action**.\n\n#### Melee Weapons & Durability (\u2b1c\u2b1c\u2b1c)\n* **Combat Knife / Tactical Blade (1 Slot):** 3 Durability Boxes. Used for close-quarters fighting and instant grab counter-attacks.\n* **Fireaxe / Crowbar / Sledgehammer (2 Slots):** 3 Durability Boxes. Adds **+1 to Force rolls** when breaching reinforced doors or crushing armored skulls.\n* **Durability Loss:** 1 Durability Box is checked on an attack **Failure** or when chosen as the cost on a **Success with Cost**. When all 3 boxes are checked, the weapon breaks permanently and is discarded. Durability cannot be repaired; survivors must scavenge new weapons.\n\n---\n\n### B. ARMOR & PROTECTIVE GEAR\n\nArmor provides external protection boxes (\u2b1c). When taking damage, players check off 1 Armor box instead of losing Strain.\n\n* **Leather / Reinforced Jacket (1 Slot):** Grants **\u2b1c (1 Armor Box)**. Light protection against scratches and minor shrapnel.\n* **Ballistic / Kevlar Vest (1 Slot):** Grants **\u2b1c\u2b1c (2 Armor Boxes)**. Standard police/security vest designed to stop handgun fire and blunt impacts.\n* **Tactical Riot Armor (2 Slots):** Grants **\u2b1c\u2b1c\u2b1c (3 Armor Boxes)**. Heavy military/SWAT protective suit. *Drawback:* Applies **-1 to Finesse sprint/flee rolls**.\n\n---\n\n### C. HEALING & MEDICAL ITEMS\n\nAll medicinal herbs are compact items taking **1/4 Inventory Slot** (up to 4 herbs or mixes can stack in 1 slot). First Aid Sprays occupy **1 Full Slot**.\n\n* **Green Herb (G) [1/4 Slot]:** Restores **1 Strain**; cures **Bleeding**.\n* **Green + Green (G+G) [1/4 Slot]:** Restores **3 Strain**; cures **Bleeding**.\n* **Green + Blue (G+B) [1/4 Slot]:** Restores **1 Strain**, cures **Bleeding & Poisoned**, and lowers Virus Infection by **-1 Stage**.\n* **Green + Red (G+R) [Full-Heal, 1/4 Slot]:** Fully restores Strain to maximum (10); cures **Bleeding & Limb Damaged**.\n* **Green + Red + Blue (G+R+B) [Miracle Mix, 1/4 Slot]:** Fully restores Strain to maximum, cures **all conditions**, and lowers Virus Infection by **-1 Stage**.\n* **First Aid Spray [1 Full Slot]:** Fully restores Strain to maximum and cures **all physical conditions** (Bleeding, Poisoned, Limb Damaged).\n\n---\n\n## 7. THE AREA NOISE CLOCK ENGINE\n\nThe **Area Noise Clock (1 to 6 Ticks)** tracks ambient disturbance, gunfire echoes, and the heightened awareness of roaming infected and stalkers within the current sector.\n\n### Noise Increase Rules (How the Clock Ticks Up)\n* **+1 Tick:**\n  * Firing a **Handgun / Pistol** (9mm unsuppressed).\n  * Loud environmental actions (smashing open a wooden door, kicking over heavy metal shelving, setting off a car alarm).\n  * Suffering a **Failure** on a physical or stealth roll in an echoey area.\n* **+2 Ticks:**\n  * Firing a **Shotgun** (12-Gauge blast) or **Tactical Rifle**.\n  * Structural breaching (battering down a security gate or heavy metal door).\n* **+3 Ticks:**\n  * Firing a **Magnum Revolver**.\n  * Detonating a **Grenade**, fuel barrel, or explosive device.\n\n### Clock Escalation Milestones\n* **1\u20132 Ticks (Quiet / Dormant):** Ambient groans in the distance. Roaming hostiles remain dormant in their starting positions.\n* **3\u20134 Ticks (Suspicious / Stirring):** Infected begin shuffling toward the source of the sound; stealth checks suffer **-1**.\n* **5 Ticks (Alert / Encircling):** Hostiles actively bang on exterior windows, doors rattle, and retreat routes become contested.\n* **6 Ticks (BREACH EVENT):** The clock resets to 0, and an immediate high-threat encounter is triggered: a roaming horde floods the room, or the sector's **Stalker / Boss B.O.W.** breaches the entry point.\n\n### Noise Decay Rules (How the Clock Ticks Down)\n* **-1 Tick (Quiet Scene):** Completing **1 full Exploration Scene** without any unsuppressed gunfire, combat rolls, or loud physical actions reduces the clock by **-1 Tick**.\n* **-1 Tick (Sector Transition):** Successfully traversing from one major sector/building to another without active pursuit reduces the local clock by **-1 Tick**.\n* **Total Clock Reset (Safe Room Entry):** Entering and securing a certified **Safe Room** completely isolates the party; while inside, the Noise Clock does not advance.\n* **Post-Breach Reset:** Following the conclusion or escape from a **6/6 Breach Event**, the clock resets to **1 Tick (Quiet)** as the immediate local horde disperses.\n\n---\n\n## 8. ENVIRONMENT & PROGRESSION\n\n* **Item Box (Communal Cache):** Located inside Safe Rooms. Provides shared storage space. Depositing, withdrawing, or organizing items in an Item Box is a free action during a Rest Scene.\n* **Typewriter (Checkpoint Log):** Survivors record in-character log entries; marks the official save checkpoint and awards milestone PP.\n* **Progression Points (PP) Awards:**\n  * **+1 PP:** Surviving an intense combat or hazard scene.\n  * **+2 PP:** Recovering a vital story file, key sample, or solving an environmental puzzle.\n  * **+3 PP:** Securing a new Safe Room or concluding a major narrative chapter.\n* **PP Shop Upgrades:**\n  * **10 PP:** Increase one Stat by +1 (Cap: +2 max).\n  * **15 PP:** Acquire a new Minor Trait (+1).\n  * **20 PP:** Unlock a new Tactical Specialization domain.\n  * **25 PP:** Expand Inventory by +1 Slot (Pouches/Rig, Cap: 6 slots max).\n", "html": "<h1 class=\"term-h1\">VBG-Z: MASTER RULES GLOSSARY & KEYWORD SPECIFICATION</h1>\n<p class=\"term-p\"><em>Comprehensive mechanical reference defining all core terms, conditions, equipment rules, and environment systems for VBG-Z (Very Basic RPG: Zombie Survival Edition).</em></p>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">1. CORE ENGINE & RESOLUTION</h2>\n<ul class=\"term-ul\">\n<li><strong>Resolution Roll:</strong> <code>1d20 + Stat + Trait Bonus</code>.</li>\n<li>Players roll a single 20-sided die, add their relevant Stat (-1 to +2), and add an applicable Trait (+2 for Major, +1 for Minor).</li>\n<li><strong>Stats:</strong></li>\n<li><strong>Force:</strong> Physical power, melee strikes, breaking barriers, lifting/carrying, brute endurance.</li>\n<li><strong>Finesse:</strong> Agility, precision marksmanship, stealth, lockpicking, speed, evasive dodging.</li>\n<li><strong>Focus:</strong> Perception, medical triage, mental composure under horror, searching rooms, technical repair.</li>\n<li><strong>Traits:</strong></li>\n<li><strong>Major Trait (+2):</strong> Core pre-collapse profession/archetype (e.g., <em>Beat Cop</em>, <em>Trauma Surgeon</em>, <em>Combat Engineer</em>).</li>\n<li><strong>Minor Trait (+1):</strong> Specific survival perk or technique (e.g., <em>Steady Aim</em>, <em>Silent Step</em>, <em>Field Chemist</em>).</li>\n<li><strong>Target Difficulty (TN):</strong></li>\n<li><strong>TN 10 (Routine):</strong> Low-stress actions with adequate time.</li>\n<li><strong>TN 15 (Risky):</strong> Standard combat or actions under active hostile pressure.</li>\n<li><strong>TN 20 (Desperate):</strong> Life-or-death survival maneuvers or escaping dangerous ambushes.</li>\n<li><strong>TN 25+ (Extreme):</strong> Extraordinary feats against boss-tier B.O.W.s.</li>\n<li><strong>Outcome Margins:</strong></li>\n<li><strong>Failure (Miss by 5+):</strong> Action fails; suffer direct damage, advance Noise Clock, or trigger hazards.</li>\n<li><strong>Success with Cost (Miss by 1\u20134):</strong> Goal achieved, but pay a price (take 1 Strain, lose weapon durability, or drop an item).</li>\n<li><strong>Clean Success (Beat by 0\u20135):</strong> Goal achieved smoothly with no negative side effects.</li>\n<li><strong>Critical (Beat by 6+):</strong> Perfect success; deal bonus stopping power, bypass armor, or regain 1 Strain.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">2. ACTION ECONOMY & TURN STRUCTURE</h2>\n<p class=\"term-p\">In asynchronous Play-by-Post, each player turn consists of <strong>1 Major Action</strong> and <strong>1 Minor Action</strong> per post:</p>\n<h3 class=\"term-h3\">Major Actions (1 per turn)</h3>\n<ul class=\"term-ul\">\n<li><strong>Attack / Shoot:</strong> Fire a weapon or make a melee strike.</li>\n<li><strong>Sprint / Reposition:</strong> Move between zones (e.g., Near to Far, or dashing through a doorway).</li>\n<li><strong>Full Medical Treatment:</strong> Apply a First Aid Spray or Green+Red full-heal mix to yourself or an ally.</li>\n<li><strong>Interact / Breach:</strong> Force open a jammed door, hotwire a panel, or push a heavy obstacle.</li>\n<li><strong>Reload Weapon:</strong> Load an ammo box/magazine into an empty firearm.</li>\n<li><strong>Clear Malfunction:</strong> Rack the slide and clear a jammed firearm.</li>\n</ul>\n<h3 class=\"term-h3\">Minor Actions (1 per turn)</h3>\n<ul class=\"term-ul\">\n<li><strong>Quick Ingest:</strong> Consume a single Green or Blue herb mix.</li>\n<li><strong>Draw / Holster Weapon:</strong> Switch carried weapons.</li>\n<li><strong>Trade Item:</strong> Hand a carried item to an adjacent ally (within Close range).</li>\n<li><strong>Interact / Latch:</strong> Turn a doorknob, flip a light switch, or grab a loose keycard from a table.</li>\n<li><strong>Take Cover / Brace:</strong> Gain +1 to next ranged shot or defensive roll.</li>\n</ul>\n<h3 class=\"term-h3\">Free Actions (Anytime / 0 cost)</h3>\n<ul class=\"term-ul\">\n<li><strong>Drop Carried Item:</strong> Immediately drop gear to the floor to free up hands/slots.</li>\n<li><strong>Speak / Signal:</strong> Short tactical shout or radio call to allies.</li>\n<li><strong>Defensive Grab Counter:</strong> Expending 1 knife durability box or 1 handgun shot when grabbed to instantly break free.</li>\n</ul>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">3. SCENE FRAMEWORK & PACING</h2>\n<p class=\"term-p\">Play is structured into distinct <strong>Scenes</strong> rather than rigid rounds:</p>\n<h3 class=\"term-h3\">Exploration Scene</h3>\n<ul class=\"term-ul\">\n<li>Low-intensity investigation, searching rooms, solving environmental puzzles, and navigating hallways.</li>\n<li>Actions are relaxed; players can search, converse, and take time. The Noise Clock only advances on loud triggers.</li>\n</ul>\n<h3 class=\"term-h3\">Combat & Threat Scene</h3>\n<ul class=\"term-ul\">\n<li>High-intensity encounters where the GM presents active hostile threats.</li>\n<li>Runs on asynchronous <strong>Side-Initiative</strong>: The GM posts the environmental threat, all players post their Major + Minor actions within the 24-hour window, and the GM resolves all outcomes simultaneously.</li>\n</ul>\n<h3 class=\"term-h3\">Safe Room (Rest Scene)</h3>\n<ul class=\"term-ul\">\n<li>A fortified sanctuary with zero hostile presence and absolute Noise Clock immunity.</li>\n<li>Players can freely organize their 4-slot inventory and Item Box, apply medical treatments, calm the <strong>Panicked</strong> condition, and write Typewriter logbook entries for progression milestones.</li>\n</ul>\n<h3 class=\"term-h3\">Transition Scene</h3>\n<ul class=\"term-ul\">\n<l
