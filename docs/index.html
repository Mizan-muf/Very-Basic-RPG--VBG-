<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>BIOHAZARD — Raccoon City Tactical Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090c;
      --bg-surface: #0e1217;
      --bg-sidebar: #0a0d12;
      --border-color: #1f2937;
      --orange-bio: #ff5500;
      --cyan-tactical: #00e5ff;
      --text-main: #e2e8f0;
      --text-dim: #94a3b8;
      --font-mono: 'Share Tech Mono', monospace;
      --font-header: 'Rajdhani', sans-serif;
      --font-body: 'Inter', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 52px;
      background: #090c10;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 100;
    }
    .hud-left { display: flex; align-items: center; gap: 12px; }
    .biohazard-badge {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      background: var(--orange-bio);
      color: #000;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 2px;
    }
    .hud-title { font-family: var(--font-header); font-size: 1.15rem; font-weight: 700; color: #fff; }
    .hud-right { display: flex; align-items: center; gap: 10px; }
    .hud-btn {
      background: rgba(255,85,0,0.1);
      border: 1px solid var(--orange-bio);
      color: var(--orange-bio);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .app-body { display: flex; flex: 1; height: calc(100vh - 52px); position: relative; overflow: hidden; }
    aside {
      width: 280px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      gap: 6px;
      flex-shrink: 0;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 4px;
      color: var(--text-dim);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      background: none;
      border: none;
      text-align: left;
      font-family: var(--font-header);
      letter-spacing: 0.5px;
      transition: all 0.15s;
    }
    .nav-btn:hover { background: #141b24; color: #fff; }
    .nav-btn.active { background: rgba(255, 85, 0, 0.15); border-left: 3px solid var(--orange-bio); color: #fff; }
    main { flex: 1; height: 100%; position: relative; background: var(--bg-dark); overflow: hidden; }
    #map-view { width: 100%; height: 100%; position: absolute; top: 0; left: 0; overflow: hidden; cursor: grab; touch-action: none; display: flex; }
    #map-view:active { cursor: grabbing; }
    #map-wrapper { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
    #map-wrapper img { display: block; width: 3085px; height: 3858px; max-width: none; pointer-events: none; }
    #grid-svg { position: absolute; top: 0; left: 0; width: 3085px; height: 3858px; pointer-events: none; }
    .map-controls { position: absolute; top: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 80; }
    .ctrl-btn {
      background: rgba(14, 18, 23, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--orange-bio);
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 4px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ctrl-btn:hover { background: var(--orange-bio); color: #000; }
    #doc-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-surface);
      z-index: 40;
      overflow-y: auto;
      padding: 32px 48px;
      display: none;
    }
    .doc-container { max-width: 900px; margin: 0 auto; padding-bottom: 80px; }
    .term-h1 { font-family: var(--font-header); font-size: 2.2rem; color: #fff; margin: 0 0 16px 0; border-bottom: 2px solid var(--orange-bio); padding-bottom: 8px; }
    .term-h2 { font-family: var(--font-header); font-size: 1.5rem; color: var(--orange-bio); margin: 28px 0 12px 0; border-bottom: 1px solid #1f2937; padding-bottom: 6px; }
    .term-h3 { font-family: var(--font-header); font-size: 1.2rem; color: #38bdf8; margin: 20px 0 8px 0; }
    .term-h4 { font-family: var(--font-header); font-size: 1.05rem; color: #cbd5e1; margin: 16px 0 6px 0; }
    .term-p { color: #cbd5e1; font-size: 0.98rem; line-height: 1.7; margin-bottom: 12px; }
    .term-ul { padding-left: 24px; margin-bottom: 14px; color: #cbd5e1; }
    .term-ul li { margin-bottom: 6px; line-height: 1.6; }
    .term-ol-item { color: #cbd5e1; font-size: 0.95rem; line-height: 1.6; margin-bottom: 6px; padding-left: 12px; }
    .term-quote { border-left: 3px solid var(--orange-bio); background: rgba(255, 85, 0, 0.05); padding: 10px 16px; color: #e2e8f0; margin: 14px 0; font-style: italic; }
    .term-hr { border: 0; border-top: 1px solid var(--border-color); margin: 24px 0; }
    .table-wrap { overflow-x: auto; margin: 16px 0; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; border: 1px solid var(--border-color); }
    th { background: #141b24; color: var(--orange-bio); font-family: var(--font-mono); padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border-color); }
    td { padding: 9px 14px; border-bottom: 1px solid #1a222d; color: #cbd5e1; }
    .mobile-nav {
      display: none;
      height: 58px;
      background: #090c10;
      border-top: 1px solid var(--border-color);
      flex-shrink: 0;
      z-index: 100;
      justify-content: space-around;
      align-items: center;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .mob-nav-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.75rem;
      gap: 3px;
      cursor: pointer;
      font-family: var(--font-mono);
    }
    .mob-nav-btn.active { color: var(--orange-bio); }
    @media (max-width: 768px) {
      aside { display: none; }
      #doc-view { padding: 20px 16px; }
      .mobile-nav { display: flex; }
    }
  </style>
</head>
<body>
  <header>
    <div class="hud-left">
      <span class="biohazard-badge">☣ BIOHAZARD</span>
      <span class="hud-title">RACCOON CITY TERMINAL</span>
    </div>
    <div class="hud-right">
      <button class="hud-btn" id="grid-toggle-btn" onclick="toggleGrid()">GRID: ON</button>
    </div>
  </header>
  <div class="app-body">
    <aside>
      <button class="nav-btn active" id="btn-map" onclick="showMap()">🗺️ Tactical Map</button>
      <button class="nav-btn" id="btn-player" onclick="showDoc('player')">📖 Player Rulebook</button>
      <button class="nav-btn" id="btn-traits" onclick="showDoc('traits')">🧬 Traits & Abilities</button>
      <button class="nav-btn" id="btn-glossary" onclick="showDoc('glossary')">📑 Master Glossary</button>
    </aside>
    <main>
      <div id="map-view">
        <div id="map-wrapper">
          <img src="assets/raccoon_city_map.jpg" alt="Raccoon City Map" />
          <svg id="grid-svg" viewBox="0 0 3085 3858" preserveAspectRatio="none">
            <rect x="105" y="135" width="2879" height="3625" fill="none" stroke="#ff5500" stroke-width="3" />
            <g id="svg-grid-lines"></g>
          </svg>
        </div>
        <div class="map-controls">
          <button class="ctrl-btn" onclick="zoomIn()">➕</button>
          <button class="ctrl-btn" onclick="zoomOut()">➖</button>
          <button class="ctrl-btn" onclick="resetMap()">🔄</button>
        </div>
      </div>
      <div id="doc-view">
        <div class="doc-container" id="doc-content"></div>
      </div>
    </main>
  </div>
  <div class="mobile-nav">
    <button class="mob-nav-btn active" id="mob-map" onclick="showMap()"><span>🗺️</span><span>Map</span></button>
    <button class="mob-nav-btn" id="mob-player" onclick="showDoc('player')"><span>📖</span><span>Rules</span></button>
    <button class="mob-nav-btn" id="mob-traits" onclick="showDoc('traits')"><span>🧬</span><span>Traits</span></button>
    <button class="mob-nav-btn" id="mob-glossary" onclick="showDoc('glossary')"><span>📑</span><span>Glossary</span></button>
  </div>
  <script>
    const DOCS = {"player": {"title": "Player Rulebook", "icon": "\ud83d\udcd6", "content": "# VERY BASIC RPG: ZOMBIE SURVIVAL EDITION (VBG-Z) v2.0\n*A lightweight d20 ruleset for asynchronous Play-by-Post survival horror.*\n\n---\n\n## 1. THE CORE ENGINE\n\n### The Resolution Roll\nWhen your survivor takes a risky, uncertain, or contested action under pressure:\n\n**Roll:** `1d20 + relevant Stat bonus + applicable Trait bonus`\n\n1. **Stat Bonus:** Add Force, Finesse, or Focus (-1 to +2).\n2. **Trait Bonus:** Add **+2** for a relevant **Major Trait**, and **+1** for a relevant **Minor Trait** (max one of each per roll).\n3. **Compare to Target TN:**\n   * **TN 10 (Routine):** Low-stress action, basic survival task.\n   * **TN 15 (Risky):** Standard combat shot, evasion, prying a door under threat.\n   * **TN 20 (Desperate):** Life-or-death shot, jumping across a collapsed fire escape.\n   * **TN 25+ (Extreme):** Staggering a massive B.O.W., escaping a closing hydraulic blast door.\n\n### Result Tiers & Outcomes\n* **Failure (Miss by 5+):** You fail and suffer serious consequences (take 1 Strain or lose 1 Armor box, gain a Condition, alert enemies, or advance the Noise Clock).\n* **Success with Cost (Miss by 1\u20134):** You achieve your objective, but pay a price: mark 1 Strain or Armor box, lose 1 weapon Durability box, consume ammunition, or gain a Condition.\n* **Clean Success (Beat by 0\u20135):** You achieve your goal cleanly without penalty.\n* **Critical Success (Beat by 6+):** Perfect execution. You achieve your goal and gain an extra advantage: bonus damage, stagger an enemy, or lower the local Noise Clock by -1.\n\n---\n\n## 2. CHARACTER CREATION\n\n### A. Stats (Distribute 3 Points)\nAllocate 3 points across the three core stats (Max +2 at creation):\n* **FORCE:** Physical power, melee strikes, shoving, lifting debris, enduring trauma.\n* **FINESSE:** Agility, precision marksmanship, sprinting, lockpicking, silent movement.\n* **FOCUS:** Awareness, diagnosing infection, searching rooms, mental composure under horror.\n\n### B. Survivor Traits\n* **1 Major Trait (+2 Bonus):** Your pre-collapse profession or primary archetype (e.g., S.T.A.R.S. Operative, Beat Cop, Trauma Surgeon, Combat Engineer, Wasteland Hunter).\n* **1 Minor Trait (+1 Bonus):** A specific habit, combat reflex, or survival perk (e.g., Steady Aim, Quick Draw, Silent Step, Tourniquet Specialist, Pack Optimizer).\n\n### C. Vitals & Starting Capacity\n* **Strain (Max 10):** Begins at **4 Strain**. Strain represents shock, stamina, blood loss, and will to survive.\n* **Armor Boxes:** Begins at **0 Armor Boxes**. Armor is gained only by finding and equipping protective gear.\n* **Inventory Capacity:** Strictly **4 Inventory Slots**.\n\n---\n\n## 3. SURVIVAL ACTION ECONOMY & SCENES\n\n### Action Economy (Per Post Turn)\nEach survivor post during an active scene allows:\n* **1 Major Action:** Attack/Shoot, Sprint/Zone Move, Apply Full Medical Treatment (G+R, Spray), Breach/Force a door, Reload an empty firearm, or Clear a jammed weapon.\n* **1 Minor Action:** Ingest a single herb (G or B), Draw/Holster a weapon, Trade an item with an adjacent ally, Latch/Unlock a door, or Brace/Take Cover (+1 to next shot/defense).\n* **Free Actions:** Dropping carried items, brief radio/tactical speech, or defensive knife grab counters.\n\n### Scene Framework\n* **Exploration Scene:** Searching rooms, investigating lore, and solving environmental puzzles. The Noise Clock only advances on loud actions.\n* **Combat Scene (Side-Initiative):** GM declares incoming enemy threats $\\rightarrow$ all players post Major + Minor actions within the 24h window $\\rightarrow$ GM resolves all outcomes simultaneously.\n* **Safe Room (Rest Scene):** Fortified sanctuary. Immune to the Noise Clock. Free 4-slot inventory & Item Box management, medical treatments, and Typewriter checkpoint logs.\n* **Sector Transition:** Moving to a new zone without active pursuit reduces the Noise Clock by -1.\n\n---\n\n## 4. DAMAGE, INJURIES & INFECTION\n\n### Taking Harm\n1. **Armor Soaks First:** If you wear armor, mark 1 Armor Box (\u2b1c) to negate 1 instance of physical damage. When all boxes are marked, the armor is ruined.\n2. **Strain Loss:** Unmitigated hits mark 1 Strain.\n3. **Downed / Bleeding Out:** When you reach **0 Strain & 0 Armor**, you collapse. Allies have 1 full 24-hour round to apply a medical item. If hit again or left untreated, your survivor dies.\n\n### Standard Conditions\n* **Bleeding:** Lose 1 Strain at the end of each combat scene until treated. Cured by Green Herb mixtures or First Aid Spray.\n* **Poisoned:** Lose 1 Strain whenever you take a physical action. Cured by Blue Herb mixtures or First Aid Spray.\n* **Limb Damaged:** Leg (-2 Finesse, cannot sprint) or Arm (-2 Force, cannot wield 2-handed weapons). Cured by Full-Heal (G+R) or First Aid Spray.\n* **Panicked:** Cannot spend Strain on Specializations. Cured by reaching a Safe Room or an ally passing a Focus TN 10 check.\n\n### Virus Infection Track (0 to 5)\nZombie bites and biological critical failures advance the track by +1 Stage:\n* **Stage 0 (Clean):** Healthy.\n* **Stage 1 (Exposed):** Low fever.\n* **Stage 2 (Tremors):** -1 to Focus rolls.\n* **Stage 3 (Cellular Breakdown):** Max Strain capped at 6; -1 to all rolls.\n* **Stage 4 (Terminal Agony):** Max Strain capped at 3; cannot sprint.\n* **Stage 5 (Transformation):** Death. The survivor turns into a hostile B.O.W.\n*(Infection can be reduced by -1 Stage using Blue Herb combinations, or stalled for 24h with Antiviral Serums).*\n\n---\n\n## 5. GEAR & NOISE\n\n### Weapons & Durability\n* **Handgun (1 Slot):** 15-round mag. +1 Noise per shot. Nat 1 jams the gun (1 Major Action to clear).\n* **Shotgun (2 Slots):** 6 shells. +2 Noise per shot. Close-range stagger / spread.\n* **Tactical Rifle (2 Slots):** 5 rounds. +2 Noise per shot. Extreme range armor penetration.\n* **Combat Knife (1 Slot, \u2b1c\u2b1c\u2b1c 3 Durability):** Close defense & grab counters. Breaks permanently when all 3 boxes are marked (no repairs).\n* **Heavy Tools (2 Slots, \u2b1c\u2b1c\u2b1c 3 Durability):** Fireaxe, Crowbar. +1 to Force breaching rolls.\n\n### Medical Items\n* **Green Herb (G, 1/4 Slot):** Restores 1 Strain, cures Bleeding.\n* **Green + Green (G+G, 1/4 Slot):** Restores 3 Strain, cures Bleeding.\n* **Green + Blue (G+B, 1/4 Slot):** Restores 1 Strain, cures Bleeding & Poisoned, reduces Infection by -1 Stage.\n* **Green + Red (G+R, 1/4 Slot):** Full Strain recovery, cures Bleeding & Limb Damaged.\n* **Green + Red + Blue (G+R+B, 1/4 Slot):** Full Strain recovery, cures all conditions, reduces Infection by -1 Stage.\n* **First Aid Spray (1 Slot):** Full Strain recovery, cures all physical conditions.\n\n---\n\n## 6. SURVIVOR DOSSIER TEMPLATE\n\nIdentity\nName: ____________    Callsign / Profession: ____________\n\nStats (3 Points Allocated)\nForce: +__    Finesse: +__    Focus: +__\n\nTraits & Abilities\nMajor Trait (+2): ________________________\nMinor Trait (+1): ________________________\nTactical Specialization: __________________\n\nVitals & Status\nStrain: [ ][ ][ ][ ] /4 (Max 10)\nArmor: \u2b1c / 0 Boxes\nInfection Track: [0] Clean (0/5)\nActive Conditions: None\n\nInventory (Strict 4 Slots)\n1. [Handgun - 15/15 rds (1 Slot)]\n2. [Combat Knife - \u2b1c\u2b1c\u2b1c (1 Slot)]\n3. [9mm Ammo Box - 15 rds (1/4 Slot) / Empty]\n4. [Empty Slot]\n", "html": "<h1 class=\"term-h1\">VERY BASIC RPG: ZOMBIE SURVIVAL EDITION (VBG-Z) v2.0</h1>\n<p class=\"term-p\"><em>A lightweight d20 ruleset for asynchronous Play-by-Post survival horror.</em></p>\n<hr class=\"term-hr\" />\n<h2 class=\"term-h2\">1. THE CORE ENGINE</h2>\n<h3 class=\"term-h3\">The Resolution Roll</h3>\n<p class=\"term-p\">When your survivor takes a risky, uncertain, or contested action under pressure:</p>\n<p class=\"term-p\"><strong>Roll:</strong> <code>1d20 + relevant Stat bonus + applicable Trait bonus</code></p>\n<p class=\"term-ol-item\">\u20
