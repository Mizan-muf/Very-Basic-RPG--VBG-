<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIOHAZARD — Tactical Terminal & VBG-Z Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #13171f;
      --panel-border: #1f2733;
      --accent: #00ff66;
      --accent-dim: rgba(0, 255, 102, 0.15);
      --danger: #ff3344;
      --warning: #ffb833;
      --text: #c5d1de;
      --text-muted: #6e7d91;
      --font-mono: 'Share Tech Mono', monospace;
      --font-sans: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Scanline effect */
    body::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 999;
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
      opacity: 0.6;
    }

    /* Sidebar */
    aside {
      width: 300px;
      background: var(--panel);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 10;
    }

    .brand {
      padding: 20px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      font-size: 24px;
      color: var(--danger);
      filter: drop-shadow(0 0 8px var(--danger));
    }
    .brand-title {
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #fff;
    }
    .brand-sub {
      font-size: 10px;
      color: var(--accent);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: var(--font-mono);
    }

    nav {
      flex: 1;
      overflow-y: auto;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.1);
    }
    .nav-btn.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 0 12px rgba(0, 255, 102, 0.1);
    }
    .nav-btn .icon { font-size: 16px; }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid var(--panel-border);
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--accent);
      margin-right: 6px;
    }

    /* Main Viewport */
    main {
      flex: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    header {
      height: 60px;
      padding: 0 28px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(19, 23, 31, 0.7);
      backdrop-filter: blur(8px);
      flex-shrink: 0;
    }
    .current-title {
      font-family: var(--font-mono);
      font-size: 16px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-links {
      display: flex;
      gap: 16px;
    }
    .doc-link-btn {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
      padding: 6px 12px;
      border: 1px solid var(--accent);
      border-radius: 4px;
      background: var(--accent-dim);
      transition: all 0.2s;
    }
    .doc-link-btn:hover {
      background: var(--accent);
      color: #000;
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 32px 48px;
      scroll-behavior: smooth;
    }
    .content-area.no-pad { padding: 0; overflow: hidden; }

    /* Markdown Reader Styling */
    .reader {
      max-width: 880px;
      margin: 0 auto;
      line-height: 1.7;
    }
    .reader h1 {
      font-size: 26px;
      color: #fff;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 12px;
      font-family: var(--font-mono);
      letter-spacing: 0.5px;
    }
    .reader h2 {
      font-size: 20px;
      color: var(--accent);
      margin: 28px 0 12px;
      font-family: var(--font-mono);
    }
    .reader h3 {
      font-size: 16px;
      color: #fff;
      margin: 20px 0 8px;
      font-family: var(--font-mono);
    }
    .reader h4 {
      font-size: 14px;
      color: var(--warning);
      margin: 16px 0 6px;
    }
    .reader p { margin-bottom: 14px; color: var(--text); }
    .reader strong { color: #fff; }
    .reader ul, .reader ol { margin: 8px 0 16px 24px; }
    .reader li { margin-bottom: 6px; }
    .reader blockquote {
      border-left: 3px solid var(--warning);
      background: rgba(255, 184, 51, 0.06);
      padding: 12px 16px;
      margin: 16px 0;
      border-radius: 0 6px 6px 0;
      color: #ebd7b5;
    }
    .reader code {
      font-family: var(--font-mono);
      background: #1b2029;
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--accent);
      font-size: 13px;
    }
    .reader hr {
      border: 0;
      border-top: 1px solid var(--panel-border);
      margin: 28px 0;
    }
    .table-wrap {
      overflow-x: auto;
      margin: 18px 0;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      font-family: var(--font-mono);
    }
    th, td {
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid var(--panel-border);
    }
    th {
      background: #181d26;
      color: #fff;
      font-weight: 600;
    }
    tr:nth-child(even) { background: rgba(255, 255, 255, 0.015); }

    /* Map Viewer Pan & Zoom */
    .map-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #050608;
    }
    .map-controls {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 50;
      background: rgba(19, 23, 31, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    .map-controls button {
      background: #1c222e;
      border: 1px solid var(--panel-border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.15s;
    }
    .map-controls button:hover {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }
    .map-hint {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      margin-left: 10px;
      margin-right: 6px;
    }

    .map-viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: grab;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .map-viewport:active { cursor: grabbing; }

    #mapImage {
      max-width: none;
      transform-origin: 0 0;
      transition: transform 0.05s ease-out;
      user-select: none;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      image-rendering: -webkit-optimize-contrast;
      image-rendering: high-quality;
    }
  </style>
</head>
